# Dependabot configuration.
#
# WHY THIS EXISTS: the repo already had `.github/workflows/dependabot-auto-merge.yml`, but no
# dependabot.yml — so nothing ever generated the PRs that workflow was written to merge. CVEs
# accumulated silently in the committed lockfiles until `gate-deps` (osv-scanner) went red on
# every branch at once, blocking unrelated work. Observed 2026-07-21: 7 known vulnerabilities
# (1 critical `tar` 9.2, 4 high, 1 medium, 1 low) in the agentify-desktop lockfile — that tree has
# since been RETIRED — all fixable by non-breaking upgrades, none introduced by any open PR.
#
# SCOPE deliberately matches what `gate-deps` actually scans (see quality.yml):
#     --lockfile=package-lock.json
#     --lockfile=tools/mcp/hacktricks-mcp-server/package-lock.json
# tools/editor/ralph-orchestrator/vendor/package-lock.json is EXCLUDED on purpose — it is a
# vendored third-party tree and the gate does not scan it. Adding it here would generate PRs for
# a tree we do not gate, and dependabot-auto-merge.yml would then squash-merge them unreviewed.
#
# NOTE on why the hacktricks entry is not optional. Omitting a directory here does NOT stop
# Dependabot opening PRs against it — SECURITY updates are repo-wide and ignore this file (PR #267
# bumped ip-address in the hacktricks tree while that directory was unlisted). So the unlisted
# state never bought safety; it only withheld routine minor/patch bumps while still letting
# security PRs through to auto-merge. The tree is now covered by BOTH gate-deps (osv-scanner) and
# gate-tests-coverage (node workspaces), so listing it here is strictly the safer configuration.
#
# Python manifests are intentionally NOT covered yet: `gate-deps` does not scan them, so a pip
# ecosystem here would produce auto-merging PRs against an ungated surface. Add them in the same
# change that extends gate-deps to python lockfiles, not before.
version: 2

updates:
  # --- root npm tree (scanned by gate-deps) ---------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR per weekly run for routine bumps keeps auto-merge volume sane.
      npm-root-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  # --- hacktricks MCP server npm tree (scanned by gate-deps as of 2026-08-09) ------------------
  - package-ecosystem: npm
    directory: /tools/mcp/hacktricks-mcp-server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-hacktricks-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  # browser-bridge/chrome-bridge-mcp landed 2026-08-28 without an entry here. Per the NOTE
  # above, that meant Dependabot still raised ALERTS against its lockfile (four hono
  # advisories on 2026-09-01) but never opened the one-line fix PR -- so the alerts sat open
  # while the patch (hono 4.12.34) was already published. With this entry, a security
  # advisory produces a PR, dependabot-auto-merge.yml turns on auto-merge, and the required
  # `quality` checks (gate-deps now reads this lockfile too) decide whether it lands.
  - package-ecosystem: npm
    directory: /browser-bridge/chrome-bridge-mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-chrome-bridge-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  # --- GitHub Actions (all 5 workflows pin by SHA; keep them current) --------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-all:
        patterns: ["*"]
    labels: [dependencies, ci]
