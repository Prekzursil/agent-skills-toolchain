name: routing-benchmark

# I5 is intentionally separate from quality.yml: that workflow has a charter-policed,
# closed set of six deterministic gates. This router is model-shaped and begins in shadow;
# only the benchmark step is continue-on-error, while its deterministic self-tests still gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routing-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing-benchmark:
    name: routing-benchmark (shadow)
    # Runner selector shared with quality.yml / skill-dual-write.yml / no-runtime-junk.yml.
    # Hardcoded ubuntu-latest left this gate unable to allocate a runner while the Actions
    # budget is exhausted (runner_id 0, conclusion failure, zero steps run) -- an infra state,
    # not a verdict. Defaults to ubuntu-latest when QUALITY_RUNNER is unset, so it is additive.
    runs-on: ${{ vars.QUALITY_RUNNER == 'self-hosted' && fromJson('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    services:
      ollama:
        image: ollama/ollama@sha256:a5409cb903d30f9cd67e9f430dd336ddc9274e16fd78f75b675c42065991b4fd # 0.11.10
        ports:
          - 11434:11434
        options: >-
          --health-cmd "ollama list"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      SEMROUTER_OLLAMA_URL: http://127.0.0.1:11434
      SEMROUTER_EMBED_MODEL: nomic-embed-text:latest
      SEMROUTER_TIMEOUT: "10"
      # Intended pin; verification against the resolved digest is a stated residual.
      OLLAMA_MODEL_DIGEST: sha256:0a109f422b47e3a30ba2b10eca18548e944e8a23073ee3f3e947efcf3c45e59f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install pytest==8.4.2
      - name: routing benchmark self-test
        run: >-
          python -m pytest
          hooks/harness-bench/test_bench.py
          hooks/harness-bench/test_gate.py
          hooks/semantic-router/test_eval.py
          ci/tests/test_routing_benchmark_wiring.py
          -q
      - name: pull pinned embedding model and verify health
        run: |
          # ollama pulls by TAG. The `name@sha256:` form is rejected with
          # `400 Bad Request: invalid model name` (measured in CI on this workflow's first run).
          docker exec "${{ job.services.ollama.id }}" ollama pull "$SEMROUTER_EMBED_MODEL"
          python hooks/semantic-router/embed.py
      # A candidate must not supply its own regression bar. On a pull_request the checkout
      # above lands the MERGE revision, so hooks/harness-bench/baseline.json is
      # candidate-controlled, and gate.py reads exactly that file: gate.py:136 ->
      # bench._load_baseline() -> bench.py:53-54
      # `Path(os.environ.get("BENCH_BASELINE", str(THIS / "baseline.json")))`.
      # gate.py:137-149 validates only counter SHAPE and corpus TOTALS -- there is no
      # provenance check -- so a PR that breaks every positive route AND rewrites the
      # committed baseline to skill 0/14, mcp 0/5 (totals preserved, so the totals guard
      # still passes) flips the verdict. Measured against the real on-disk loader:
      #   main's bar      -> FAILED:routing-regression ... skill 13/14->0/14; mcp 3/5->0/5  (rc=1)
      #   PR-supplied bar -> PASS:routing-regression deterministic-runs=5                   (rc=0)
      # Pin the bar to the BASE branch's copy instead.
      # If the base copy cannot be obtained we leave BENCH_BASELINE pointing at a path that
      # does NOT exist: _load_baseline() then returns None and the probe prints
      # `INDETERMINATE:routing-regression invalid-baseline`. Never fall back to the
      # candidate's own file -- silently reverting to it is the hole this step closes.
      - name: pin the regression bar to the base branch (pull_request only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BAR="$RUNNER_TEMP/bench-base-baseline.json"
          echo "BENCH_BASELINE=$BAR" >> "$GITHUB_ENV"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          if git show "$BASE_SHA:hooks/harness-bench/baseline.json" > "$BAR"; then
            echo "pinned the regression bar to base $BASE_SHA:"
            cat "$BAR"
          else
            rm -f "$BAR"
            echo "base baseline unavailable; the probe will report INDETERMINATE (never PASS)"
          fi
      - name: routing regression probe (5-run; shadow)
        continue-on-error: true
        run: python hooks/harness-bench/gate.py --runs 5
