name: no-runtime-junk

# Fails when git TRACKS runtime state that must never be committed: the harness manifest
# (installed.json), virtualenvs / node_modules / bytecode / tool caches, or a nested .git
# gitlink (mode 160000). Complements the gitleaks secrets gate in quality.yml.
# Detection is a `shell: python` step to avoid CRLF-in-bash issues on this Windows repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-runtime-junk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-runtime-junk:
    name: gate-no-runtime-junk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Logic lives in ci/no_runtime_junk.py (both-states --self-test). The old
      # inline copy missed harness/ast-integrate/ nested estate dumps (PRs #316/#319).
      - name: self-test no_runtime_junk both-states
        run: python ci/no_runtime_junk.py --self-test
      - name: fail if runtime junk is tracked
        run: python ci/no_runtime_junk.py
      - name: crcp reports must stay deny-by-default
        shell: python
        run: |
          import subprocess, sys

          # tools/crcp/reports/ holds live auth / session / health dumps (one of them has
          # carried a value-shaped `sk-…` string). Its .gitignore must DENY the whole tree
          # and re-admit only the human-written .md narratives, so a merely-renamed dump
          # cannot be committed by accident. A name-by-name allowlist fails OPEN.
          #
          # Both-states gate: MUST_IGNORE catches removal/weakening of the deny patterns;
          # MUST_SEE catches an over-broad rewrite that also swallows the .md narratives.
          # Every probe path is synthetic and untracked, so the check is index-independent.
          MUST_IGNORE = [
              "tools/crcp/reports/gatecheck_audit.json",
              "tools/crcp/reports/gatecheck_cookies.txt",
              "tools/crcp/reports/gatecheck_watch.jsonl",
              "tools/crcp/reports/gatecheck_state.db",
              "tools/crcp/reports/gatecheck_capture.har",
              "tools/crcp/reports/web_endgame/gatecheck_nested.json",
          ]
          MUST_SEE = [
              "tools/crcp/reports/gatecheck_narrative.md",
              "tools/crcp/reports/web_endgame/gatecheck_nested.md",
          ]

          def is_ignored(path):
              # --no-index so an already-tracked path cannot skew the answer; check-ignore
              # exits 0 when the path IS ignored, 1 when it is not.
              return subprocess.run(
                  ["git", "check-ignore", "--no-index", "-q", path]
              ).returncode == 0

          failures = []
          for path in MUST_IGNORE:
              if not is_ignored(path):
                  failures.append(f"  [fails-open] {path} is NOT ignored but must be")
          for path in MUST_SEE:
              if is_ignored(path):
                  failures.append(f"  [over-broad] {path} IS ignored but must stay visible")

          if failures:
              print("tools/crcp/.gitignore no longer denies by default:")
              print("\n".join(failures))
              sys.exit(1)
          print("OK: crcp reports deny-by-default holds (6 denied, 2 admitted).")
      # A committed document may not publish a command that a clone cannot run. The SLOP
      # lane found 45 probe scripts named by committed artifacts while .gitignore kept every
      # one untracked -- the citation resolved on the author's disk and resolved to nothing
      # for everyone else. It carried those 45; nothing stopped the 46th, and there already
      # is one. This gate extracts every `python <path>` invocation from the tracked .md
      # under command-center/ and docs/ and requires <path> to be TRACKED.
      #
      # --self-test runs FIRST and on purpose: it proves the gate can still go RED (synthetic
      # known-bad flagged, known-good clean) before its silence is allowed to mean anything.
      # A gate that has never failed is indistinguishable from a no-op, and this repo has
      # shipped that exact shape. Red-proof, in a fresh LF clone with the pre-existing CI
      # measured blind to the same injected defect:
      # command-center/slop-report/_i3_integration_redproof.out.json
      - name: gate-published-commands (no doc may publish a command a clone cannot run)
        run: |
          python command-center/slop-report/check_published_commands.py --self-test
          python command-center/slop-report/check_published_commands.py
      # A committed SLOP report may not publish a number its own committed receipt
      # refutes. Round 6 of this lane found two such lines BY HAND in SLOP-BUILD-R5.md: a
      # histogram published `d-zero=18` against a receipt saying 23, whose parts summed to
      # 300 against the 305 asserted in the same sentence. Nothing mechanical was checking
      # any of it, and every adversarial finding against this lane across seven rounds was
      # the same shape -- the receipt was right and the SENTENCE was wider than it.
      #
      # `--committed` reads the docs AND the receipts from HEAD blobs, which is the question
      # a CLONE asks. The default worktree mode answers only "clean on this disk" -- the
      # false negative round 7 measured in BOTH directions on a genuinely divergent key
      # (`n_before`, worktree 73 against committed 1). It writes no receipt, so the step
      # cannot dirty the tree it is checking.
      #
      # There is no separate --self-test here, on purpose: the T1/T5 both-states fixtures
      # live INSIDE the gate, run on every invocation and gate its exit code, so a silent
      # result is impossible without them having fired first. A gate that has never failed
      # is indistinguishable from a no-op, and this repo has shipped that exact shape.
      # Red-proof, executed in a fresh LF clone with the pre-existing CI measured BLIND to
      # the same injected defect:
      # command-center/slop-report/_i9_claims_redproof.out.json
      - name: gate-published-claims (no report may publish a number its receipt refutes)
        run: |
          python command-center/slop-report/_r6_transcript.py --committed
