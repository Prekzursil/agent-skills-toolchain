name: unit-artifact-manifest

# Condition 11 ("output was registered in the artifact manifest") producer gate.
#
# WHY THIS EXISTS. The owner decision (command-center/p2-next/OWNER-DECISION-condition-11.md,
# Option B) chose a dedicated unit-artifact manifest: the charter
# command-center/ARTIFACT-MANIFEST.json is a FIXED 14-file contract and must stay
# untouched. tools/command-center/unit_manifest.py is the producer, but it shipped
# UNWIRED and UNWRITABLE: its v1 derivation walked every receipt under
# receipts/adversarial/audit and failed closed on the first of ~90 receipts naming
# probe outputs that were never committed (measured 2026-09-19,
# command-center/p2-next/C11-MISSING-ARTIFACTS.json), so
# command-center/UNIT-ARTIFACT-MANIFEST.json could never exist while receipts
# already pointed at it. A fixed script that nothing invokes is not a fix -- the
# same shape p2next-rail-count.yml was created to close.
#
# WHY ITS OWN FILE AND NOT A JOB IN quality.yml. quality.yml is a CLOSED gate set
# policed by .quality/charter_check.sh, which scans it BIDIRECTIONALLY: a new
# `gate-<slug>` marker there with no matching `- slug:` in .quality/charter.yml
# makes charter_check.sh exit 1 and turns the EXISTING lint job red. It reads ONLY
# quality.yml, so a separate workflow carries no charter obligation -- the shape
# no-runtime-junk.yml, skill-dual-write.yml and p2next-rail-count.yml already use.
# A separate file is also the only option that touches no file a sibling lane is
# editing.
#
# WHY THE SELF-TEST RUNS FIRST. A gate that has never failed is indistinguishable
# from a no-op, and a registration producer that has never refused anything is
# indistinguishable from a no-op. The self-test proves both states for every
# fatal rule (registered claimer naming an absent artifact is FATAL; empty walk
# fails closed; zero-registrable fails closed; drift is red; a clean corpus is
# green; receipts declaring OTHER manifests are ignored).
#
# WHY --check AND NOT --write. Check derives and asserts but never rewrites the
# artifact it verifies: a gate that can rewrite its own subject launders it (the
# vendor_satisfiability.py precedent in p2next-rail-count.yml). Regenerating the
# manifest after a legitimate receipt change is an explicit local
# `--write` + commit, reviewed in the diff like any other artifact.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-artifact-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-artifact-manifest:
    name: gate-unit-artifact-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: gate-unit-artifact-manifest self-test
        run: python tools/command-center/unit_manifest.py --self-test
      # The gate. Re-derives the closed registration contract (every receipt whose
      # manifest_registration.manifest_path names command-center/UNIT-ARTIFACT-MANIFEST.json)
      # from the COMMITTED tree and fails on drift, on any claimed registration that
      # cannot be honored, on an empty walk, or on a zero-registrable corpus.
      - name: gate-unit-artifact-manifest
        run: python tools/command-center/unit_manifest.py --check
