name: skill-dual-write

# D-001 dual-write gate. `.agents/skills/` is the authoritative skill root and
# `skills/` a generated compatibility projection (AGENTS.md). CI uses final-tree
# strict parity: every changed path in either root must have the same mode and blob
# at the corresponding path in the other root. This permits a projection-only
# repair to unchanged canonical content while rejecting canonical-only drift.
#
# WHY ITS OWN WORKFLOW AND NOT A 7th JOB IN quality.yml:
# quality.yml is a CLOSED gate set policed by `.quality/charter_check.sh`, which
# scans quality.yml BIDIRECTIONALLY: every `gate-<slug>` marker there must map
# back to a `- slug:` entry in .quality/charter.yml. Adding a `gate-skill-dual-write`
# job to quality.yml without adding its charter slug in the same change makes that
# script exit 1 and turns the EXISTING lint job red (measured). charter_check.sh
# reads ONLY quality.yml, so a separate workflow carries no charter obligation --
# the same shape `no-runtime-junk.yml` already uses for a bespoke repo-structure
# gate. Registering this as a 7th charter gate instead is a legitimate alternative;
# it requires THREE coordinated edits (quality.yml + .quality/charter.yml +
# QUALITY-CHARTER.md), not one.
#
# There is no repo-wide test autodiscovery in this repository: a check runs only
# because a step below invokes it by an explicit path. The self-test step runs
# FIRST so neither D-001 detector can fail a PR while its own tests are broken.
#
# UNVERIFIED [likely 55-80%]: on a `pull_request` event `actions/checkout` checks out the
# MERGE commit by default, so `--base origin/main --head HEAD` may measure the
# merged result rather than the branch tip. The changed-path final-tree verdicts
# should agree, but "should" is not a receipt and this has NOT been settled here.
# Settling probe (needs owner approval -- it pushes and then deletes a ref): push a
# scratch branch carrying a `skills/__probe/SKILL.md`-only commit, confirm this run
# is RED, then delete the branch. Until that is run, treat the merge-commit
# semantics as untested and the pull-request gate as advisory on that one axis.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skill-dual-write-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-dual-write:
    name: gate-skill-dual-write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install pytest==8.4.2
      # Self-test FIRST: a guard whose own acceptance tests are red must not be
      # trusted to judge a pull request.
      - name: gate-skill-dual-write self-test
        run: python -m pytest ci/tests tools/d001-dual-write/tests -q
      # L10: the vault->live deploy drift reporter. Named EXPLICITLY as well as
      # covered by the directory glob above, because this repo has no test
      # autodiscovery and the `ci/tests` glob is one refactor away from not
      # containing this file. The suite is hermetic (tmp_path only) -- the runner
      # has no ~/.claude or ~/.agents tree, and the tool is a LOCAL operator
      # command against those live trees, not a CI gate over them.
      - name: gate-skill-deploy-drift self-test
        run: python -m pytest ci/tests/test_check_skill_deploy_drift.py -q
      # L11: the LAST hop, `scripts/deploy-skills-daily.py`, which writes into
      # ~/.claude/skills.daily -- the one tree Claude Code reads. Named explicitly
      # for the same reason as L10, plus one this file did not have before: the
      # tool's own `--self-test` structurally CANNOT reach P4 (dry-run default,
      # and `--apply` refusing on a red self-test), because it returns before
      # main() ever reaches the --apply branch. Two mutants were measured
      # surviving it -- deleting the --apply precondition, and forcing
      # apply=True -- and both are killed only by the suite below. This step also
      # carries the reachability assertion: if no curated skill tells an agent to
      # run the tool, the deploy hop is unreachable and skills authored in the
      # live tree stay orphaned from git, which is the root cause of all the
      # regenerating skill drift. Hermetic (tmp_path only); the runner has no
      # ~/.claude tree and this is a LOCAL operator command, not a CI gate over it.
      - name: gate-skill-deploy-hop self-test
        run: python -m pytest ci/tests/test_deploy_skills_daily.py -q
      # The Claude Science WIRING gate. Named explicitly for the same reason as L10/L11: the
      # `ci/tests` glob above would already collect it, and the glob is one refactor away from
      # not containing it. Hermetic -- it reads only committed files under scripts/claude-science,
      # commands/, agent-self/config/commands/ and the two skill roots, and copies them into
      # tmp_path to mutate; it needs no WSL, no daemon, no scheduled task and no Windows.
      # It lives HERE rather than in quality.yml because `.quality/charter_check.sh` scans ONLY
      # quality.yml bidirectionally, so a `gate-` marker there without a matching charter slug
      # turns the existing lint job red -- the same reasoning that put this whole workflow in its
      # own file. WHAT IT CATCHES: the defect class that cost this lane three rounds -- a slash
      # command routed at a stale checkout, a deployer pinned to one, a documented probe that
      # install.ps1 never deployed, a seam file dropped from the deploy list, a config literal
      # escaping the seam. Every one of its ten codes has a paired mutation in the same file.
      - name: gate-cs-wiring self-test
        run: python -m pytest ci/tests/test_cs_wiring.py -q
      # Exact route comparison catches stale names and old skills/ routes; the
      # generator carries forward declared-only compatibility names.
      - name: gate-skill-surface-manifest
        run: python ci/gen_skill_index.py --check --fail-on-drift
      # The PUBLICATION index above and the human INVENTORY below are different
      # documents: a skill can be routed in marketplace.json and still be absent from
      # skills/SKILLS-MANIFEST.md, which is exactly what was measured (336 tracked
      # skills, 160 rows, 176 false negatives on exact lookup). This step keeps the
      # "auto-generated inventory" claim in that file's header true.
      - name: gate-skills-manifest-inventory
        run: python ci/gen_skills_manifest.py --check
      # `actions/checkout` does not create refs/remotes/origin/main; the three-dot
      # merge-base range needs it to exist.
      - name: gate-skill-dual-write fetch base
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: gate-skill-dual-write D-001 gate
        run: python ci/check_skill_dual_write.py --base origin/main --head HEAD --strict-parity
