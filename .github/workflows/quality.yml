name: quality

# Lean deterministic quality gate — the single quality contract for this repo.
# Adopts the QZT lean-gate model (Prekzursil/quality-zero-platform reusable-quality.yml /
# the proven Prekzursil/reframe lean gate): a closed set of 6 gates + a charter-consistency
# check, every tool version-pinned and configured from an in-repo file — no --config auto,
# no registry login, no network-fetched rule packs in the gate. See QUALITY-CHARTER.md.
#
#   1. lint-format     ruff 0.15.17          ruff check + ruff format --check (honors ruff.toml)
#   2. types           basedpyright 1.39.8   per-package source, standard mode
#   3. tests-coverage  pytest + node         100% line+branch for the two py packages + node tests
#   4. sast            opengrep 1.23.0        curated in-repo ruleset .quality/opengrep/ (clean-zero)
#   5. secrets         gitleaks              committed .gitleaks.toml allowlist
#   6. deps            osv-scanner           npm + python lockfiles, reasoned ignores in osv-scanner.toml
#
# WHY INLINE AND NOT A THIN CALLER OF reusable-quality.yml:
# The QZT reusable workflow auto-detects a tree and runs ONE whole-repo Python coverage lane
# (`pytest --cov --cov-fail-under=100`) and ONE whole-repo basedpyright lane. This repo is a
# multi-package monorepo: hundreds of untested skill/hook scripts live beside two 100%-covered
# packages (tools/mcp-manager, tools/scholarly-access-mcp), and basedpyright needs each package's
# deps installed from its own root. A whole-repo 100%-coverage / whole-repo type lane cannot pass
# here. We therefore adopt the lean MODEL inline — same pinned tools, same curated SAST ruleset,
# same charter + one-in/one-out discipline — with the per-package type/coverage lanes the monorepo
# actually needs. If the reusable workflow gains per-package inputs this can become a thin caller.
#
# All actions are SHA-pinned (supply-chain hardening); bump the SHA + the `# vX` comment together.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: gate-lint-format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      # Self-contained pinned ruff (mirrors reframe): honors the committed ruff.toml
      # (extend-exclude = vendored ralph-orchestrator tree + notebook templates). ruff
      # check = lint + sec-lint; ruff format --check = the format gate. Keep the pin in
      # lockstep with QUALITY-CHARTER.md and the local dev command in README.md.
      - name: gate-lint-format ruff (install)
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.17
      - name: gate-lint-format ruff check
        run: ruff check --output-format=github .
      - name: gate-lint-format ruff format --check
        run: ruff format --check .
      # Charter <-> workflow consistency (one-in / one-out): fails if the closed gate set
      # in .quality/charter.yml diverges from the gate-<slug> markers in this workflow.
      - name: charter consistency check
        run: bash .quality/charter_check.sh
      # monitorcore is VENDORED into consuming skills as a committed copy (sync-skills.ps1
      # deploys committed skill dirs wholesale). tools/monitorcore/ is the single CI-gated
      # source of truth; this fails the gate if the vendored copy has drifted. Deliberately
      # NOT a `gate-<slug>` step name so charter_check.sh's reverse check ignores it.
      - name: monitorcore vendor-drift (tools == vendored)
        run: |
          diff -r --exclude=__pycache__ \
            tools/monitorcore/monitorcore \
            skills/workflow-monitor/monitorcore

  types:
    name: gate-types (basedpyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install basedpyright==1.39.8
      # Each package is type-checked from its OWN root so its flat top-level modules
      # (core/app/scholarly_access) resolve as absolute imports — the way they are actually
      # run (pip install -e .). Deps are installed so 3rd-party imports resolve. Only package
      # SOURCE is checked; test code (monkeypatch / loose fixtures) is intentionally not
      # strictly typed. basedpyright runs at standard mode (its config in each package).
      - name: gate-types mcp-manager (source)
        working-directory: tools/mcp-manager
        run: |
          pip install -e ".[dev]"
          basedpyright core ui app.py
      - name: gate-types scholarly-access-mcp (source)
        working-directory: tools/scholarly-access-mcp
        run: |
          pip install -e .
          basedpyright scholarly_access
      - name: gate-types taskwatch_monitor (source)
        working-directory: tools/taskwatch_monitor
        run: |
          pip install -e ".[dev]"
          basedpyright core probes cli mcp_server hooks ui
      - name: gate-types monitorcore (source)
        working-directory: tools/monitorcore
        run: |
          pip install -e ".[dev]"
          basedpyright monitorcore
      # agent-self/harness — the enshrined shared lifecycle harness (SSOT for the live
      # ~/.agents/harness deploy loop; see agent-self/harness/README.md). It ships NO
      # pyproject (byte-exact projection of the live tree the installer deploys), so standard
      # mode + the source include/exclude come from an EPHEMERAL pyrightconfig.json written
      # here at runtime and never committed (committing it would drift the byte-exact tree).
      # Run from agent-self/ so the package's dual `from harness.X` / `from .X` imports
      # resolve; SOURCE only (tests excluded, like every other package). Stdlib-only + an
      # optional PyYAML import (bundled typeshed stub resolves it for the type pass).
      - name: gate-types harness (source)
        working-directory: agent-self
        run: |
          printf '%s\n' '{"typeCheckingMode":"standard","pythonVersion":"3.11","include":["harness"],"exclude":["harness/tests","**/__pycache__","**/backups"]}' > pyrightconfig.json
          basedpyright

  test-node:
    name: gate-tests-coverage (node workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - name: gate-tests-coverage agentify-desktop
        working-directory: tools/web/agentify-desktop
        run: |
          npm install --omit=dev --no-audit
          npm test

  test-python:
    name: gate-tests-coverage (python packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: gate-tests-coverage mcp-manager
        working-directory: tools/mcp-manager
        run: |
          pip install -e ".[dev]"
          pytest --cov=. --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: gate-tests-coverage scholarly-access-mcp
        working-directory: tools/scholarly-access-mcp
        run: |
          pip install -e . pytest pytest-cov
          pytest --cov=scholarly_access --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: gate-tests-coverage taskwatch_monitor
        working-directory: tools/taskwatch_monitor
        run: |
          pip install -e ".[dev]"
          pytest --cov=. --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: gate-tests-coverage monitorcore
        working-directory: tools/monitorcore
        run: |
          pip install -e ".[dev]"
          pytest --cov=monitorcore --cov-branch --cov-report=term-missing --cov-fail-under=100
      # agent-self/harness — the enshrined shared lifecycle harness (SSOT for the live
      # ~/.agents/harness deploy loop). Runs its full pytest suite on the CI interpreter as a
      # REGRESSION gate for the projected tree, and measures branch coverage (term-missing).
      # Deliberately NOT a --cov-fail-under=100 lane: unlike the four TDD-built packages above,
      # this is a byte-exact projection of a pre-existing runtime (~85% source coverage today),
      # so a hard 100% bar would misrepresent it and pin main red — closing to parity is tracked
      # follow-up. No working-directory / editable install: tests/conftest.py puts agent-self/ on
      # sys.path so `import harness` resolves the projected package from the repo root. PyYAML is
      # a real runtime dep of recall_index's frontmatter parser (its tests assert parsed values).
      - name: gate-tests-coverage harness (enshrined runtime; measured, not 100%-gated)
        run: |
          pip install pytest pytest-cov pyyaml
          python -m pytest agent-self/harness/tests -q --cov=agent-self/harness --cov-branch --cov-report=term-missing
      # hooks/cmd-rewrite — the SOLE PreToolUse rewriter for the Bash tool. There is no
      # repo-wide test autodiscovery here, so these suites run only because this step names
      # them; without it they are dead weight that cannot catch a regression. Both are
      # stdlib-only custom runners (no pytest, no install) that exit non-zero on failure, so
      # they gate directly. Reuses the existing `gate-tests-coverage` charter slug on purpose
      # — it is not a new gate, so .quality/charter_check.sh stays consistent with no
      # charter.yml edit. NOT a --cov-fail-under lane: like the harness step above this is a
      # projection of a live runtime, and its own runner reports pass/fail, not coverage.
      # The MSYS argv fixtures SKIP on Linux BY CONSTRUCTION (MSYS path conversion cannot
      # occur off Windows); what runs here is the pure-policy layer plus the emission-safety
      # invariant that `bash -n` accepts every rewrite the hook would emit — the property
      # whose absence let a round-1 revision ship shell that did not parse.
      # Measured on an ubuntu-equivalent (python 3.12.3, bash 5.2.21):
      #   test_msys_pathconv.py -> 116 passed, 0 failed, 7 skipped, exit 0
      #   test_hooks.py         -> 37/37 passed, exit 0
      - name: gate-tests-coverage cmd-rewrite hooks (msys-pathconv + no-pager)
        working-directory: hooks/cmd-rewrite
        run: |
          python test_msys_pathconv.py
          python test_hooks.py

      - name: gate-tests-coverage strict-target hook manifests
        run: |
          python -m pytest ci/tests/test_emit_hook_manifest.py -q
          python ci/emit_hook_manifest.py --source hooks/hooks.json --target codex-plugin --check
          python ci/emit_hook_manifest.py --source agent-self/config/hooks/hooks.json --target codex-plugin --check

      # L13 adoption: the checked-in adversarial corpus plus its miner regressions.
      - name: gate-tests-coverage adversarial harness corpus
        run: |
          python -m pytest \
            ci/tests/test_harness_corpus_wiring.py \
            tools/harness-corpus/test_hook_telemetry.py \
            hooks/git-hygiene/test_docs_hygiene.py -q
      # G-10: hooks/_shared suites are standalone scripts with their own __main__, so pytest
      # DISCOVERY is not evidence that they ran — call this one explicitly.
      - name: gate-tests-coverage hook-manifest provenance
        run: python hooks/_shared/test_manifest_provenance.py
      # G-06: the schema module is tested AND its linter is run over the checked-in
      # workflows, so a schema defect in a production workflow fails the gate.
      - name: gate-tests-coverage fanout-schema (module + production lint)
        working-directory: tools/fanout-schema
        run: |
          npm test
          npm run lint -- ../../workflows

  sast:
    name: gate-sast (opengrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Gate 4 — static security analysis with the CURATED in-repo ruleset under
      # .quality/opengrep/ (NOT --config auto: registry packs are network-fetched and drift,
      # making the gate non-deterministic). Clean-zero: 0 findings, no baseline. Genuine
      # false-positives are suppressed inline with a greppable `# nosemgrep: <rule-id> -- reason`.
      # opengrep binary is pinned; the rules are opengrep/semgrep-compatible (verified locally
      # with semgrep CE 1.166.0). Excludes mirror the local verification command in the ruleset README.
      - name: gate-sast opengrep (curated in-repo ruleset)
        run: |
          curl -fsSL -o /usr/local/bin/opengrep \
            https://github.com/opengrep/opengrep/releases/download/v1.23.0/opengrep_manylinux_x86
          chmod +x /usr/local/bin/opengrep
          opengrep scan --config .quality/opengrep --error \
            --exclude node_modules --exclude .venv --exclude vendor \
            --exclude dist --exclude out --exclude build .

  secrets:
    name: gate-secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      # Gate 5 — secret scan over full history, honoring the committed .gitleaks.toml
      # allowlist (owner-intentional private-env store + reasoned doc/fixture placeholders).
      # New real secrets outside those explicit paths still fail the gate.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # Pin gitleaks to a version that HONORS the committed .gitleaks.toml plural
          # [[allowlists]] path waivers. The action's default (8.24.3) does NOT apply
          # plural allowlist path waivers (see the .gitleaks.toml history note), so the
          # synthetic FAKE secret fixtures under the allowlisted test paths (incl.
          # agent-self/harness/tests/) false-flag the gate. 8.30.1 is verified to report
          # 0 leaks over this tree with the same committed config.
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # gitleaks-action needs GITHUB_TOKEN to enumerate PR commits on pull_request
          # events (push works without it); without it the gate hard-fails on every PR.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: gate-deps (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Gate 6 — known-CVE scan of the committed npm lockfiles. Reasoned, dated per-CVE
      # ignores live in osv-scanner.toml (auto-loaded from the repo root); no baseline.
      - uses: google/osv-scanner-action/osv-scanner-action@9bb69575e74019c2ad085a1860787043adf47ccb # v2.2.4
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --lockfile=tools/web/agentify-desktop/package-lock.json
