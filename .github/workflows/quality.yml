      - name: gate-tests-coverage review-severity coherence
        run: python -m pytest ci/tests/test_review_severity_coherence.py -q
      # G-10: hooks/_shared suites are standalone scripts with their own __main__, so pytest
      # DISCOVERY is not evidence that they ran — call this one explicitly.
