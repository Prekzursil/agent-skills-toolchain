name: quality

# Lean deterministic quality gate — the single quality contract for this repo.
# Adopts the QZT lean-gate model (Prekzursil/quality-zero-platform reusable-quality.yml /
# the proven Prekzursil/reframe lean gate): a closed set of 6 gates + a charter-consistency
# check, every tool version-pinned and configured from an in-repo file — no --config auto,
# no registry login, no network-fetched rule packs in the gate. See QUALITY-CHARTER.md.
#
#   1. lint-format     ruff 0.15.17          ruff check + ruff format --check (honors ruff.toml)
#   2. types           basedpyright 1.39.8   per-package source, standard mode
#   3. tests-coverage  pytest + node         100% line+branch for the two py packages + node tests
#   4. sast            opengrep 1.23.0        curated in-repo ruleset .quality/opengrep/ (clean-zero)
#   5. secrets         gitleaks              committed .gitleaks.toml allowlist
#   6. deps            osv-scanner           npm + python lockfiles, reasoned ignores in osv-scanner.toml
#
# WHY INLINE AND NOT A THIN CALLER OF reusable-quality.yml:
# The QZT reusable workflow auto-detects a tree and runs ONE whole-repo Python coverage lane
# (`pytest --cov --cov-fail-under=100`) and ONE whole-repo basedpyright lane. This repo is a
# multi-package monorepo: hundreds of untested skill/hook scripts live beside two 100%-covered
# packages (tools/mcp-manager, tools/scholarly-access-mcp), and basedpyright needs each package's
# deps installed from its own root. A whole-repo 100%-coverage / whole-repo type lane cannot pass
# here. We therefore adopt the lean MODEL inline — same pinned tools, same curated SAST ruleset,
# same charter + one-in/one-out discipline — with the per-package type/coverage lanes the monorepo
# actually needs. If the reusable workflow gains per-package inputs this can become a thin caller.
#
# All actions are SHA-pinned (supply-chain hardening); bump the SHA + the `# vX` comment together.

on:
  push:
    branches: [main]
  # DELIBERATELY NO `branches:` FILTER on pull_request.
  #
  # This key used to read `branches: [main]`, which meant a STACKED pull request -- one whose
  # base is another open PR's head rather than main -- matched no trigger at all and ran ZERO
  # gates. Measured 2026-08-09 on this repo with two mechanically independent signals:
  #   * CONFIG: this key read `branches: [main]`.
  #   * RUN HISTORY (`gh run list`): PR #275 (base `main`) drew four pull_request-event runs --
  #     quality, routing-benchmark, skill-dual-write, no-runtime-junk -- while PR #274, stacked
  #     on #275's head `chore/harness-reconcile-20260808`, drew ZERO pull_request runs and had
  #     to be gated by hand with `gh workflow run quality.yml`.
  # The PR UI renders "no checks" the same way it renders "checks not required", so the failure
  # mode is a stacked PR that reads as UNCHECKED-BUT-FINE rather than as UNGATED.
  #
  # An allow-list (`branches: [main, 'chore/**', 'feat/**', 'fix/**']`) was considered and
  # REJECTED: it silently reintroduces the identical hole for any base outside the enumerated
  # prefixes (the wave-3 lanes that found this branch as `wave3/*`, and the historical stack
  # here based on `fix/derive-167-settlement`). A gate that is only correct for branch names
  # someone remembered to list is the defect, not the fix.
  #
  # COST: `pull_request` fires only when a PR exists, so the added volume is exactly the stacked
  # PRs that previously ran nothing -- 3 of the last 60 PRs on this repo (5%). Part of that is
  # already being paid as manual `workflow_dispatch` runs (4 of the last 100 quality runs), which
  # this change removes the need for. `push:` stays pinned to main, so no branch push gains a run.
  pull_request:
  workflow_dispatch:
    inputs:
      runner-type:
        description: 'Runner type override (dispatch only; repo var QUALITY_RUNNER applies to all events)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read

env:
  # Runner selection: Primary source is repo variable QUALITY_RUNNER (set via `gh variable set`).
  # Dispatch input can override for single-run testing. Defaults to ubuntu-latest if unset.
  # Set QUALITY_RUNNER=self-hosted to use WSL runner for all events (push/PR/dispatch).
  RUNNER_TYPE: ${{ github.event.inputs.runner-type || vars.QUALITY_RUNNER || 'ubuntu-latest' }}

# `github.ref` is `refs/pull/<N>/merge` for a pull_request event, so this group key is already
# unique per PR NUMBER and is entirely independent of the PR's BASE branch -- widening the
# trigger above therefore cannot make two PRs share a group, and needs no change here.
# Deliberately NOT switched to `github.head_ref || github.ref`: `head_ref` is the SOURCE branch,
# so two PRs opened from one head (exactly what a stack plus an auto-retarget produces) would
# collide and cancel each other -- the over-broad-group trap. A manual `workflow_dispatch` on a
# branch lands in `quality-refs/heads/<branch>`, a different group from that branch's PR run, so
# the two can run concurrently; that is ACCEPTED rather than merged, because every key that would
# merge those two also merges runs that must not cancel each other.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: gate-lint-format (ruff)
    runs-on: ${{ (github.event.inputs.runner-type || vars.QUALITY_RUNNER) == 'self-hosted' && fromJson('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Self-contained pinned ruff (mirrors reframe): honors the committed ruff.toml
      # (extend-exclude = vendored ralph-orchestrator tree + notebook templates). ruff
      # check = lint + sec-lint; ruff format --check = the format gate. Keep the pin in
      # lockstep with QUALITY-CHARTER.md and the local dev command in README.md.
      - name: gate-lint-format ruff (install)
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.17
      - name: gate-lint-format ruff check
        run: ruff check --output-format=github .
      - name: gate-lint-format ruff format --check
        run: ruff format --check .
      # Charter <-> workflow consistency (one-in / one-out): fails if the closed gate set
      # in .quality/charter.yml diverges from the gate-<slug> markers in this workflow.
      - name: charter consistency check
        run: bash .quality/charter_check.sh
      # monitorcore is VENDORED into consuming skills as a committed copy (sync-skills.ps1
      # deploys committed skill dirs wholesale). tools/monitorcore/ is the single CI-gated
      # source of truth; this fails the gate if a vendored copy has drifted. Deliberately
      # NOT a `gate-<slug>` step name so charter_check.sh's reverse check ignores it.
      #
      # WAS a hardcoded `diff -r` of ONE pair (tools/... vs skills/workflow-monitor/...).
      # That left the SECOND committed copy, .agents/skills/workflow-monitor/monitorcore,
      # named in no workflow at all -- measured with a positive control:
      #   grep -c "skills/workflow-monitor/monitorcore" quality.yml = 1  (matcher fires)
      #   grep -c "\.agents/skills/workflow-monitor"    quality.yml = 0  (genuinely absent)
      # so a change landing in tools/ + skills/ passed CI while the .agents copy rotted.
      # vendordrift.py DISCOVERS every tracked `*/monitorcore/__init__.py` instead, so a
      # third copy cannot arrive ungated, and it compares committed blob OIDs rather than
      # worktree bytes -- `diff -r` compares CRLF worktree bytes on a Windows checkout,
      # which is not what a fresh Linux clone materialises. Fails closed on an empty walk.
      - name: monitorcore vendor-drift (every committed copy)
        run: python tools/measure-guard/vendordrift.py
      # D-wu-19: the codex-runner installs ci/skills-allowlist/* VERBATIM into
      # $HOME/.agents/skills (codex-runner.yml:163) and skill_surface_census.py then
      # merkle-compares the two roots, so the acceptance-review helper must live IN the
      # allowlist -- copying it in after the census would fail the census. That makes it
      # a second copy of the canonical script; this is its drift guard. Deliberately NOT
      # a `gate-<slug>` step name, same rationale as the monitorcore step above.
      - name: acceptance-review helper drift (canonical == CI projection)
        run: |
          diff \
            .agents/skills/acceptance-review/scripts/acceptance_review.py \
            ci/skills-allowlist/acceptance-review/scripts/acceptance_review.py

  types:
    name: gate-types (basedpyright)
    runs-on: ${{ (github.event.inputs.runner-type || vars.QUALITY_RUNNER) == 'self-hosted' && fromJson('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install basedpyright==1.39.8
      # Each package is type-checked from its OWN root so its flat top-level modules
      # (core/app/scholarly_access) resolve as absolute imports — the way they are actually
      # run (pip install -e .). Deps are installed so 3rd-party imports resolve. Only package
      # SOURCE is checked; test code (monkeypatch / loose fixtures) is intentionally not
      # strictly typed. basedpyright runs at standard mode (its config in each package).
      - name: gate-types mcp-manager (source)
        working-directory: tools/mcp-manager
        run: |
          pip install -e ".[dev]"
          basedpyright core ui app.py
      - name: gate-types scholarly-access-mcp (source)
        working-directory: tools/scholarly-access-mcp
        run: |
          pip install -e .
          basedpyright scholarly_access
      - name: gate-types taskwatch_monitor (source)
        working-directory: tools/taskwatch_monitor
        run: |
          pip install -e ".[dev]"
          basedpyright core probes cli mcp_server hooks ui
      - name: gate-types monitorcore (source)
        working-directory: tools/monitorcore
        run: |
          pip install -e ".[dev]"
          basedpyright monitorcore
      # tools/agentspec — the portable agent-workflow SPEC, the shared observation envelope and
      # the dispatch-safety pure core. Stdlib-only with ZERO runtime deps, so nothing but
      # pytest/pytest-cov is installed and no sibling package needs to be on the search path.
      # That absence is deliberate: `pip install -e ../<pkg>` is INVISIBLE to basedpyright
      # (setuptools emits a MetaPathFinder plus a .pth that only executes an import statement,
      # and basedpyright neither runs .pth code nor follows a finder), so any FUTURE consumer of
      # agentspec must add `[tool.basedpyright] extraPaths = ["../agentspec"]` rather than rely
      # on the editable install. Reuses the existing `gate-types` charter slug on purpose — it is
      # not a new gate, so .quality/charter_check.sh stays consistent.
      - name: gate-types agentspec (source)
        working-directory: tools/agentspec
        run: |
          pip install -e ".[dev]"
          basedpyright agentspec
      # tools/mcpctl -- read-only MCP inventory core. NO install step on purpose: the
      # package SOURCE imports stdlib only, and basedpyright resolves `mcpctl` from this
      # working-directory (its own project root) exactly as it does for monitorcore
      # above. mcpctl also contains no STATIC `import monitorcore` -- its optional reuse
      # of monitorcore goes through importlib with a string module name -- so this step
      # cannot hit the measured trap where `pip install -e ../monitorcore` is invisible
      # to basedpyright and reds the gate.
      - name: gate-types mcpctl (source)
        working-directory: tools/mcpctl
        run: basedpyright mcpctl
      # tools/agentrail — the config-driven multi-rail dispatch shell over agentspec. Unlike
      # mcpctl above it DOES carry a STATIC `from agentspec.X import Y` in six modules, so it hits
      # the trap the agentspec step at :111-119 predicted head-on: `pip install -e ../agentspec` is
      # INVISIBLE to basedpyright (setuptools emits a MetaPathFinder plus a `.pth` holding an
      # import statement, and basedpyright neither executes the `.pth` nor follows the finder).
      # The fix is `[tool.basedpyright] extraPaths = ["../agentspec"]` in this package's
      # pyproject.toml, which resolves the sibling STATICALLY from the tree and therefore needs no
      # install step here at all.
      #
      # That guard is LOAD-BEARING, unlike mcpctl's inert one, and was proven BOTH WAYS rather
      # than assumed — measured 2026-07-27 with basedpyright 1.39.8 on this tree:
      # extraPaths commented out -> 17 errors (`Import "agentspec.clock" could not be resolved`);
      # extraPaths restored      ->  0 errors. tests/test_quality_invariants.py asserts the line
      # is still present, so deleting it fails the test suite as well as this gate.
      #
      # Reuses the existing `gate-types` charter slug on purpose — it is not a new gate.
      - name: gate-types agentrail (source)
        working-directory: tools/agentrail
        run: basedpyright agentrail
      # tools/mcpapply -- the MUTATION sibling of mcpctl (plan/apply the five config
      # scopes, the stream-json live-control channel behind a port, the token/RAM impact
      # preview, and the loopback-only stdlib web GUI). It exists as its own package
      # because mcpctl is read-only BY CONSTRUCTION: an mcpctl test walks the AST of
      # every module there and fails on any write call, any out-of-process call, and any
      # http/socket/urllib import -- so the writer, the process guard and the GUI cannot
      # live in it without breaking the gate that makes it trustworthy to read from.
      #
      # NO install step: the package SOURCE is stdlib-only apart from mcpctl, which is
      # resolved by `[tool.basedpyright] extraPaths = ["../mcpctl"]` in its pyproject.
      # That line is LOAD-BEARING here (unlike the inert guard of the same name in
      # mcpctl), and it is the measured B1 trap: `pip install -e ../mcpctl` is INVISIBLE
      # to basedpyright, because setuptools emits a MetaPathFinder inside a .pth holding
      # executable code and basedpyright neither runs .pth code nor follows a finder.
      # Both-states probe, 2026-07-27, in a venv where mcpctl WAS editable-installed:
      # with extraPaths `0 errors`; with it commented out `17 errors`, all
      # reportMissingImports on `mcpctl.*`. So the editable install alone does not
      # satisfy this step -- do not "simplify" it away.
      - name: gate-types mcpapply (source)
        working-directory: tools/mcpapply
        run: basedpyright mcpapply
      # agent-self/harness — the enshrined shared lifecycle harness (SSOT for the live
      # ~/.agents/harness deploy loop; see agent-self/harness/README.md). It ships NO
      # pyproject (byte-exact projection of the live tree the installer deploys), so standard
      # mode + the source include/exclude come from an EPHEMERAL pyrightconfig.json written
      # here at runtime and never committed (committing it would drift the byte-exact tree).
      # Run from agent-self/ so the package's dual `from harness.X` / `from .X` imports
      # resolve; SOURCE only (tests excluded, like every other package). Stdlib-only + an
      # optional PyYAML import (bundled typeshed stub resolves it for the type pass).
      - name: gate-types harness (source)
        working-directory: agent-self
        run: |
          printf '%s\n' '{"typeCheckingMode":"standard","pythonVersion":"3.11","include":["harness"],"exclude":["harness/tests","**/__pycache__","**/backups"]}' > pyrightconfig.json
          basedpyright

  test-node:
    name: gate-tests-coverage (node workspaces)
    runs-on: ${{ (github.event.inputs.runner-type || vars.QUALITY_RUNNER) == 'self-hosted' && fromJson('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - name: gate-tests-coverage hacktricks-mcp-server
        working-directory: tools/mcp/hacktricks-mcp-server
        run: |
          npm ci
          npm test
      # agentspec-js — the JS half of the two-runtime spec. `npm ci` at :157 already installs it
      # (it is a root workspace) and root `npm test` at :158 already invokes it; this explicit
      # step exists for FAILURE ATTRIBUTION, mirroring the two steps above.
      #
      # Its `npm test` is the only coverage gate in the node job, and it is deliberately built
      # against a MEASURED trap: `node --test --experimental-test-coverage` does NOT see a source
      # file that no test imports — the file is absent from the table entirely (not listed at 0%)
      # and the run exits 0 reporting "all files 100.00", reproduced on Node 22 AND Node 24.
      # `--test-coverage-include=src/**` does NOT fix it (it filters the loaded set, it never
      # force-loads). The gate therefore pairs a disk-walking census test (test/census.test.mjs,
      # which dynamic-imports every module under src/) with all THREE thresholds — lines alone
      # or branches alone stays blind, because a never-executed file reports branch 100.00 while
      # funcs is 0.00. Proven RED with an unimported file present, then GREEN once removed.
      - name: gate-tests-coverage agentspec-js (100% line+branch, census-guarded)
        working-directory: tools/agentspec-js
        run: npm test
      # C9 PARITY: the Python and JS runtimes must emit BYTE-IDENTICAL normalised receipts AND
      # reach BYTE-IDENTICAL decisions. TWO corpora, because those turned out to be two claims:
      #   canonical-corpus.json (88 cases) drives the SERIALISER;
      #   behaviour-corpus.json (132 cases) drives judge / missingFields / buildArgv /
      #     checkDispatch / planRetry and 16 more, which the canonical oracle never touched.
      # The second one exists because a differential harness found 78 outcome divergences while
      # BOTH unit suites were green at 100% line+branch — coverage cannot see a divergence, only
      # executing both runtimes on one input and comparing bytes can. A single differing byte
      # fails. agentspec is pure stdlib, so no pip install is needed in the node job.
      - name: gate-tests-coverage agentspec parity oracle (python <-> js, byte-identical)
        working-directory: tools/agentspec-js
        run: npm run parity

  test-python:
    name: gate-tests-coverage (python packages)
    runs-on: ${{ (github.event.inputs.runner-type || vars.QUALITY_RUNNER) == 'self-hosted' && fromJson('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          # setup-node is LOAD-BEARING for the fanout-schema step below (npm test +
          # npm run lint): npm is preinstalled on GitHub-hosted images but ABSENT on
          # the self-hosted runner — measured 2026-10-22 as 'npm: command not found'
          # (exit 127) the first time this job ever survived past the pytest suites to
          # reach that step. Same SHA as the pin in the (node workspaces) job above.
          - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
            with:
              node-version: "22"
      - name: gate-tests-coverage mcp-manager
        working-directory: tools/mcp-manager
        run: |
          pip install -e ".[dev]"
          pytest --cov=. --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: gate-tests-coverage scholarly-access-mcp
        working-directory: tools/scholarly-access-mcp
        run: |
          pip install -e . pytest pytest-cov
          pytest --cov=scholarly_access --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: gate-tests-coverage taskwatch_monitor
        working-directory: tools/taskwatch_monitor
        run: |
          pip install -e ".[dev]"
          pytest --cov=. --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: gate-tests-coverage monitorcore
        working-directory: tools/monitorcore
        run: |
          pip install -e ".[dev]"
          pytest --cov=monitorcore --cov-branch --cov-report=term-missing --cov-fail-under=100
      # skills/workflow-monitor holds the ONLY copy of the WfmonSource adapter
      # (wfmon_export/), and no step named its suite -- with no repo-wide pytest
      # autodiscovery, a regression there could not be caught (this is how the D-p1c10
      # escaping-clock case stayed uncovered). Scoped to the adapter-contract file: it
      # imports stdlib plus in-tree modules only (no textual), and conftest.py puts the
      # skill root on sys.path, so bare pytest is the whole install. Reuses the declared
      # `tests-coverage` slug without a --cov-fail-under threshold, same as the
      # harness-corpus step further down.
      - name: gate-tests-coverage wfmon adapter contract (skills/workflow-monitor)
        working-directory: skills/workflow-monitor
        run: |
          pip install pytest
          pytest tests/test_source.py -q
      # tools/mcpctl -- read-only MCP inventory core, stdlib-only runtime (its dev extra
      # is just pytest + pytest-cov). The editable install is LOAD-BEARING here even
      # though the runtime deps are empty: `tests/` is a subdirectory, so bare `pytest`
      # (which, unlike `python -m pytest`, does NOT put the cwd on sys.path) cannot
      # import `mcpctl` without it. Verified in a fresh venv against the committed blob,
      # not against the working tree.
      - name: gate-tests-coverage mcpctl
        working-directory: tools/mcpctl
        run: |
          pip install -e ".[dev]"
          pytest --cov=mcpctl --cov-branch --cov-report=term-missing --cov-fail-under=100
      # tools/mcpapply -- the MUTATION sibling of mcpctl. Two install lines, both
      # load-bearing:
      #
      #   * `pip install -e ../mcpctl` FIRST. mcpapply imports mcpctl statically in
      #     seven modules (it is the whole read layer), and mcpctl is deliberately NOT
      #     declared in mcpapply's `dependencies`: naming the bare string `mcpctl` there
      #     would make pip resolve it from PyPI, a name this repo does not own, and pull
      #     a stranger's package into a tool that writes the operator's credential-
      #     bearing config. The sibling tree is the only supply chain here.
      #   * `pip install -e ".[dev]"` (the monitorcore/agentspec pattern), NOT the bare
      #     `pip install pytest pytest-cov` that stdin-server uses. MEASURED: `tests/` is
      #     a subdirectory and tests/conftest.py imports the package at COLLECTION time,
      #     so the bare form dies with `ModuleNotFoundError: No module named 'mcpapply'`.
      #     Reproduce either state with the venv's `pytest` CONSOLE SCRIPT, never
      #     `python -m pytest` -- the `-m` form prepends CWD to sys.path and passes in
      #     BOTH states, so it is a broken detector for exactly this failure.
      #
      # `-m "not live"` is load-bearing too. tests/test_live.py registers ONE `live` row
      # that would spawn a REAL host session; its conftest default-deselects it, but a
      # bare pytest here would run it the moment that hook regressed, on a runner with
      # no host binary -- and `mcp_toggle` PERSISTS a write to ~/.claude.json, so a live
      # row is a mutation, not just a slow test. It is deliberately not the sole cover of
      # any line, so 100% is still reached with it deselected (measured 2026-07-27:
      # 225 passed, 1 deselected, 100.00% line+branch, ZERO `# pragma: no cover` in
      # package source).
      - name: gate-tests-coverage mcpapply
        working-directory: tools/mcpapply
        run: |
          pip install -e ../mcpctl
          pip install -e ".[dev]"
          pytest -m "not live" --cov=mcpapply --cov-branch --cov-report=term-missing --cov-fail-under=100
      # tools/stdin-server — a stdlib-only interactive-stdin MCP server (Desktop Commander
      # start_process/interact_with_process/read_process_output). Zero third-party deps, so
      # only pytest+pytest-cov are installed; the whole module is 100% line+branch gated. The
      # subprocess/thread I/O is exercised against REAL short-lived child processes (a
      # `python -i -u` REPL, `python -c` one-shots), so the gate measures behaviour, not mocks.
      - name: gate-tests-coverage stdin-server
        working-directory: tools/stdin-server
        run: |
          pip install pytest pytest-cov
          pytest --cov=stdin_server --cov-branch --cov-report=term-missing --cov-fail-under=100
      # tools/harness-drift — the deterministic two-directional differ that replaces LLM
      # judgement for the live-~/.claude-vs-repo drift classification. Stdlib-only, so only
      # pytest+pytest-cov are installed. The suite is mutation-verified: reverting the
      # two-directional read to the historical one-directional form (which mis-called 31
      # two-way-DIVERGED files deploy-safe) turns 5 tests RED, and 5/5 seeded mutations were
      # killed. No working-directory install: the test imports the module as a sibling, and
      # `pytest` (unlike `python -m pytest`) does put the rootdir on sys.path here because
      # both files sit in the same directory with no tests/ subdir.
      - name: gate-tests-coverage harness-drift
        working-directory: tools/harness-drift
        run: |
          pip install pytest pytest-cov
          pytest --cov=harness_drift --cov-branch --cov-report=term-missing --cov-fail-under=100
      # tools/command-center -- the machine-readable backlog, its reachability
      # validator, and the close path. Stdlib-only; conftest.py puts the package dir
      # on sys.path, so bare pytest is the whole install.
      #
      # The last three steps are the LIVE half and are the point of the lane. A
      # backlog that validates its own committed snapshot but is never checked in CI
      # is the same green-not-live failure it exists to detect, so:
      #   validate.py   -- every item still reaches a final disposition, no item was
      #                    silently dropped, and the register snapshot still hashes
      #                    to what the catalog was seeded from;
      #   render.py --check -- STATUS.md / OWNER-DECISIONS.md / ARTIFACT-MANIFEST.json
      #                    still equal their derivation (the anti-rot gate: the
      #                    measured root cause was a hand-maintained pointer going
      #                    15 days stale while work continued);
      #   seed.py       -- refuses to overwrite without --force, so a stray CI run
      #                    can never discard close/defer history.
      # Both scripts exit non-zero on failure and print a terminal FAILED: marker.
      #
      # command-center/casualty -- the two receipts recovered from the two builders that died
      # mid-wave, and the six instruments built to triage them. Both rounds left the same
      # structural residual: every instrument was correct and NONE of them was called by
      # anything, so the only thing keeping the lane from rotting was somebody remembering it.
      # `casualty_guard.py` is the hermetic subset a runner can execute -- it checks that this
      # step still invokes it (a comment naming the path does NOT count), that every shipped
      # instrument carries a disposition in both directions, that both receipts still reproduce
      # their published elided sha256 and byte count, that a substantive artifact for each
      # recovered unit still exists SOMEWHERE (location-agnostic, so promoting them to
      # command-center/adversarial/ is not a failure), and that the two superseded round-1
      # outputs keep the banner that stops their six FALSE casualty verdicts being cited. It
      # also EXECUTES two instruments rather than checking their bytes -- the `launchpath`
      # lesson. Stdlib-only plus git, so `pip install pytest` above is the whole install.
      # Deliberately NOT a `gate-<slug>` step name: it rides inside this gate rather than adding
      # one, so .quality/charter.yml stays a closed set. `--selftest` (the per-probe both-states
      # control) is a local/reviewer command, not run here: it copies the tree six times.
      #
      # `integration_redproof.py` is the reason to believe any of the above. It runs the guard
      # TWICE -- once against this tree, once against a mirror with the invocation line deleted
      # and the path left behind in a COMMENT -- and requires GREEN then RED. A gate that has
      # never gone red is indistinguishable from a no-op, and this repo has measured that exact
      # shape (a probe that printed nothing in the broken state too, one step from being
      # reported as verification). It also proves the `casualty` suite floor can fail, both by
      # raising it above the observed count and by pointing it at an empty tests dir. ~20 s,
      # dominated by pytest --collect-only subprocesses.
      - name: gate-tests-coverage command-center
        run: |
          pip install pytest
          python -m pytest tools/command-center/tests -q
          python tools/command-center/validate.py
          python tools/command-center/render.py --check
          python -m pytest command-center/casualty/tests -q
          python command-center/casualty/casualty_guard.py
          python command-center/casualty/integration_redproof.py
      # tools/measure-guard — two guards against measurements that report green while measuring
      # nothing, both derived from defects measured on this repo. `suitefloor` gives every
      # registered suite a declared minimum test count and fails below it regardless of exit code
      # (a fresh clone of main once collected ZERO of platform/ while the working tree reported
      # 3,910 passed). `blobread` reads a tracked path as the COMMITTED BLOB via `git cat-file`,
      # never `git archive`, which returns the CRLF worktree bytes on Windows and so verifies the
      # wrong bytes. Stdlib-only apart from pytest; the tests build throwaway git repos and never
      # touch this one.
      # `--suite command-center`, NOT `--all`. An independent review found that `--all` includes the
      # `platform` suite, whose collection needs `jsonschema`, while this step installs only pytest.
      # It passes today only because earlier steps in this job pull jsonschema in transitively
      # (measured: jsonschema-4.26.0 in CI run 31410194562) - and at a DIFFERENT version from the
      # 4.25.1 the test-platform job pins, so the two jobs would measure platform under different
      # validators. Reordering or trimming an unrelated sibling step would break this one, and the
      # failure would read "a package is probably failing to import" pointing at platform rather
      # than at the missing dependency here. platform is already covered by test-platform with
      # pinned deps, so this step keeps to what it can honestly install.
      # `wudeps` closes the largest measurement gap in the command centre: validate.py does not
      # contain the string `work_units`, so it gates the 103 register items and NONE of the 2,007
      # work units that are the actual program. Measured 41 dependency refs that resolve to nothing
      # and 876 that point at buckets with zero members, none of it ever gated. It RATCHETS against
      # a recorded baseline rather than failing on all 917 pre-existing findings - a gate that fails
      # on every unrelated PR gets deleted - and reports improvements so the floor gets lowered
      # instead of drifting into slack.
      # `launchpath` is the only gate here that EXECUTES a shipped program. Everything else in the
      # monitor chain checks bytes: vendordrift proves every committed copy of `monitorcore` is
      # byte-identical, test_registry_commit_truth proves each registry stanza names a TRACKED
      # path, test_registry_shipped proves the file exists on the author's box. None of them run
      # it, so a shim whose import breaks, or an entry that exits 0 without rendering, is green in
      # all three - the silent-no-op shape that once turned `ui-audit` into a vacuous pass. This
      # materialises the registry and the probed skill dir from the blobs git STORED (never `git
      # archive`, which returns Windows CRLF), launches the entry with `--once`, and requires both
      # exit 0 and a marker proving the board rendered. Honest scope: 1 of 6 stanzas is executed,
      # in each of the 2 registry mirrors; the other 5 are interactive pollers or quarantined and
      # carry a written exemption. Both directions fail closed - a NEW stanza that is neither
      # probed nor exempt fails, and an exemption naming a deleted stanza fails - so the policy
      # cannot rot into fiction and a green cannot be computed over nothing. Stdlib-only, and the
      # cockpit it launches declares `dependencies = []`, so `pip install pytest` above is enough.
      - name: gate-tests-coverage measure-guard
        run: |
          pip install pytest
          python -m pytest tools/measure-guard/tests -q
          python tools/measure-guard/suitefloor.py --suite command-center
          # `casualty` is the second registered suite this step enforces. The lane's guard checks
          # that CI still INVOKES it; this checks that the thing being invoked still has tests
          # under it. Both directions are needed: a suite collapsed to only its green-state
          # assertions would leave every probe untested while the guard still reported green.
          python tools/measure-guard/suitefloor.py --suite casualty
          python tools/measure-guard/refcheck.py
          python tools/measure-guard/wudeps.py
          python tools/measure-guard/jsonparse.py
          python tools/measure-guard/launchpath.py
      # tools/measure-guard/unitgate.py -- the P2 DELIVERY gate, deliberately its OWN step.
      #
      # WHAT IT CLOSES. `command-center/ready_units.py` is the predicate that decides whether each
      # of the 2,007 work units has actually been DELIVERED, and three rounds of build / audit /
      # adversarial refutation hardened it: bare `Path.exists()` counted 44 delivered artifacts of
      # which 43 self-declare BLOCKED or FAILED; condition 4b was added after a verifier proved
      # `state: "SUCCESS"` was one word from a false green on the 23 meta-declaring units. Yet
      # `grep -rn ready_units .github/workflows/` returned ZERO hits before this step existed, so a
      # regression to that predicate, or a forged artifact committed under command-center/receipts/,
      # was green on every pull request. Exactly the green-not-live shape the command-center step
      # above says it exists to prevent, and the delivery half that `wudeps` (dependencies) left out.
      #
      # WHY A SEPARATE STEP. This is the only gate in the chain that needs `jsonschema` -- the
      # predicate validates each artifact against the contract its own catalog row declares. Folding
      # it into the step above would falsify that step's honest "keeps to what it can honestly
      # install" comment and leave it leaning on a sibling's transitive dependency, which the same
      # comment records as a real, already-diagnosed failure. Pinned to 4.25.1 to match the
      # test-platform job so the two never grade the same schemas under different validators.
      #
      # IT FAILS CLOSED FOUR WAYS, each with a control proven to fire on the known-broken state
      # (tools/measure-guard/tests/test_unitgate.py, every case two-sided):
      #   * the contract checker must be LIT before any count is printed -- a known-vacuous
      #     declaration rejected AND a known-discriminating one accepted. Only the second half can
      #     catch a dead checker, which calls everything vacuous and would sail through the first;
      #   * the predicate's own 16 two-sided controls must still fire;
      #   * the forged-completion detector must reject the shipped known-forged artifact. No real
      #     artifact declares a done-state today, so without that control "0 forged completions"
      #     would be indistinguishable from a detector incapable of finding one;
      #   * every artifact is graded from the COMMITTED BLOB via `git cat-file` -- never
      #     `git archive`, which hands back the Windows CRLF worktree bytes -- and must agree with
      #     its worktree copy, because working-tree-green != clone-green is lesson one here.
      # Plus floors: under 1,500 units read or 40 artifacts found it fails rather than reporting a
      # green computed over a collapsed read.
      - name: gate-p2-delivery
        run: |
          pip install jsonschema==4.25.1
          python tools/measure-guard/unitgate.py
      # tools/agentspec — the portable agent-workflow SPEC, the shared observation envelope, the
      # dispatch-safety pure core (argv/prompt transport, the completion AND-gate, progress-stream
      # rejection, terminal markers, budget accounting, determinism) and the hermetic eval
      # registry. Stdlib-only, zero runtime deps, so only pytest+pytest-cov are installed.
      #
      # `-m "not live"` is LOAD-BEARING and is the only step in this workflow that passes `-m`.
      # The package registers a `live` marker and its tests/conftest.py default-deselects it, but
      # neither is worth relying on alone: a bare `pytest` here would COLLECT AND RUN a live row
      # the moment one is added, and this job is ubuntu-latest with no agent CLI on it. The
      # sentinel live test is deliberately not the sole cover of any line, so 100% is still
      # reached with it deselected (measured 2026-07-27: `406 passed, 1 deselected`, coverage
      # 100.00%, via the pytest CONSOLE SCRIPT in a fresh venv against the LF blob tree).
      #
      # The package is PURE by construction, so there is no coverage `omit`, no `exclude_lines`
      # and ZERO `# pragma: no cover` in it — 100% line+branch is reached by testing every branch.
      # Reuses the existing `gate-tests-coverage` charter slug on purpose, so
      # .quality/charter_check.sh stays consistent with no charter.yml gate edit.
      #
      # `pip install -e ".[dev]"` (the monitorcore pattern at :183-187), NOT the bare
      # `pip install pytest pytest-cov` that stdin-server uses. MEASURED: the bare form fails
      # here with `ImportError while loading conftest … ModuleNotFoundError: No module named
      # 'agentspec'`, exit 4, because tests/conftest.py imports the package at COLLECTION time
      # and pytest only puts the conftest's own directory on sys.path — not the package root.
      # stdin-server gets away with it because nothing of its imports runs before collection.
      # Reproduce either state locally with the venv's `pytest` CONSOLE SCRIPT, never
      # `python -m pytest`: the `-m` form prepends the CWD to sys.path and passes in BOTH
      # states, so it is a broken detector for this specific failure.
      - name: gate-tests-coverage agentspec
        working-directory: tools/agentspec
        run: |
          pip install -e ".[dev]"
          pytest -m "not live" --cov=agentspec --cov-branch --cov-report=term-missing --cov-fail-under=100
      # tools/agentrail — the config-driven multi-rail dispatch shell OVER agentspec. It consumes
      # the merged core (oracle / taxonomy / argv / retry / envelope / terminal / progress /
      # dispatchpolicy / clock) and reimplements none of it; tests/test_no_rival_core.py walks the
      # package AST and fails on any redeclaration, so that claim is gated rather than asserted.
      #
      # `pip install -e ../agentspec` is EXPLICIT here even though the agentspec step above has
      # already installed it into this same 3.11 interpreter. Inheriting that as cumulative state
      # would make this step silently order-dependent: reordering or removing the agentspec step
      # would red agentrail with a ModuleNotFoundError that points at the wrong package. It is
      # also the RUNTIME half of a two-mechanism wiring whose STATIC half is
      # `[tool.basedpyright] extraPaths = ["../agentspec"]` in the package's pyproject — the two
      # are not interchangeable (see the gate-types agentrail step for the measurement).
      #
      # `pip install -e ".[dev]"`, NOT the bare `pip install pytest pytest-cov`: tests/conftest.py
      # imports agentspec.evals.pytest_live at COLLECTION time, so the bare form dies with exit 4
      # before a single test runs. Reproduce either state with the venv's `pytest` CONSOLE SCRIPT,
      # never `python -m pytest` — the -m form prepends cwd to sys.path and passes in BOTH states,
      # so it is a broken detector for exactly this failure.
      #
      # `-m "not live"` is LOAD-BEARING: the live rows resolve and SPAWN a real agent CLI
      # (codex/grok/opencode) and this runner has none. Belt and braces — the marker is registered
      # in pyproject, tests/conftest.py default-deselects it via agentspec.evals.pytest_live, and
      # CI filters it here too. Measured 2026-07-27 in a fresh 3.11 venv against this tree:
      # `219 passed, 9 deselected`, coverage 100.00% line+branch, ZERO `# pragma: no cover` in
      # package source (tokenised, not grepped — three modules DISCUSS the pragma in prose).
      #
      # Reuses the existing `gate-tests-coverage` charter slug on purpose, so
      # .quality/charter_check.sh stays consistent with no new gate entry.
      - name: gate-tests-coverage agentrail
        working-directory: tools/agentrail
        run: |
          pip install -e ../agentspec
          pip install -e ".[dev]"
          pytest -m "not live" --cov=agentrail --cov-branch --cov-report=term-missing --cov-fail-under=100
      # tools/crcp — the Cross-Rail Control Plane. MEASURED 2026-07-29: before this step
      # `grep -rn crcp .github/` returned NOTHING, so all 11 suites under tools/crcp/tests/
      # had NEVER run in CI — including the credential-egress allowlist that keeps the
      # OpenAI bearer in ~/.codex/auth.json off caller-controlled hosts. There is no
      # repo-wide pytest autodiscovery here, so an unnamed suite is a suite that does not
      # exist; this step is what makes tests/test_auth_broker_credential_scope.py and
      # tests/test_credential_egress_transport.py actually gate anything.
      #
      # PYTHONPATH carries BOTH roots and is LOAD-BEARING: the directory mixes two import
      # conventions — `from crcp import auth_broker` needs tools/crcp on sys.path, while
      # tests/test_redact.py and three siblings do `from redact import ...` and need
      # tools/crcp/crcp. Without both, four suites die at COLLECTION and pytest exits
      # without running any of the other seven. Do not "simplify" it to one entry.
      #
      # `pip install pytest` only — the package is stdlib-only for test purposes
      # (websocket-client is imported lazily inside CdpSession.__init__, which the suites
      # bypass). Verified in a fresh venv holding nothing but pytest, run through the
      # pytest CONSOLE SCRIPT (never `python -m pytest`, whose implicit cwd insertion
      # would mask the sys.path breakage this PYTHONPATH exists to prevent):
      # `80 passed, 12 subtests passed`.
      #
      # Deliberately NOT a --cov-fail-under=100 lane, following the agent-self/harness
      # precedent below: tools/crcp is a large pre-existing 40-module package, so a hard
      # 100% bar would pin main red and misrepresent it. Closing to parity is follow-up.
      - name: gate-tests-coverage crcp (credential egress; measured, not 100%-gated)
        working-directory: tools/crcp
        run: |
          pip install pytest
          PYTHONPATH="$PWD:$PWD/crcp" pytest tests -q
      # agent-self/harness — the enshrined shared lifecycle harness (SSOT for the live
      # ~/.agents/harness deploy loop). Runs its full pytest suite on the CI interpreter as a
      # REGRESSION gate for the projected tree, and measures branch coverage (term-missing).
      # Deliberately NOT a --cov-fail-under=100 lane: unlike the four TDD-built packages above,
      # this is a byte-exact projection of a pre-existing runtime (~85% source coverage today),
      # so a hard 100% bar would misrepresent it and pin main red — closing to parity is tracked
      # follow-up. No working-directory / editable install: tests/conftest.py puts agent-self/ on
      # sys.path so `import harness` resolves the projected package from the repo root. PyYAML is
      # a real runtime dep of recall_index's frontmatter parser (its tests assert parsed values).
      - name: gate-tests-coverage harness (enshrined runtime; measured, not 100%-gated)
        run: |
          pip install pytest pytest-cov pyyaml
          python -m pytest agent-self/harness/tests -q --cov=agent-self/harness --cov-branch --cov-report=term-missing
      # .agents/scripts -- the shared MCP control plane (registry validation, the
      # Claude/Codex/Cursor merge renderers, the fleet supervisor) that
      # sync_shared_state.ps1 runs on the live box. Until 2026-09-02 NOTHING here named
      # .agents/tests, so the Cursor merge could diverge in both directions between main
      # and live (reconcile-flags/mcp-cursor-merge-lineage-2026-09-02.md: 26 live tests
      # red against main's copy, 6 main tests red against live's) with CI green. Both
      # lineage suites now run: main's test_mcp_control_plane.py, the ported live
      # test_mcp_control_plane_live.py + test_cursor_remote_transport_policy.py, and the
      # fleet-supervisor suite. Stdlib-only (pytest already installed above); the tests
      # load the scripts by path and read .agents/agents.json in place. Reuses the
      # existing `gate-tests-coverage` charter slug on purpose -- it is not a new gate,
      # so .quality/charter_check.sh stays consistent with no charter.yml edit. The
      # bm_cursor_http_session bridge suite is deliberately NOT listed: it drives a fake
      # streamable-HTTP daemon over loopback and is gated with tools/mcp/mcp-http-host.
      - name: gate-tests-coverage mcp control plane (.agents/scripts; main + live lineage suites)
        run: |
          python -m pytest \
            .agents/tests/test_mcp_control_plane.py \
            .agents/tests/test_mcp_control_plane_live.py \
            .agents/tests/test_cursor_remote_transport_policy.py \
            .agents/tests/test_mcp_fleet_supervisor.py \
            -q -p no:cacheprovider
      # tools/triage-router uses a stdlib-only custom runner, not pytest discovery.
      # Naming the script here turns its existing tests and production-wiring checks
      # into an executed regression lane instead of an inert test file.
      - name: triage-router standalone regression
        working-directory: tools/triage-router
        run: python test_triage_router.py
      # hooks/cmd-rewrite — the SOLE PreToolUse rewriter for the Bash tool. There is no
      # repo-wide test autodiscovery here, so these suites run only because this step names
      # them; without it they are dead weight that cannot catch a regression. Both are
      # stdlib-only custom runners (no pytest, no install) that exit non-zero on failure, so
      # they gate directly. Reuses the existing `gate-tests-coverage` charter slug on purpose
      # — it is not a new gate, so .quality/charter_check.sh stays consistent with no
      # charter.yml edit. NOT a --cov-fail-under lane: like the harness step above this is a
      # projection of a live runtime, and its own runner reports pass/fail, not coverage.
      # The MSYS argv fixtures SKIP on Linux BY CONSTRUCTION (MSYS path conversion cannot
      # occur off Windows); what runs here is the pure-policy layer plus the emission-safety
      # invariant that `bash -n` accepts every rewrite the hook would emit — the property
      # whose absence let a round-1 revision ship shell that did not parse.
      # Measured on an ubuntu-equivalent (python 3.12.3, bash 5.2.21):
      #   test_msys_pathconv.py -> 116 passed, 0 failed, 7 skipped, exit 0
      #   test_hooks.py         -> 37/37 passed, exit 0
      - name: gate-tests-coverage cmd-rewrite hooks (msys-pathconv + no-pager)
        working-directory: hooks/cmd-rewrite
        run: |
          python test_msys_pathconv.py
          python test_hooks.py
          # pytest-style, so it needs the runner: the broad `pytest hooks/` step
          # --ignores this whole directory, which would leave this suite dead weight.
          pytest test_updated_input_preservation.py -q --import-mode=importlib

      # tools/search-expansion — RRF rank fusion, the pure SearXNG settings.yml transform,
      # and the query-plan translate->dedup sibling (Enterprise-Search decompose borrow).
      # Reuses the existing `gate-tests-coverage` charter slug on purpose: it is not a new
      # gate, so .quality/charter_check.sh stays consistent with no charter.yml edit.
      # Only the three PURE modules are coverage-gated. searxng_regional.py is the I/O shell
      # (HTTP probes, docker restart, file backup); mocking it to 100% would assert against
      # the mocks, so it is covered by lint/types and by live exercise instead — the runs
      # are recorded in docs/search-expansion/README.md. pyyaml is a real test dependency:
      # the suite PARSES the rendered block rather than eyeballing it, because a malformed
      # settings.yml takes the owner's search instance down.
      - name: gate-tests-coverage search-expansion (rrf + searxng config + query plan)
        working-directory: tools/search-expansion
        run: |
          pip install pytest pytest-cov pyyaml
          pytest --cov=rank_fusion --cov=searxng_config --cov=query_plan --cov-branch \
            --cov-report=term-missing --cov-fail-under=100

      # C46: ci/tests/ has NO tree-wide step, so a suite added there runs only if it is
      # named here (quality.yml is the source of truth for what executes). Pins the
      # deployable ~/.claude docs against the code that resolves the paths they name —
      # agent-self/config/CLAUDE.md is copied verbatim to ~/.claude by bootstrap.ps1, so a
      # wrong path in it is an operator instruction, not prose. Reuses the existing
      # `gate-tests-coverage` charter slug on purpose: .quality/charter_check.sh matches on
      # `gate-<slug>` markers, so inventing a new one would need a charter.yml edit and
      # would otherwise turn the EXISTING lint job red.
      - name: gate-tests-coverage deployable-doc/code path consistency
        run: python -m pytest ci/tests/test_deploy_doc_consistency.py -q

      # docs/program-b -- the Program B (workflow_design) register. This step IS the
      # remediation for register row R-B05 ("zero consumers reach any Program-B
      # artifact"): four detector-controlled probes found nothing in the repo, hooks,
      # skills, workflows, agents or commands tree that ever reads a Program-B
      # artifact, and a backlog nobody reads is a backlog that gets dropped -- it was
      # dropped three times. Naming the suite here makes CI the consumer, so the
      # register cannot silently drift, lose an item, or be deleted.
      # Stdlib-only, no install (pytest is already present from earlier steps).
      # The mutation probe is the both-states half
      # (rules/common/single-signal-verification.md rule 3b), following the
      # plugin-cache-reaper precedent above: it mutates a temp COPY of the receipt --
      # never the committed file -- and requires the suite to go RED for each defect,
      # so a green gate here is evidence about the register rather than evidence that
      # the checker stopped working. Measured: 27 passed, 10/10 mutations killed, and
      # the probe verifies the committed receipt is byte-unchanged afterwards.
      # Reuses the existing `gate-tests-coverage` charter slug on purpose -- it is not
      # a new gate, so .quality/charter_check.sh stays consistent with no charter.yml
      # edit.
      - name: gate-tests-coverage program-b register (suite + mutation probe)
        run: |
          python -m pytest ci/tests/test_program_b_register.py -q
          python docs/program-b/mutation_probe.py

      # tools/plugin-cache-reaper — the sweep for abandoned plugin-install staging
      # clones under ~/.claude/plugins/cache. Named explicitly for the usual reason:
      # there is no repo-wide pytest autodiscovery here, so an unnamed suite is dead
      # weight that cannot catch a regression. Reuses the existing
      # `gate-tests-coverage` charter slug on purpose — it is not a new gate, so
      # .quality/charter_check.sh stays consistent with no charter.yml edit.
      # What it gates is destructive-delete safety on a LIVE user directory: that a
      # real cache entry (`cache/<marketplace>/<plugin>/<version>`) can never match
      # the staging name allow-list, that BOTH age signals (the epoch-ms in the
      # directory name AND its mtime) must clear the window before anything is
      # removed, that a path which is not `.../plugins/cache` is refused outright,
      # and that dry-run — the default — deletes nothing.
      # Stdlib-only, so only pytest+pytest-cov are installed. The mutation step is
      # the both-states check applied to the suite itself
      # (rules/common/single-signal-verification.md:44): it reverts the AND-gate to
      # an `or`, drops the regex end-anchor, removes the is-a-directory check,
      # no-ops the root validation, and makes dry-run delete anyway, and requires the
      # suite to go RED for each. It found a real hole on its first run. Measured
      # locally on python 3.14.6: 45 passed, 100.00% line+branch, 5/5 mutations
      # killed. install_reaper_task.ps1 is intentionally NOT invoked here —
      # registering the scheduled task is an owner action, not a CI action.
      - name: gate-tests-coverage plugin-cache-reaper (suite + mutation probe)
        working-directory: tools/plugin-cache-reaper
        run: |
          pip install pytest pytest-cov
          pytest --cov=reap --cov-branch --cov-report=term-missing --cov-fail-under=100
          python test_reap_mutations.py

      # process-hygiene-supervisor: the estate-wide process governor (design in
      # docs/plans/2026-09-02-process-hygiene-supervisor.md; queue + rejected options in
      # docs/plans/2026-09-02-process-hygiene-decision-queue.md). Four Python modules, all
      # pure with the OS boundary injected, so ALL FOUR are 100% line+branch gated here:
      # hygiene.py (decision engine), hygiene_actuate.py (pinned-handle Win32 actuator),
      # hygiene_doctor.py (read-only estate checks + MCP wrapper rewriter + browser policy
      # generator), hygiene_launch.py (admission gate + job-object launch shim), plus
      # evals/run_evals.py. The PowerShell launcher/installer/profile/smoke-test carry no
      # gated logic (CI has no pwsh, same as the reaper's *.ps1). hygiene.py imports the
      # shipped mcp_fleet_supervisor + mcp_control_plane from .agents/scripts at
