name: quality

# Lean quality gate (replaces all retired SaaS control planes: Sonar/Codacy/
# DeepSource/qlty/Codecov-as-gate/Snyk/Trivy-for-app-deps). Six gates:
#   1. lint+format+sec-lint   (ruff)
#   2. types                  (basedpyright)
#   3. tests + 100% coverage  (node workspaces + python packages)
#   4. SAST                   (opengrep / semgrep-CE)
#   5. secrets                (gitleaks)
#   6. deps                   (osv-scanner; Dependabot runs separately)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 1. lint + format + sec-lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check --exclude **/vendor/** --exclude **/node_modules/**"
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check --exclude **/vendor/** --exclude **/node_modules/**"

  types:
    name: 2. types (basedpyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install basedpyright
      - run: basedpyright tools/mcp-manager tools/scholarly-access-mcp

  test-node:
    name: 3a. tests (node workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - name: agentify-desktop tests
        working-directory: tools/web/agentify-desktop
        run: |
          npm install --omit=dev --no-audit
          npm test

  test-python:
    name: 3b. tests + 100% coverage (python packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: mcp-manager
        working-directory: tools/mcp-manager
        run: |
          pip install -e ".[dev]"
          pytest --cov=. --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: scholarly-access-mcp
        working-directory: tools/scholarly-access-mcp
        run: |
          pip install -e . pytest pytest-cov
          pytest --cov=scholarly_access --cov-branch --cov-report=term-missing --cov-fail-under=100

  sast:
    name: 4. SAST (opengrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: opengrep scan
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"
          "$HOME/.opengrep/cli/latest/opengrep" scan --config auto --error --exclude vendor --exclude node_modules .

  secrets:
    name: 5. secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  deps:
    name: 6. deps (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.2.4
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --lockfile=tools/web/agentify-desktop/package-lock.json
