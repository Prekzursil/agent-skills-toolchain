      # slug (not a new gate). pytest is already installed by an earlier step.
      - name: gate-tests-coverage codex-databricks-fanout
        run: python -m pytest skills/codex-databricks-fanout/scripts/tests -q

      # codex-databricks-fanout -- the backends/ + engine/ COVERAGE half of the step above.
      # The step above proves the suite is green but enforces no threshold, so the pluggable
      # backend abstraction (backends/base.py + the databricks/github-actions adapters) and the
      # reusable completion engine (engine/{verify,ceiling,sanitize,tokens,backlog}.py) would
      # arrive gated only by "the tests ran". Their source repo gated them at 100% line+branch
      # and measured 100% here (180 stmts / 36 branches, 0 missed) on the merged tree, so the
      # threshold travels with the code rather than being silently dropped in transit.
      # harness/* is deliberately NOT in --cov: its source repo measured it at 83% and never
      # gated it, and inventing a threshold it has never met would fail this lane on arrival.
      # working-directory (not a repo-root path) because --cov=backends is an IMPORT name:
      # scripts/ must be the rootdir for `import backends` to resolve, exactly as conftest.py
      # arranges under pytest. Reuses the gate-tests-coverage charter slug (not a new gate);
      # pytest-cov is already installed by the harness step earlier in this job.
      - name: gate-tests-coverage codex-databricks-fanout (backends+engine 100%)
        working-directory: skills/codex-databricks-fanout/scripts
        run: >-
          python -m pytest tests -q
          --cov=backends --cov=engine --cov-branch
          --cov-report=term-missing --cov-fail-under=100

      # skills/workflow-authoring -- the saved-Workflow static linter (workflow_lint.py).
      # It HARD-FAILs on the determinism-breakers (Date.now / Math.random / argless
      # new Date(), a non-literal `export const meta`) and WARNs on the args-as-string /
      # missing-schema / missing-filter(Boolean) footguns from SKILL.md. Stdlib-only, so
      # only pytest+pytest-cov are installed; the module is pure logic (the file walk is the
      # only I/O and is exercised through tmp_path), so it is 100% line+branch gated. Named
      # explicitly like the skill suites above -- there is no repo-wide pytest autodiscovery,
      # so an unnamed suite is dead weight. Reuses the gate-tests-coverage charter slug on
      # purpose (not a new gate), so .quality/charter_check.sh stays consistent with no
      # charter.yml edit. The byte-identical dual-write copy under .agents/skills/ is policed
      # by the skill-dual-write workflow's strict-parity check, not re-run here.
      - name: gate-tests-coverage workflow-authoring lint
        working-directory: skills/workflow-authoring/scripts
        run: |
          pip install pytest pytest-cov
          pytest --cov=workflow_lint --cov-branch --cov-report=term-missing --cov-fail-under=100

      # tools/wf-timeout -- design item H6 ("per-agent timeout + stall heartbeat, the
      # barrier-deadlock escape", docs/audit-design-2026-07-13/B2-RFC-operational.md:377,
      # wave item W1.5 at B3-migration-verification.md:150). Two things run here and each
      # closes a DIFFERENT no-op-gate hole:
      #
      #   1. `pytest` is the H6 RED-PROOF. Its control scenario feeds a bare `parallel()`
      #      a thunk that never resolves and REQUIRES the barrier to hang (measured
      #      ~1.5 s, watchdog-bounded) before the wrapped path is allowed to be green.
      #      B3:156's exit criterion is verbatim "H6 proven to break a synthetic barrier
      #      hang" -- this step is where that proof is actually executed.
      #   2. `wf_gate.py` INVOKES workflow_lint over real source. The step directly above
      #      gates workflow_lint's own unit tests at 100%, but until this step existed
      #      nothing ever ran that linter over a single line of workflow code -- a linter
      #      no gate invokes is exactly the defect this job's doctrine calls dead weight.
      #      `--self-test` runs first and is the both-states control: it proves the gate
      #      goes RED on a known-bad block, GREEN on a clean one, and fails CLOSED on an
      #      empty walk (rules/common/ci-hygiene.md 1) -- so the green from the bare
      #      `wf_gate.py` line after it means something.
      #
      # setup-node is LOAD-BEARING, not hygiene: test_h6_timeout.py resolves `node` with
      # shutil.which and FAILS the suite when it is absent rather than skipping, on the
      # grounds that a skipped red-proof is the no-op gate the directory exists to
      # prevent. Same SHA as the pin in the (node workspaces) job above. Reuses the
      # `gate-tests-coverage` charter slug on purpose -- not a new gate, so
      # .quality/charter_check.sh stays consistent with no charter.yml edit.
      #
      # ci/tests/test_wf_timeout_ci_wiring.py pins this step by its exact command lines
      # and is collected by skill-dual-write.yml's directory sweep, so deleting the step
      # turns a DIFFERENT workflow red instead of silently un-wiring the H6 proof.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: gate-tests-coverage wf-timeout (H6 red-proof + workflow-lint invocation)
        working-directory: tools/wf-timeout
        run: |
          pip install pytest pytest-cov
          pytest --cov=wf_gate --cov=h6_extract --cov-branch --cov-report=term-missing --cov-fail-under=100
          python wf_gate.py --self-test
          python wf_gate.py

      # ================================ VENDORED TOOL TREES ================================
      # PR #185 vendored two whole tool trees into the toolkit -- tools/abbyy-finereader-ocr-mcp
      # (89 tests) and tools/omniaudit-mcp (149 tests) -- and NEITHER was named in ANY of the 7
      # workflows, so both suites ran in ZERO gates. By this job's own doctrine (see the hookrun
      # step above) "a suite that is not named here is dead weight that cannot catch a
      # regression". The two steps below name them. Reuses the existing gate-tests-coverage
      # charter slug on purpose -- not a new gate, so .quality/charter_check.sh stays consistent
      # with no charter.yml edit (same precedent as #197's hacktricks step).
      #
      # WHY A THROW-AWAY VENV PER TREE AND NOT A BARE `pip install -e .` LIKE THE STEPS ABOVE:
      # every other step in this job installs into ONE cumulative interpreter. abbyy's pyproject
      # declares `py-modules = ["index", "engines", "evaluation"]`, so installing it into that
      # shared interpreter would put three EXTREMELY generic top-level modules on the import path
      # of every other package's test run here. That is measured, not hypothetical -- after
      # `pip install -e .` a python started from an unrelated directory resolves:
      #   index      -> tools/abbyy-finereader-ocr-mcp/index.py
      #   engines    -> tools/abbyy-finereader-ocr-mcp/engines.py
      #   evaluation -> tools/abbyy-finereader-ocr-mcp/evaluation.py
      # Each tree therefore installs into its OWN venv under $RUNNER_TEMP -- outside the
      # checkout, so it cannot be collected by pytest or picked up by the lint/sast jobs -- and
      # the isolation step below fails the gate if the shared interpreter is ever polluted.
      #
      # Both are gated at the repo's full 100% line+branch bar. MEASURED before choosing that
      # threshold (not assumed): omniaudit 149 passed -> 1518 stmts / 312 branches / 100% on
      # python 3.11.9; abbyy 86 passed + 3 skipped -> 452 stmts / 120 branches / 100% on python
      # 3.12.10. abbyy's 3 skips are its live-OCR smoke tests, skipped BY CONSTRUCTION unless
      # OCR_MCP_LIVE=1 with a real rapidocr install, so the 100% is reached without them.
      #
      # omniaudit ships a 5-service docker compose stack (postgres/redis/minio + api/worker) and
      # NONE of it is started here: tests/conftest.py builds a sqlite engine in tmp_path, so the
      # suite is self-contained. Its `sitelint` extra (playwright browser) and
      # scripts/smoke_hardening_pass2.sh (live HTTP against a running stack) stay OUT of the
      # gate -- they need a browser / a live service, which this lean gate deliberately has not.
      - name: gate-tests-coverage omniaudit-mcp (vendored; isolated venv)
        working-directory: tools/omniaudit-mcp
        run: |
          python -m venv "$RUNNER_TEMP/venv-omniaudit"
          "$RUNNER_TEMP/venv-omniaudit/bin/python" -m pip install -e ".[test]"
          "$RUNNER_TEMP/venv-omniaudit/bin/python" -m pytest \
            --cov=packages/omniaudit --cov=apps --cov=services --cov-branch \
            --cov-report=term-missing --cov-fail-under=100

      # The both-states-verified guard for the venv isolation above. `shell: python` runs the
      # script from a temp directory, so the repo checkout is NOT on sys.path and only a real
      # site-packages/editable install can match -- and it runs on THIS job's shared 3.11
      # interpreter, i.e. exactly the environment every step above installed into. Verified in
      # BOTH states (rules/common/single-signal-verification.md): with abbyy editable-installed
      # it exits 1 and prints the three origins; without it, exit 0 -- so its silence means
      # something. `shell: python` also matches no-runtime-junk.yml's rationale (no CRLF-in-bash
      # exposure on this Windows-authored repo). Deliberately NOT a `gate-<slug>` step name so
      # charter_check.sh's reverse check ignores it, same as the monitorcore vendor-drift step.
      # ORDERING CONTRACT: this must stay AFTER every step that installs into the shared 3.11
      # interpreter and BEFORE the 3.12 setup below (which repoints `python` for later steps).
      - name: vendored-tree import isolation (shared interpreter stays clean)
        shell: python
        run: |
          import importlib.util
          import sys

          GENERIC = ("index", "engines", "evaluation")
          leaked = []
          for name in GENERIC:
              spec = importlib.util.find_spec(name)
              if spec is not None:
                  leaked.append(f"{name} -> {spec.origin}")

          if leaked:
              print("Vendored generic top-level modules leaked into the SHARED interpreter:")
              for entry in leaked:
                  print(f"  {entry}")
              print("Install that tree into its own venv (see the steps above), not this env.")
              sys.exit(1)
          print(f"OK: shared interpreter is clean of {GENERIC}.")

      # tool-result-sentinel + its shared use-vs-mention discriminator. Named here because
      # NO step named them before: docs/ci-coverage-gap-2026-07-25.md measured 162 of 244
      # hooks//tools/ suites executed by no CI step at all, and these were among them -- so
      # the mutation-verified tests shipped in #198 protected nothing in CI. Explicit FILES,
      # not a directory: a directory selector here would hit the duplicate-basename collision
      # (18 basenames repeat across the tree) and the module-level sys.exit() files that abort
      # collection. Reuses the existing gate-tests-coverage charter slug on purpose, so
      # charter_check.sh stays consistent with no charter.yml edit. Deliberately NO
      # --cov-fail-under: these are projections of a live runtime, matching the
      # cmd-rewrite/harness precedent.
      #
      # PLACEMENT IS LOAD-BEARING: these MUST stay above the py312 setup-python below, which
      # repoints the default `python` to 3.12 -- an interpreter with no pytest installed.
      # Appending them after it produced exactly that failure on the first attempt:
      #   /opt/hostedtoolcache/Python/3.12.13/x64/bin/python: No module named pytest
      - name: gate-tests-coverage tool-result-sentinel
        run: |
          python -m pytest -q \
            hooks/tool-result-sentinel/test_sentinel_use_vs_mention.py \
            hooks/_shared/test_use_vs_mention.py
          python hooks/tool-result-sentinel/test_sentinel.py
      # git-hygiene MESSAGE-BUDGET suite. Distinct from test_docs_hygiene.py, which the
      # adversarial-harness-corpus step above already runs -- that one does not cover
      # build_message(), so the #199 truncation-budget fix was likewise unenforced.
      - name: gate-tests-coverage git-hygiene message budget
        run: |
          python -m pytest -q hooks/git-hygiene/test_git_hygiene.py
      # deny-credential-reads denylist + tool-path coverage. The broad `pytest hooks/` net
      # below already collects this directory, so this step is FAST NAMED SIGNAL for a
      # security hook, on the same deliberate-overlap principle as the two steps above --
      # not a claim that the suite was previously unrun.
      #
      # WHY IT WAS ADDED (mutation-measured at fcfa30f, both arms):
      #   deleting the id_ecdsa / id_dsa / *_sk / auth.json patterns PR #260 added left the
      #   pre-existing 32 tests GREEN, while `Read ~/.ssh/id_ecdsa` went from deny to ALLOW.
      #   A surviving mutant means the suite was not protecting the fix. With
      #   test_denylist_coverage.py the same mutant kills 35 tests, and three further
      #   dispatch mutants (drop PowerShell / drop the notebook_path fallback / drop
      #   Edit+MultiEdit) each go red too. 4/4 mutants killed; control 141 passed.
      #
      # The suite asserts on the parsed stdout decision, never on the exit code: deny()
      # PRINTS permissionDecision=deny and exits 0, so an exit-code assertion sees nothing
      # and passes on a hook that denies nothing.
      - name: gate-tests-coverage deny-credential-reads denylist coverage
        run: |
          python -m pytest -q --import-mode=importlib \
            hooks/deny-credential-reads/test_denylist_coverage.py \
            hooks/deny-credential-reads/test_deny.py \
            hooks/deny-credential-reads/test_guard_scope.py
      # The REST of the hooks/ regression harness -- ~66 suites that no step named.
      # docs/ci-coverage-gap-2026-07-25.md measured 64 unexecuted hooks/ suites; this step
      # claims them instead of leaving them dead weight. Now 702 tests after the Wave-3
      # triage un-ignored five more files (see the block below).
      #
      # --import-mode=importlib is REQUIRED, not cosmetic: 18 basenames are duplicated in
      # this tree (test_check.py x3, test_gate.py x2 inside hooks/ alone) and the default
      # `prepend` mode fails collection outright with `import file mismatch`.
      #
      # Both remaining --ignore lines are load-bearing and MEASURED on real Linux (WSL,
      # CPython 3.12). When this step was first written the whole-tree form was NOT green
      # (36 failed, 684 passed, 5 skipped, 1 error) and needed seven exclusions for
      # 661 passed / 4 skipped. After the Wave-3 triage only two are still required.
      #
      #   memory-guard/test_scan.py -- calls sys.exit() at MODULE level, which escapes during
      #     collection as SystemExit and aborts the ENTIRE run with INTERNALERROR. It is run
      #     as a standalone script below instead.
      #   cmd-rewrite -- already invoked as standalone scripts by its own step above, and
      #     test_msys_pathconv.py::test_real_git_end_to_end ERRORs under pytest here.
      #
      # WAVE-3 TRIAGE COMPLETE -- five files were un-ignored here. When this step was first
      # written, four suites held ALL 36 Linux failures and _golden failed at rc=1, so they
      # were excluded PENDING TRIAGE. Every one has now been triaged and fixed, and each
      # turned out to be hiding a live defect rather than merely being red:
      #   _golden/test_hooks.py               (#209) -- resolved hooks from ~/.claude (absent on
      #     Linux); ALSO its check 2b asserted only empty-stdout, so a DELETED hook scored PASS.
      #     Now pytest-collectible, so it no longer needs a standalone step.
      #   _dispatch/test_manifest_presence.py (#210) -- dark-surface was documented as wired and
      #     never was on any of 196 refs, while stub-ledger DEFERS to it.
      #   per-edit-check/test_secrets.py      (#211) -- the write-path secret gate check.py
      #     advertised was never implemented.
      #   _dispatch/test_wiring.py            (#212) -- 14 dispatcher-compatible handlers are
      #     registered in no surface; xfail reason rescoped and its strict marker unshared.
      #   memory-spool/test_replay.py         (#214) -- six hook dirs ship a different _common.py
      #     under one flat sys.modules key, so collection order decided which one it imported.
      #
      # MEASURED on real Linux (CPython 3.12.3, pytest 8.3.3) at 4c96aa1, both arms:
      #   with the 7 old ignores : 661 passed,  4 skipped,              rc=0   (control)
      #   with these 2 ignores   : 702 passed, 12 skipped, 2 xfailed,   rc=0
      # Delta: +41 tests now executed, +8 newly SKIPPED. The extra skips are honest and
      # file-keyed, not platform cover: test_wiring's requires_live_settings predicate keys on
      # an untracked settings.json, so it skips identically on any runner, and _golden retains
      # one pre-existing self-skip. Zero FAILED, zero ERROR.
      #
      # The two steps above overlap this one (their suites are inside hooks/). Kept
      # deliberately: they give fast, named signal for the two suites fixed in #198/#199,
      # at ~1.3s, while this step is the broad safety net.
      - name: gate-tests-coverage hooks regression harness
        run: |
          python -m pytest hooks/ -q --import-mode=importlib \
            --ignore=hooks/memory-guard/test_scan.py \
            --ignore=hooks/cmd-rewrite
      # memory-guard exits at module level so pytest cannot collect it, but it passes when
      # run the way it is designed to run (measured on Linux: rc=0). Same `python <file>`
      # convention as test_manifest_provenance.py and test_repo_map.py.
      - name: gate-tests-coverage hooks standalone (memory-guard)
        run: |
          python hooks/memory-guard/test_scan.py

      # agent-self/config/hooks -- the DEPLOYED snapshot mirror of the live ~/.claude
      # (agent-self/README.md), copied out by agent-self/bootstrap.ps1. Before this step
      # NO CI step named anything under agent-self/config/hooks. (Re-measured at dab44ba:
      # the `gate-tests-coverage plan-lint stage-0` step added by #249 DOES name
      # agent-self/config/harness-meta, so the narrower claim -- nothing under
      # config/hooks -- is the true one; the wider 'nothing under agent-self/config'
      # wording this comment originally carried is REFUTED.) That tree is NOT a parity
      # mirror of hooks/ (21 hook dirs vs ~70) and the `pytest hooks/` step above does not
      # reach it, so every suite here was dead weight that could not catch a regression --
      # exactly the gap docs/ci-coverage-gap-2026-07-25.md measured.
      #
      # EXPLICIT FILES, not a directory, for two measured reasons:
      #   * agent-self/config/hooks/memory-guard/test_scan.py calls sys.exit() at MODULE
      #     level (same as its hooks/ twin), which escapes during collection and aborts the
      #     whole run with INTERNALERROR;
      #   * basenames repeat across this tree (test_hooks.py in _golden/ and cmd-rewrite/),
      #     hence --import-mode=importlib as well.
      #
      # `-o addopts=` is LOAD-BEARING: agent-self/config/hooks/wearables/pyproject.toml
      # carries `addopts = --cov=wearables --cov-fail-under=100`, and pytest picks that up
      # as the inifile whenever a wearables path is in argv. The whole-package gate cannot
      # run here anyway -- wearables/resolve.py imports rdkit, which is not a CI dependency
      # (measured: 3 collection ERRORs) -- so this step is a pass/fail runner, matching the
      # cmd-rewrite and agent-self/harness precedents above for a projection of a live
      # runtime. Reuses the gate-tests-coverage charter slug on purpose: not a new gate, so
      # .quality/charter_check.sh stays consistent with no charter.yml edit.
      # Measured locally (CPython 3.14.6, pytest 8.4.2): 116 passed.
      - name: gate-tests-coverage agent-self deployed-config hooks
        run: |
          pytest -q --import-mode=importlib -o addopts="" \
            agent-self/config/hooks/claim-guard/test_claim_guard_turn_scope.py \
            agent-self/config/hooks/cmd-rewrite/test_updated_input_preservation.py \
            agent-self/config/hooks/edit-validate/test_edit_validate_roundtrip.py \
            agent-self/config/hooks/event-ledger/test_replay_goal_isolation.py \
            agent-self/config/hooks/memory-guard/test_scan_route_normalization.py \
            agent-self/config/hooks/test-tamper-guard/test_guard_comment_collision.py \
            agent-self/config/hooks/wearables/security/test_egress.py

      # tools/harness-corpus -- the hook-telemetry miner and, more importantly, the
      # KNOWN-POSITIVE CONTROL that proves the miner can still see a hook fire before any
      # "no hooks fired" result is believed. Stdlib-only; pytest is the whole install.
      #
      # Its live-corpus control is portability-skipped here BY DESIGN and that skip is now
      # honest: the predicate tests whether a minable corpus EXISTS (>= 50 transcripts),
      # not merely whether ~/.claude/projects is a directory. The old proxy predicate made
      # this file fail on any box where that path exists but is empty -- measured under WSL,
      # where it resolves to the Linux home: 6 stray transcripts, 0 hook fires, and the
      # control reported "the DETECTOR is broken" when the real answer was "no data here".
      # On the owner's box (12,996 transcripts) the control still RUNS and PASSES, and
      # PR3_REQUIRE_LIVE_CORPUS=1 still turns the skip into a hard failure -- verified in
      # all three states, so the control was not weakened to get green.
      #
      # Measured on real Linux (CPython 3.12.3): 11 passed, 2 skipped, rc=0.
      - name: gate-tests-coverage harness-corpus (hook-telemetry miner + detector control)
        working-directory: tools/harness-corpus
        run: |
          pip install pytest
          python -m pytest -q

      # tools/mcp/* MCP servers -- 542 tests that ran in NO gate before these steps.
      # (The first pass gated 469 of them; the cloud-hub block below now closes the
      # remaining 73, which were excluded pending the git-crypt fixture work. The 469
      # figure was accurate about what THIS step gates but understated the total gap.)
      # Measured: `grep -rn cloud-hub .github/workflows/` returned ZERO hits, with a working
      # detector control (the same grep finds `monitorcore`, which IS wired). So the suites
      # protecting the multiplexer hubs -- including tools/mcp/cloud-hub/tests/test_registry.py,
      # the only thing asserting the AWS backend registers with its 9 tools -- were inert.
      #
      # COUNT CORRECTION, recorded rather than quietly fixed: the first version of this step
      # claimed 504 and also looped over `closed-batch`. That was an OVERCLAIM caused by a gap in
      # my own detector -- I enumerated `working-directory:` values only, so I missed steps that
      # name a path INLINE. closed-batch is ALREADY gated at line 274
      # (`python -m pytest tools/mcp/closed-batch/tests -q`), so including it would have run the
      # same 35 tests twice and inflated the headline. Two complementary detectors (path grep AND
      # working-directory enumeration) now agree on the remaining seven.
      #
      # WHY A LOOP AND NOT `pytest tools/mcp`: from the repo root that form produces 10
      # collection ERRORS and exits 2 WITHOUT RUNNING ANYTHING, because each server expects its
      # own directory as rootdir (`import hub`, `import accounts`, ...). Run per-package it is
      # green. Same reason the packages above use `working-directory:`.
      #
      # SCOPE -- every package here declares NO dependencies (no pyproject, no requirements),
      # so `pytest` alone is the whole install. The four dep-bearing siblings are deliberately
      # EXCLUDED as follow-up, not silently dropped: codex-fleet-github (mcp, pyyaml, keyring),
      # linkedin-mcp (mcp), patent-search-mcp (httpx, mcp), qdx-rush-mcp (rush-py, mcp,
      # python-dotenv) -- 7 more files / ~175 tests still ungated.
      #
      # Measured per package on real Linux (CPython 3.12.3) and reproduced EXACTLY on the ubuntu
      # runner: search-hub 44, social-hub 83, mcp-host-supervisor 48, mcp-http-host 40,
      # proxy-mcp 44, reverse-engineering-mcp-bundle 4, plus cloud-hub 206 below -- all rc=0.
      - name: gate-tests-coverage mcp servers (stdlib-only; per-package rootdir)
        run: |
          pip install pytest
          set -e
          for p in search-hub social-hub mcp-host-supervisor \
                   mcp-http-host proxy-mcp reverse-engineering-mcp-bundle; do
            echo "::group::tools/mcp/$p"
            ( cd "tools/mcp/$p" && python -m pytest -q )
            echo "::endgroup::"
          done
      # cloud-hub is split out because it needed two exclusions when first gated:
      # tests/test_hub.py and tests/test_hardening.py build a real HubServer, which loads
      # tools/mcp/cloud-hub/accounts.json -- git-crypt ENCRYPTED on any keyless checkout, and
      # CI has no key. Measured in a fresh worktree (identical state to CI): 10 setup ERRORs,
      # `accounts.AccountStoreLoadError: ... still git-crypt ENCRYPTED`. That error is CORRECT
      # behaviour: it refuses to continue with an empty store rather than silently disabling
      # every configured account, so the fix had to be in the tests, never in the loader.
      #
      # FOLLOW-UP NOW DONE -- both fixtures point hub.ACCOUNTS_PATH at a tmp_path store and
      # restore it in teardown, so the whole file is gated. No production code changed:
      # hub.py already accepted an injected store, and neither fixture's specs declare an
      # account policy, so an empty store exercises the same path with no credentials
      # anywhere near CI. Full suite went 269 passed + 10 ERRORs -> 279 passed (+73 tests,
      # since those two files hold 73 in total).
      #
      # BOTH-STATES PROOF this gate has teeth (not merely green): renaming `id="aws"` to
      # `id="aws_MUTANT"` in backends.py turns the exact command below RED
      # (`1 failed, 278 passed`), and reverting returns it to `279 passed`. Verified against
      # a checkout whose accounts.json was confirmed to still be ciphertext, so the run
      # reproduces CI rather than approximating it.
      - name: gate-tests-coverage cloud-hub (full suite)
        working-directory: tools/mcp/cloud-hub
        run: |
          pip install pytest
          python -m pytest -q

      # C46, for the DOCS lane. ci/tests/ has no tree-wide step here, so a suite added
      # there runs only if it is NAMED here -- and until this step existed, the docs
      # executable-claim gate ran ONLY through skill-dual-write.yml's directory sweep.
      # That workflow is `on: pull_request:` with NO `push:`, and every commit in this
      # program lands by pushing main directly, so the gate executed on ZERO of the
      # commits that shipped it. Measured two ways: skill-dual-write.yml's `on:` block
      # holds exactly one event key, `pull_request`; and quality.yml is the only
      # workflow here that both fires on a push to main and names ci/tests suites.
      #
      # WHAT IT GATES -- the README.md and docs/roadmap.md claims a machine can
      # RECOMPUTE: surface counts, the shared/Claude-only split, the three
      # Windows-snapshot MCP-server counts, the COLLECTED policy-test count, the
      # scholarly tool surface and its names, a stale `**Latest (DATE)**` currency
      # banner, and the two one-sided skill-root divergence counts. Every arm ships a
      # both-states control in the same file and fails CLOSED when its claim is deleted
      # or made unparseable, so a green run is evidence about the documents rather than
      # evidence that the detector stopped working.
      #
      # The second command is the WIRING assertion for this step: it pins the step
      # name, both run lines, the containing job, the push-to-main trigger, and the
      # ordering constraint below, and it carries a control that fires against the real
      # bytes of the trigger-less workflow. It lives in ci/tests/ too, so deleting this
      # step turns skill-dual-write.yml red on the next pull request -- the step cannot
      # quietly un-wire itself.
      #
      # MUST STAY ABOVE the `setup python 3.12` step below: that action repoints the
      # default `python`, and both commands here use a bare `python`. pytest comes from
      # the earlier steps in this job; if that ever changes this fails loudly, not
      # silently green.
      #
      # Reuses the existing `gate-tests-coverage` charter slug on purpose -- a space
      # follows the slug, which is what .quality/charter_check.sh's reverse check
      # matches on -- so no .quality/charter.yml edit and no new charter gate.
      - name: gate-tests-coverage docs executable claims (README + roadmap)
        run: |
          python -m pytest ci/tests/test_docs_executable_claims.py -q -p no:cacheprovider
          python -m pytest ci/tests/test_docs_gate_ci_wiring.py -q -p no:cacheprovider
          python -m pytest ci/tests/test_command_doc_promises.py -q -p no:cacheprovider

      # abbyy and the wearables package both declare `requires-python = ">=3.12"`, so pip
      # REFUSES to install on this job's 3.11 ("requires a different Python"). They get their
      # own pinned interpreter, referenced through `outputs.python-path` rather than PATH so
      # nothing above is affected. KEEP THE py3.12 STEPS LAST in this job -- this action
      # repoints the default `python` to 3.12, so no 3.11 step may follow them.
      - name: setup python 3.12 for the py312-only trees
        id: py312
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # D-wu-38/42/51/57: agent-self/config/hooks/wearables ships its OWN 100% line+branch
      # gate (its pyproject addopts) and 207 tests -- but it was named NOWHERE in this file,
      # so none of it ran. Four HIGH findings (a renderer that emitted bearer tokens
      # unscrubbed, a target-blind fetch that mis-attributed measurements, a ~167x
      # normalization error, and a grouping bug that dropped cross-source disagreements)
      # landed with zero CI protection. Isolated venv: rdkit is the only real dep, and
      # `pytest` runs from inside the package dir so the pyproject gate + conftest apply.
      - name: gate-tests-coverage wearables (py3.12; isolated venv)
        working-directory: agent-self/config/hooks/wearables
        run: |
          "${{ steps.py312.outputs.python-path }}" -m venv "$RUNNER_TEMP/venv-wearables"
          "$RUNNER_TEMP/venv-wearables/bin/python" -m pip install pytest pytest-cov rdkit
          "$RUNNER_TEMP/venv-wearables/bin/python" -m pytest \
            --cov=wearables --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: gate-tests-coverage abbyy-finereader-ocr-mcp (vendored; isolated venv)
        working-directory: tools/abbyy-finereader-ocr-mcp
        run: |
          "${{ steps.py312.outputs.python-path }}" -m venv "$RUNNER_TEMP/venv-abbyy"
          "$RUNNER_TEMP/venv-abbyy/bin/python" -m pip install -e ".[test]"
          "$RUNNER_TEMP/venv-abbyy/bin/python" -m pytest \
            --cov=index --cov=engines --cov=evaluation --cov-branch \
            --cov-report=term-missing --cov-fail-under=100

  # ---------------------------------------------------------------------------------------
  # platform/ — the Prompt Two build tree: lib, workflows, architecture, plugin, marketplace,
  # routing, coordination, corpus. 3,946 tests.
  #
  # WHY THIS LANE DID NOT EXIST UNTIL NOW, and it was not an oversight: it was NOT RUNNABLE on
  # a runner. Two independent blockers, both measured and both now fixed:
  #
  #   1. platform/routing bound its capability corpus to the OPERATOR'S LIVE ~/.claude via
  #      `index.py:55` (`HOME = ROUTING_HOME or Path.home()`), pulling 5 of 8 source roots from
  #      it. Windows ~/.claude had agents=27 commands=71 skills=79; a Linux box has 0/0/0, so
  #      the lane's own implausibly-small-corpus floor fired and 22 tests failed. Closed by a
  #      committed 581-file fixture home plus platform/routing/conftest.py.
  #   2. Nine files that TRACKED code depends on were never committed, because every commit
  #      script in this program excluded `/_` paths as agent scratch. A fresh clone went from
  #      31 COLLECTION ERRORS -> 8 -> 6 failures -> clean across three rounds of this.
  #
  # VERIFIED AGAINST A REAL CLONE, not the working tree. That distinction is the whole reason
  # this job is trustworthy: `pytest platform` reported 3,910 passed on the working tree while
  # a `git clone` of the same commit could not COLLECT the suite at all, because the working
  # tree held the untracked files a runner would not have. Every green figure below came from
  # `git clone --single-branch --branch main` into a scratch dir, `untracked=0`.
  #
  # Named `gate-tests-coverage (platform)` so .quality/charter_check.sh maps it to the existing
  # `tests-coverage` slug — no new charter entry, one-in/one-out preserved. Kept as its own JOB
  # rather than a step in the python-packages job so a ~12 minute suite does not serialise
  # behind, or extend, the fast package gates.
  #
  # NO --cov-fail-under here, deliberately. The sibling steps gate coverage at 100% on packages
  # built for it; platform/ has never had a coverage number measured, and inventing a threshold
  # would either be trivially passed or instantly red. Pass/fail on the suite is the honest
  # first contract. UNVERIFIED: what platform/ line+branch coverage actually is — nobody has
  # measured it. Settling experiment: run with --cov=platform --cov-report=term-missing once
  # and read the number before choosing a floor.
  test-platform:
    name: gate-tests-coverage (platform)
    runs-on: ${{ (github.event.inputs.runner-type || vars.QUALITY_RUNNER) == 'self-hosted' && fromJson('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.12, not the 3.11 the sibling jobs use, because 3.12.3 is the interpreter the
          # clone-verified green run was measured on. UNVERIFIED on 3.11 — no 3.11 exists on
          # the box this was verified from, and pinning the gate to an interpreter the suite
          # was never run under would make its first execution the experiment.
          python-version: "3.12"
      - name: gate-tests-coverage platform (isolated venv, pinned deps)
        run: |
          # Isolated venv, NOT the shared runner interpreter. A self-hosted runner's
          # site-packages persist across jobs; a stale/half-installed `referencing` there made
          # every schema $ref in platform/ resolve as Unresolvable
          # (https://schema.ast-integrate.local/work-unit/1.0.0 and its $defs) and 463 tests
          # failed, while a clean install of these EXACT pins resolved them (verified on py3.12).
          # `--no-cache-dir` also bypasses a poisoned wheel cache, and `referencing` is pinned so
          # the offline registry retrieve callback in platform/lib/wfdsl/schemas.py is
          # deterministic. The three steps below all run through this venv's interpreter.
          python -m venv "$RUNNER_TEMP/platform-venv"
          "$RUNNER_TEMP/platform-venv/bin/pip" install --no-cache-dir --disable-pip-version-check \
            pytest==8.3.3 jsonschema==4.25.1 referencing==0.37.0 cffi
      # Collection is asserted SEPARATELY and first. Three of the four fresh-clone rounds above
      # failed at COLLECTION, not on an assertion, and a bare `pytest` reports that as a generic
      # non-zero exit. Failing here names the cause instead: an import or data dependency is
      # missing from the commit. It also fails closed on an empty walk — 3946 is the measured
      # count, and a collapse to a handful would otherwise look like a fast green.
      # Delegated to tools/measure-guard/suitefloor.py rather than inlined here. The first version
      # of this step was an untested `[ "$collected" -lt 3900 ]` in this YAML block, which is the
      # shape that produces a gate nobody notices has stopped working. The module carries 20 tests
      # including the four TST-0350 requires: a zero-collected run fails, a below-floor run fails,
      # a normal run passes so the floor is not a nuisance gate, and a collection ERROR counts as
      # zero rather than as a healthy small suite.
      - name: gate-tests-coverage platform (collection floor)
        run: |
          "$RUNNER_TEMP/platform-venv/bin/python" tools/measure-guard/suitefloor.py --suite platform
      - name: gate-tests-coverage platform (suite)
        run: |
          "$RUNNER_TEMP/platform-venv/bin/python" -m pytest platform -q -p no:cacheprovider

  sast:
    name: gate-sast (opengrep)
    runs-on: ${{ (github.event.inputs.runner-type || vars.QUALITY_RUNNER) == 'self-hosted' && fromJson('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Gate 4 — static security analysis with the CURATED in-repo ruleset under
      # .quality/opengrep/ (NOT --config auto: registry packs are network-fetched and drift,
      # making the gate non-deterministic). Clean-zero: 0 findings, no baseline. Genuine
      # false-positives are suppressed inline with a greppable `# nosemgrep: <rule-id> -- reason`.
      # opengrep binary is pinned; the rules are opengrep/semgrep-compatible (verified locally
      # with semgrep CE 1.166.0). Excludes mirror the local verification command in the ruleset README.
      #
      # INSTALL AND SCAN ARE TWO STEPS ON PURPOSE. Recorded in
      # command-center/ci/orchestrator-flake-note.md: run 31632302523 @ 86dde6c1 reported
      # `failure  gate-sast (opengrep)` from `curl: (56) Connection died, tried 5 times` in the
      # INSTALL half. opengrep never ran and zero files were scanned, yet at job level that is
      # INDISTINGUISHABLE from a real finding -- the orchestrator read the job verdict and was one
      # sentence from concluding that a just-landed `# nosemgrep` waiver had not worked. The only
      # tell was 40 lines down in the log. Split, the failing STEP NAME says which half broke.
      #
      # `--retry-all-errors` is the flag that matters: the `tried 5 times` text came from curl's
      # OWN internal retry of a connection reset mid-transfer, which plain `--retry` does not cover.
      #
      # `test -s` catches the empty-file case (and `curl -f` already turns an HTTP error into no
      # file at all). It does NOT catch a truncated-but-non-empty download; that would still
      # surface in the scan half. Running the binary itself (`opengrep --version`) would close
      # that gap and is the next increment -- not done here because this change is verified by
      # forcing both failure states, and an unverified flag guess would undercut that.
      #
      # DELIBERATELY NOT ADDED: `continue-on-error`, `|| true`, or any masking of a failed
      # install. A security gate that cannot run must fail -- loudly as infrastructure, never
      # silently as success. Both step names keep the `gate-sast` marker, so the bidirectional
      # charter check in .quality/charter_check.sh maps them to the same declared slug.
      - name: gate-sast opengrep install (infrastructure failure, not a finding)
        run: |
          # $RUNNER_TEMP, not /usr/local/bin: a self-hosted runner's job user need not own
          # /usr/local/bin, and `curl -o /usr/local/bin/opengrep` there dies with
          # `curl (23) Failure writing output to destination` -- the install half failing, not a
          # finding. $RUNNER_TEMP is always writable by the job on GitHub and self-hosted alike.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            -o "$RUNNER_TEMP/opengrep" \
            https://github.com/opengrep/opengrep/releases/download/v1.23.0/opengrep_manylinux_x86
          chmod +x "$RUNNER_TEMP/opengrep"
          test -s "$RUNNER_TEMP/opengrep"
      - name: gate-sast opengrep scan (curated in-repo ruleset)
        run: |
          "$RUNNER_TEMP/opengrep" scan --config .quality/opengrep --error \
            --exclude node_modules --exclude .venv --exclude vendor \
            --exclude dist --exclude out --exclude build .

  secrets:
    name: gate-secrets (gitleaks)
    runs-on: ${{ (github.event.inputs.runner-type || vars.QUALITY_RUNNER) == 'self-hosted' && fromJson('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Gate 5 — secret scan over full history, honoring the committed .gitleaks.toml
      # allowlist (owner-intentional private-env store + reasoned doc/fixture placeholders).
      # New real secrets outside those explicit paths still fail the gate.
      #
      # The verdict is a SINGLE range-independent scan: the pinned gitleaks binary over the
      # FULL local history with the committed .gitleaks.toml. A `gitleaks/gitleaks-action`
      # step used to run first but was NEVER the verdict, and is now removed. Two independent
      # reasons:
      #   1. Truncated range. At the pinned v3.0.0 the action issues exactly ONE unpaginated
      #      `GET /repos/{owner}/{repo}/pulls/{pull_number}/commits` and takes the last SHA of
      #      page 1 as its head endpoint (src/gitleaks.js:160-178; same in the executed
      #      dist/index.js; `octokit.paginate` has 0 call sites). GitHub's default page size is
      #      30, so on a PR with >30 commits it stops at commit 30 and a secret added in commit
      #      31 is never assessed while the job exits 0. Its only range knob (BASE_REF) moves
      #      the base end only, so no configuration of the action fixes it.
      #   2. Install-half fragility. The action's bundled installer downloads gitleaks to a
      #      HARDCODED /tmp path; on a self-hosted runner whose job user cannot write there it
      #      fails the whole job before scanning (`/tmp/gitleaks.tmp already exists` /
      #      `Cannot mkdir: Permission denied`) -- an infrastructure failure indistinguishable
      #      at job level from a real finding. The scan below owns its download under
      #      $RUNNER_TEMP, so it does not share that fate.
      # On a pull_request the checkout is the merge revision, so every PR commit is an ancestor
      # of HEAD and is covered regardless of commit count. Re-measured on main @ dab44ba with
      # the pinned 8.30.1 binary: 422 commits, ~97 MB, "no leaks found", exit 0, 23s.
      #
      # A release tarball fetched by `curl` is not covered by the "all actions are SHA-pinned"
      # rule at the top of this file, so it carries its own digest. The expected sha256 was
      # taken from the release's own checksums.txt AND independently recomputed from the
      # downloaded artifact (both = 551f6fc8…). Bumping GITLEAKS_VERSION therefore REQUIRES
      # bumping GITLEAKS_SHA256 in the same edit.
      - name: gate-secrets full-history scan (range-independent)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          # HEAD-scoped on purpose. `gitleaks git` defaults to `git log --all`, and
          # `fetch-depth: 0` above fetches EVERY remote branch, so the default scanned
          # refs that are not ancestors of this PR at all. Measured 02.09.2026: the same
          # PR range was clean (20 commits, 307 KB, 0 leaks) while the default scan
          # reported 1434 commits / 1.10 GB / 820 leaks -- all of them inside the frozen
          # P2 capture on handoff/cloud-agent-2026-09-02 + p2/loop-to-green-2026-09-02,
          # so every open PR went red for content it does not carry. `--full-history HEAD`
          # is exactly the claim the comment above makes: everything an ancestor of the
          # merge revision, nothing else. Re-measured on main @ 5fa34fd with 8.30.1:
          # 950 commits, ~219 MB, "no leaks found", exit 0, 17s.
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --exit-code 1 \
            --log-opts="--full-history HEAD" .

  deps:
    name: gate-deps (osv-scanner)
    runs-on: ${{ (github.event.inputs.runner-type || vars.QUALITY_RUNNER) == 'self-hosted' && fromJson('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Gate 6 — known-CVE scan of the committed npm lockfiles. Reasoned, dated per-CVE
      # ignores live in the root osv-scanner.toml; no baseline.
      #
      # --config is REQUIRED, not cosmetic. osv-scanner auto-loads osv-scanner.toml only
      # from the SCANNED FILE's own directory and "does not propagate to child
      # directories", so the root config governs package-lock.json alone; a lockfile
      # scanned from any SUBDIRECTORY silently ignores every root-level ignore entry
      # unless --config is passed. Passing it applies the one root config to every parsed
      # file (and ignores any per-directory osv-scanner.toml). Keep it whenever a non-root
      # --lockfile is added below.
      #
      # The second --lockfile restores the slot the agentify-desktop retirement vacated. That
      # retirement DELETED the second entry instead of repointing it, which left
      # tools/mcp/hacktricks-mcp-server scanned by nothing at all — and it was the tree actually
      # carrying findings (8 at the time, including ip-address GHSA-mwp4-54f8-5fhr at CVSS 7.7
      # and fast-uri GHSA-7p8r-x3mc-p8w7 at CVSS 7.5). It is not a vendored tree: it is our own
      # hardened server, and its tests already run as a required context in gate-tests-coverage
      # (node workspaces) above. Scanning it here is what makes the auto-merge path safe for it —
      # Dependabot opens SECURITY PRs against it regardless of dependabot.yml, so before this
      # line such a PR could auto-merge with no CVE gate on that tree.
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=package-lock.json
            --lockfile=tools/mcp/hacktricks-mcp-server/package-lock.json
            --lockfile=browser-bridge/chrome-bridge-mcp/package-lock.json
            --lockfile=tools/editor/ralph-orchestrator/vendor/package-lock.json
      # browser-bridge/chrome-bridge-mcp/package-lock.json landed 2026-08-28 (779df004) and was
      # never added here, so this gate stayed green on 2026-09-01 while Dependabot held four
      # open alerts against it (hono < 4.12.34, GHSA-8j4g-w8fx-2239 / -54fx-42gc-7vw4 /
      # -f23p-vx2j-j53r / -79qm-7rj5-m7r9). A required check that does not read a lockfile
      # cannot fail on it.
      #
      # The fourth --lockfile, tools/editor/ralph-orchestrator/vendor/package-lock.json, was
      # DELIBERATELY unlisted until 2026-09-01 on the reasoning that it is a vendored upstream
      # snapshot this repo "cannot patch without diverging from upstream", and that the fix was
      # to re-vendor a newer ralph-orchestrator. Both halves were measured and REFUTED on
      # 2026-09-01 (kept here rather than deleted, per house style):
      #   * `npm audit --package-lock-only` on the vendored lockfile: 17 findings (1 critical,
      #     10 high, 5 moderate, 1 low). On upstream's own v2.10.1 lockfile (latest release,
      #     2026-06-23): 22 findings (1 critical, 13 high, 7 moderate, 1 low). On upstream
      #     main @ edc2b326 (2026-08-25): the same 22. Re-vendoring does not fix the findings;
      #     it adds five.
      #   * `npm audit fix --package-lock-only` + `npm update tsx --package-lock-only` on the
      #     vendored lockfile: 17 -> 4 npm-audit findings, all four being ONE dev-only chain
      #     (drizzle-kit -> deprecated @esbuild-kit -> esbuild 0.18.20, GHSA-67mh-4wv8-2f99)
      #     with no non-breaking fix; the three package.json files are byte-identical before
      #     and after, so the divergence from upstream is confined to resolved versions inside
      #     declared semver ranges. The vendored suites pass on the result (backend 178/178 via
      #     tsx --test, dashboard 144/144 via vitest, `npm run build` clean).
      # The lockfile was already patched in place once before (83732eaa, 2026-04-04, picomatch),
      # so this is the second in-place fix, not a new precedent. The one residual carries a
      # reasoned, dated ignore in osv-scanner.toml; everything else reached clean-zero by
      # upgrade. Scanning it here is what stops the next five months of silent drift: GitHub's
      # dependency graph skips vendor/ paths, so this gate is the ONLY thing that reads it.
      # Same-day proof, pinned osv-scanner 2.5.1: with this line and the unfixed lockfile the
      # gate exits 1 ("14 packages affected by 37 known vulnerabilities, 1 Critical 23 High");
      # with the fixed lockfile it exits 0 ("No issues found", 1 filtered).
