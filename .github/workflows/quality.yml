      # D-a016: the coverage-authority contract between agents/tdd-guide.md and
      # rules/common/testing.md. The rules make .coverage-thresholds.json the SSOT and keep
      # 80%+ only as the no-threshold-file fallback; the TDD specialist those rules route
      # coverage verification TO used to assert a flat 80%+ in four places and never named
      # the SSOT, so on a repo whose threshold file sets a higher floor the one agent whose
      # job is verifying coverage was the one that could report a false sufficient. The suite
      # forbids a coverage percentage on any line of those two documents that does not name
      # the threshold file, in BOTH directions, and carries a both-states probe that re-runs
      # the predicate over the verbatim pre-fix wording, per the both-states discipline in
