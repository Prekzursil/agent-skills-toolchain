      # hooks/_dispatch/test_wiring.py also audits a deployed Windows harness, so
      # running the whole module is not repo-portable. Select only its cross-consumer
      # plugin-manifest conformance tests in this required Python test lane.
      - name: gate-tests-coverage hook manifest conformance
        run: python -m pytest hooks/_dispatch/test_wiring.py -q -k hook_manifest_conformance

      # browser-rail helper -- PURE-logic unit tests only: no browser, no
      # playwright install, no network (browser_rail.py imports playwright lazily).
