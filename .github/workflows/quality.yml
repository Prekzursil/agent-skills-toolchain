      # --self-test is the same discipline applied to the gate's own rules.
      # Reuses the existing gate-tests-coverage charter slug on purpose - it is
      # not a new gate, so .quality/charter_check.sh stays consistent with no
      # charter.yml edit. Measured locally on python 3.14.6: 29 test functions
      # passed, 5/5 mutations killed, all 10 rules fired in the broken state.
      - name: gate-tests-coverage claim-verify-gate (suite + mutation probe)
        run: |
          python .agents/skills/claim-verify-gate/scripts/claim_gate.py --self-test
          python .agents/skills/claim-verify-gate/scripts/test_claim_gate.py
          python .agents/skills/claim-verify-gate/scripts/test_claim_gate_mutations.py
      # G-06: the schema module is tested AND its linter is run over the checked-in
      # workflows, so a schema defect in a production workflow fails the gate.
      - name: gate-tests-coverage fanout-schema (module + production lint)
        working-directory: tools/fanout-schema
        run: |
          npm test
