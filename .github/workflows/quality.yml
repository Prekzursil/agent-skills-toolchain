        run: |
          python -m pytest \
            ci/tests/test_harness_corpus_wiring.py \
            tools/harness-corpus/test_hook_telemetry.py \
            hooks/git-hygiene/test_docs_hygiene.py -q
      # D-p1b03: the copy-pasteable hook JSON in rules/**/hooks.md must use the
      # three-level event -> matcher-group -> typed-handler shape that
      # agent-self/harness/registration.py emits. A flat "command" on the matcher
      # group is invalid and the hook NEVER FIRES -- silently, so only a mechanical
