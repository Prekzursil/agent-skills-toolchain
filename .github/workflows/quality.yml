      # 100% line+branch gated: the module is pure stdlib logic whose only I/O (the jsonl
      # manifest, the rotating shadow sink) is exercised through tmp_path. Named explicitly
      # like the suites above -- there is no repo-wide pytest autodiscovery, so an unnamed
      # suite is dead weight. Reuses the gate-tests-coverage charter slug on purpose (not a
      # new gate), so .quality/charter_check.sh stays consistent with no charter.yml edit.
      # Measured on python 3.14.6 via the pytest CONSOLE SCRIPT: 93 passed, 100% (405 stmts,
      # 156 branches, 0 missing); a 7-mutation probe over the load-bearing decisions
      # (nesting/size ceilings, write-ahead partial, latest_state recency, scope collision,
