      # (not a new gate), so .quality/charter_check.sh stays consistent with no charter edit.
      - name: gate-tests-coverage rules/commands doc contracts
        run: python -m pytest ci/tests/test_rules_doc_contracts.py -q
      # A023 + A048: rules/ documentation coherence. Two first-party contradictions
      # shipped on main because no gate reads two documents side by side — the review
      # Block boundary (rules/common/code-review.md grades HIGH -> WARN while the Python
      # and TypeScript surfaces block on HIGH, so one HIGH-only result had two terminal
