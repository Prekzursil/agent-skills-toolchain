name: decisions

# Decision-record gate (docs/RUNBOOK-2026-09-24-settle-and-harden.md, Phase 4a).
# ci/check_decisions.py fails when a record under docs/decisions/ has missing or malformed
# frontmatter, when an accepted record is past review_by with no retested: line dated on or
# after it, or when supersedes names a file that does not exist. The suite after it is
# hermetic (tmp_path only) and proves each of those rules can fire.
#
# Its own file rather than a job in quality.yml, for the reason skill-dual-write.yml and
# interpreter-floor.yml give: .quality/charter_check.sh polices quality.yml's gate set
# bidirectionally, so a new gate there needs coordinated charter edits.
#
# Expiry is judged when this runs (a pull request or a push to main), not on the date itself.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: decisions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decisions:
    name: gate-decisions
    # Runner selector shared with quality.yml / skill-dual-write.yml / no-runtime-junk.yml.
    # Hardcoded ubuntu-latest left this gate unable to allocate a runner while the Actions
    # budget is exhausted (runner_id 0, conclusion failure, zero steps run) -- an infra state,
    # not a verdict. Defaults to ubuntu-latest when QUALITY_RUNNER is unset, so it is additive.
    runs-on: ${{ vars.QUALITY_RUNNER == 'self-hosted' && fromJson('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pytest==8.4.2
      - name: check decision records
        run: python ci/check_decisions.py
      - name: decision check self-test
        run: pytest ci/tests/test_check_decisions.py -q
