[project]
name = "mcp-manager"
version = "0.2.0"
description = "Cross-plane MCP server manager — CLI + TUI"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.11.1",
    "textual>=0.80",
    "tomlkit>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv]
dev-dependencies = [
    "pytest>=7",
    "pytest-cov>=4",
]
