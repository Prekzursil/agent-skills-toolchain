[mcp_servers.serena]
command = "C:/Users/Prekzursil/.local/bin/uvx.exe"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "codex", "--project-from-cwd"]
enabled = true

[mcp_servers.notion]
url = "https://mcp.notion.com/sse"
enabled = true

[mcp_servers.terraform]
command = "docker"
args = ["run", "-i", "--rm", "-e", "TFE_ADDRESS", "-e", "TFE_TOKEN", "-e", "ENABLE_TF_OPERATIONS", "docker.io/hashicorp/terraform-mcp-server:0.4.0"]
env_vars = ["TFE_ADDRESS", "TFE_TOKEN", "ENABLE_TF_OPERATIONS"]
enabled = true

[mcp_servers.terraform.env]
ENABLE_TF_OPERATIONS = "false"

[mcp_servers.unity]
command = "C:/Users/Prekzursil/.local/bin/uvx.exe"
args = ["--from", "mcpforunityserver", "mcp-for-unity", "--transport", "stdio"]
enabled = false

[mcp_servers.ghidra]
command = "C:/Users/Prekzursil/AppData/Local/Programs/Python/Python312/python.exe"
args = ["D:/Program Files/Ghidra/ghidra_12.0.3_PUBLIC/bridge_mcp_ghidra.py"]
enabled = false

[mcp_servers.mindsdb]
enabled = true
url = "http://127.0.0.1:47334/mcp/sse"
