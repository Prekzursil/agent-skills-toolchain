[project]
name = "qdx-rush-mcp"
version = "2.0.0"
description = "QDX Rush / EXESS quantum-chemistry MCP — 20 tools wrapping rush-py 7.1.0 (QM interaction energies, folding, prep, PB solvation). Hardened v2: run_collect returns parsed energies, retry/backoff, method validation."
requires-python = ">=3.12,<3.13"  # rush-py's libqdx (Rust/PyO3) builds only on 3.12; 3.14 fails, 3.13 untested
dependencies = [
    "rush-py==7.1.0",
    "mcp>=1.2.0",
    "python-dotenv>=1.0.0",
]

# Flat single-file server (qdx_mcp_server.py), launched as a script — not an installable package.
# Runtime:  cd tools/mcp/qdx-rush-mcp && uv sync   # builds .venv with rush-py 7.1.0 on Python 3.12
# Register: command="uv", args=["run","--directory","<this dir>","python","qdx_mcp_server.py"]
# Auth:     ~/.rush/.env  (RUSH_TOKEN + RUSH_PROJECT) — never committed to this repo.
[tool.uv]
package = false
