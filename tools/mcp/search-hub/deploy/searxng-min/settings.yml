# Minimal SearXNG settings for the `bundled` profile of the self-hosted search
# stack. The ONE non-default that matters: `json` MUST be in search.formats or
# TrailSearch (and any JSON API client) gets HTML it cannot parse. Everything
# else is left at the image defaults on purpose -- this is a low-RAM, single-user
# instance, not a public one.
#
# `secret_key` below is a LOCAL, non-sensitive dev placeholder for a loopback-only
# instance (no cookies of value, not internet-facing). Override it via the
# SEARXNG_SECRET env or edit here if you expose the instance. It is intentionally
# NOT a credential in the .agents/local.json sense.
use_default_settings: true

server:
  secret_key: "selfhosted-search-local-dev-key-change-if-exposed"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json

engines:
  - name: google
    disabled: false
  - name: duckduckgo
    disabled: false
  # Onion lane (Ahmia INDEX ONLY). Off at the hub by default (ENABLE_ONIONS=0);
  # this only makes the engine available in SearXNG. ENVELOPE
  # (docs/legal/onions-lane-envelope.md): query the Ahmia index over CLEARNET
  # ahmia.fi only -- NO Tor/SOCKS proxy, NEVER the Ahmia .onion. The SearXNG
  # master default points this engine at the Ahmia .onion (needs Tor); we pin it
  # to clearnet and set NO `outgoing.proxies`, so the lane FAILS CLOSED (empty /
  # truthful error) rather than silently reaching for Tor. Not Evil / Torch are
  # deliberately NOT enabled (dead engines). Verify results on your estate
  # instance from a residential IP: ahmia.fi 302-redirects datacenter/bot queries
  # to its homepage (measured 2026-09-02), so a cloud probe returns nothing.
  - name: ahmia
    engine: ahmia
    disabled: false
    categories: onions
    shortcut: ah
    base_url: https://ahmia.fi
    search_url: https://ahmia.fi/search/?{query}
    timeout: 10.0
