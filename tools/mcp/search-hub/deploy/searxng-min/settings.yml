# Minimal SearXNG settings for the `bundled` profile of the self-hosted search
# stack. The ONE non-default that matters: `json` MUST be in search.formats or
# TrailSearch (and any JSON API client) gets HTML it cannot parse. Everything
# else is left at the image defaults on purpose -- this is a low-RAM, single-user
# instance, not a public one.
#
# `secret_key` below is a LOCAL, non-sensitive dev placeholder for a loopback-only
# instance (no cookies of value, not internet-facing). Override it via the
# SEARXNG_SECRET env or edit here if you expose the instance. It is intentionally
# NOT a credential in the .agents/local.json sense.
#
# use_default_settings is the MAPPING form (not the `true` scalar) so we keep every
# default engine EXCEPT the two onion-only ones we must drop: stock SearXNG marks
# any engine whose `categories` contains the literal string "onions" INACTIVE unless
# a working Tor proxy is configured (searx/engines/__init__.py is_engine_active), and
# it probes check.torproject.org at startup. Our envelope forbids Tor, so we remove
# the Tor-gated `ahmia` (onion-only) and `torch` defaults and register a CLEARNET
# Ahmia engine under a NON-"onions" category (`onion index`) that loads without Tor.
use_default_settings:
  engines:
    remove:
      - ahmia   # onion-only default (base_url = Ahmia .onion) -> needs Tor; drop it
      - torch   # onion-only, Tor-gated, out of scope

server:
  secret_key: "selfhosted-search-local-dev-key-change-if-exposed"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json

engines:
  - name: google
    disabled: false
  - name: duckduckgo
    disabled: false
  # Onion lane (Ahmia INDEX ONLY). Off at the hub by default (ENABLE_ONIONS=0);
  # this only makes the CLEARNET Ahmia engine available in SearXNG. ENVELOPE
  # (docs/legal/onions-lane-envelope.md): query the Ahmia index over CLEARNET
  # ahmia.fi only -- NO Tor/SOCKS proxy, NEVER the Ahmia .onion. Category is
  # `onion index`, NOT the literal "onions" (which stock SearXNG forces onto Tor).
  # Select it with engines=ahmia or categories="onion index". With NO
  # `outgoing.proxies`, the lane FAILS CLOSED (empty / truthful error) rather than
  # reaching for Tor. Verify results on your estate instance from a residential IP:
  # ahmia.fi 302-redirects datacenter/bot queries to its homepage (measured
  # 2026-09-02), while the clearnet /search/ markup the engine parses is confirmed.
  - name: ahmia
    engine: ahmia
    disabled: false
    categories: onion index
    shortcut: ah
    base_url: https://ahmia.fi
    search_url: https://ahmia.fi/search/?{query}
    timeout: 10.0
