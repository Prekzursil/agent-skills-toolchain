[project]
name = "glm53-space"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.14.2",
    "mcp>=2.1.1",
    "openai>=3.6.0",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
