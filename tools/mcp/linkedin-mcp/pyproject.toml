[project]
name = "linkedin-mcp"
version = "0.1.0"
description = "linkedin-mcp -- self-serve LinkedIn (personal developer app) over stdio: Sign In with LinkedIn (OpenID Connect) identity + Share on LinkedIn member posting. Scoped to the Open Permissions surface a personal app can enable without partner review. Credentials via env only; never handles a committed secret."
requires-python = ">=3.10"
dependencies = [
    "mcp==1.30.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

# Flat two-file server (server.py + linkedin_core.py), launched as a script --
# not an installable package (mirrors codex-fleet-github / qdx-rush-mcp).
#   Runtime:  cd tools/mcp/linkedin-mcp && uv sync   # builds .venv with mcp
#   Register: command="<.venv python>", args=[".../server.py"]
#   Auth:     LINKEDIN_ACCESS_TOKEN / LINKEDIN_CLIENT_ID / LINKEDIN_CLIENT_SECRET
#             / LINKEDIN_REDIRECT_URI in the server environment. NO secret is ever
#             committed; see SETUP.md for the developer-portal click-path.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
