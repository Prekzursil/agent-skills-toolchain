[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monitorcore"
version = "0.1.0"
description = "Shared monitoring + export core — redaction, text-safety, timeline IR, the PDF-engine ladder, the generic ReportDoc render layer, and the MonitorSource/Snapshot contract that every monitor adapter (wfmon, agents, fep, …) plugs into"
requires-python = ">=3.11"
# STDLIB-LIGHT CORE — runtime dependencies are intentionally EMPTY.
# monitorcore is VENDORED (copied) into stdlib-only skills
# (skills/workflow-monitor/monitorcore/), so a mandatory third-party import would
# ImportError the skill's plain Python at runtime. Heavy engines (PDF renderers)
# are feature-detected + optional and degrade; monitors.toml is READ with the
# stdlib `tomllib` (never tomlkit — this package does not WRITE toml). If a write
# path ever appears, add its writer dep as an OPTIONAL extra, not a core dep.
dependencies = []

# ONE named package (NOT taskwatch_monitor's flat core/probes/... layout):
# monitorcore is vendored into consuming skills as a single importable
# `monitorcore/` dir, so the package name must be unambiguous. This set does not
# grow — sub-modules land as files inside the one package (redact, textsafe,
# timeline, pdf, report_doc, render_md, render_html, contract, agent_tail, … ).
[tool.setuptools]
packages = ["monitorcore"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true

[tool.basedpyright]
# The gate runs `basedpyright monitorcore` at STANDARD mode (see
# .github/workflows/quality.yml). Pinned here so the gate is reproducible and
# does not inherit basedpyright's stricter config-less default. Only package
# SOURCE is checked; tests are intentionally looser.
typeCheckingMode = "standard"

[tool.uv]
dev-dependencies = [
    "pytest>=7",
    "pytest-cov>=4",
]
