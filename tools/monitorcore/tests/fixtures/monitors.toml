# Fixture registry mirroring the shipped monitors.toml — one [table] per monitor.
# A stray top-level scalar is present to exercise the non-table skip in load_monitors.
schema = 1

[wfmon]
dir = "workflow-monitor"
entry = "workflow_monitor.py"
trigger_tool = "Workflow"

[agentmon]
dir = "run-agent-monitor"
entry = "agentmon.py"
trigger_tool = "Task"

[nolaunch]
dir = "somewhere"
entry = "x.py"
