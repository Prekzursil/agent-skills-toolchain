# Codex profile: build-sandboxed  (scoping manifest: build-sandboxed.scope.json)
# Scoped implementation with approvals + scoped skills. Workspace-write sandbox,
# on-request approvals, high reasoning, live web. Mode M1 (difference-disable) — the
# builder MCP set is materialized by codex-invoke at spend time; if skills_allowlist
# is honored the run moves to an ephemeral CODEX_HOME whose materialized config.toml
# carries exactly the allowlisted MCP defs (spec §2b). Scalars only here (spec G6).
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[shell_environment_policy]
inherit = "core"
