# stores.yaml - agent-session vault source registry (agent_sessions_sync.py)
# Vault: D:/agent-sessions-vault  (content lives OUTSIDE git; repo owns tooling+manifests)
#
# FINAL CONSOLIDATED REGISTRY (2026-10-18, sessions-repo-wiring lane, branch
# sessions/vault-sync). Provenance: the vault-build registry (branch sessions-vault,
# tools/sessions-vault/stores.yaml - the registry that BUILT the live manifest,
# 134,828 entries / 57 store ids) merged with the tooling lane's registry
# (98515d111, 25 stores, 6 on-disk-probed extras). Reconcile-not-duplicate: the
# vault-build ids are canonical (they key the live manifest.jsonl); tooling-lane
# ids that pointed at the SAME paths were folded in as aliases documented below.
# Entries below are ordered by DEDUP PRIORITY (first store holding a sha owns
# the canonical copy) - DO NOT reorder: the vault-build order is load-bearing.
#
# Engine requirement: agent_sessions_sync.py >= 1.2.0 (vault dialect: modes
# tree/accepted/accepted_top/accepted_top2/files/move). The watchdog runs the
# live copy at C:/Users/Prekzursil/.agents/scripts/agent_sessions_sync.py.
#
# Modes:
#   tree          - whole tree minus global prunes (node_modules/.git/__pycache__/...)
#   accepted      - session-file accept filter (same rule as tss/tsis-deepdive corpus)
#   accepted_top  - accept filter, files directly in store root only
#   accepted_top2 - accept filter, depth<=2 (globalStorage vscdb pattern)
#   files         - explicit file list (| separated)
#   move          - same-volume rename into vault/stores/<id>, then adopt+index
#                   (ONLY for already-archived trees; owner-approved for the codex
#                   archive; once the vault dir exists the store adopts-in-place
#                   CALMLY - the source being gone is the post-move steady state)
#
# Tooling-lane id merge map (their id -> canonical id here):
#   opencode-data       -> opencode                     (same path)
#   cyberstrike-tui     -> cyberstrike-share            (same path)
#   cursor-auth-backups -> cowork-private               (same path)
#   grok (includes)     -> grok + grok-root + grok-desktop
#   gemini-cli (~/.gemini whole) -> gemini-cli + gemini-history + gemini-antigravity
#   continue-vscode (excl index/) -> continue-index + continue-vscode (full tree)
#   codex-archive-20260621 (mode: rename) -> codex-archive-20260621 (mode: move, done)
#   claude-code/codex-live/zcode-*/cursor-chats/d-backups etc. -> same ids here

