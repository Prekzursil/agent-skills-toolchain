[project]
name = "scholarly-access-mcp"
version = "0.1.0"
description = "Lawful scholarly access MCP — resolve DOI/PMID/arXiv/title, classify access honestly, route ONLY to legitimate open-access sources. No Sci-Hub / LibGen / paywall bypass."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.31.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
scholarly-access-mcp = "scholarly_access.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scholarly_access"]

[tool.pytest.ini_options]
# test_live.py is a manual, network-dependent end-to-end script (run directly:
# `python tests/test_live.py`). It has no pytest test functions and executes
# network calls + sys.exit() at import, so it is excluded from automated runs.
addopts = "--ignore=tests/test_live.py"
