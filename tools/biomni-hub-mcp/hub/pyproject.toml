[project]
name = "biomni-hub"
version = "0.1.0"
description = "Unified Biomni MCP: 10 canonical tools over online + Databricks backends"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.23.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    # A3 feature store (biomni_run_history / biomni_cost / biomni_tool_catalog).
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
# Databricks backend (Track B) — only needed when BIOMNI_BACKEND=databricks.
databricks = ["databricks-sdk>=0.30.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "databricks-sdk>=0.30.0"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
