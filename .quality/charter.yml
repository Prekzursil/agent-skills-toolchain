# Machine-readable declaration of the closed quality-gate set for this repository.
#
# Consumed by .quality/charter_check.sh (the charter <-> workflow consistency gate) and
# detected by the QZT reusable-quality.yml workflow. Keep this in sync with QUALITY-CHARTER.md
# (the human charter) and .github/workflows/quality.yml (one-in / one-out): each gate below
# MUST have at least one matching `gate-<slug>` step/job in the workflow, and vice versa.
#
# This is the toolchain's adoption of the QZT lean-gate model. Every gate is a version-pinned
# tool configured from an in-repo file; there is no SaaS quality platform, no baseline file,
# and no network-fetched rule pack in the gate.

gates:
  - slug: lint-format
    tools: ["ruff 0.15.17"]
    enforces: >-
      Lint + format + security-lint across Python (ruff check + ruff format --check),
      honoring the committed ruff.toml. Auto-fixers: ruff check --fix; ruff format.
  - slug: types
    tools: ["basedpyright 1.39.8"]
    enforces: >-
      basedpyright (standard mode) over the SOURCE of the shipped Python packages —
      tools/mcp-manager (core, ui, app.py), tools/scholarly-access-mcp (scholarly_access),
      tools/taskwatch_monitor (core, probes, cli, mcp_server, hooks, ui),
      tools/monitorcore (monitorcore), tools/agentspec (agentspec), tools/mcpctl (mcpctl)
      and tools/agentrail (agentrail) and tools/mcpapply (mcpapply)
      -- each checked from its own root with its deps installed so imports resolve. mcpctl needs
      no install because its source is stdlib-only and its optional monitorcore reuse goes through
      importlib with a STRING module name, so there is no static sibling import to resolve.
      agentrail and mcpapply need no install either, but for the OPPOSITE reason: each DOES
      statically import a sibling (agentspec and mcpctl respectively) and resolves it via
      `[tool.basedpyright] extraPaths`, because an editable sibling install is INVISIBLE to
      basedpyright -- setuptools emits a MetaPathFinder inside a .pth holding executable code, and
      basedpyright neither runs .pth code nor follows a finder. Measured BOTH WAYS for each
      package: 17 errors with the extraPaths line removed, 0 errors with it present.
  - slug: tests-coverage
    tools: ["pytest + pytest-cov", "node --test"]
    enforces: >-
      Strict 100% line+branch coverage for the shipped Python packages (mcp-manager,
      scholarly-access-mcp, taskwatch_monitor, monitorcore, agentspec, mcpctl, agentrail,
      mcpapply) plus the node workspace tests (root + agentspec-js) and the
      chrome-bridge-mcp package-wide offline unit gate (cdp-allowlist, hub, pagescript,
      setup, tools: 100% lines strict; branches/functions at measured floors because
      node's runner cannot pragma branch slots - the residue is reasoned defensive
      catches; dist/index.js stays outside as the side-effecting entrypoint, exercised
      by the live Chrome lanes instead). Reasoned
      `# pragma: no cover -- <reason>` only for genuinely-untestable branches; agentspec, mcpctl,
      agentrail and mcpapply carry none at all (measured: 0, 0, 0 and 0 real pragmas in package
      source, against monitorcore's 11). agentspec and mcpctl reach that by being pure; agentrail
      and mcpapply reach it by making every impure edge -- spawn, clock, filesystem, the
      stream-json control channel -- an injected PORT. What that buys DIFFERS per package, and
      the distinction is load-bearing: agentrail's gated suite performs no network I/O and spawns
      no process, whereas mcpapply's DOES spawn short-lived children and bind loopback sockets on
      purpose, to exercise the process guard and the web GUI for real rather than against a mock
      (measured: every bind and connect on 127.0.0.1, zero non-loopback; exact counts move with
      the test suite, so they are deliberately not pinned here). It never
      reaches a real host session. Both also run under `-m "not live"`: agentrail's live rail
      probes and mcpapply's live row (which MUTATES ~/.claude.json through the control channel)
      are default-deselected, and CI filters them a second time at the step.
  - slug: sast
    tools: ["opengrep 1.23.0", "semgrep CE 1.166.0 (local)"]
    enforces: >-
      Static security analysis using the curated in-repo ruleset under .quality/opengrep/
      (NOT --config auto). Clean-zero: 0 findings, no baseline; reasoned inline
      `# nosemgrep: <rule-id> -- <reason>` suppressions only.
  - slug: secrets
    tools: ["gitleaks"]
    enforces: >-
      Secret scan with the committed .gitleaks.toml allowlist (owner-intentional private-env
      store + reasoned doc/fixture placeholders only). Gate on 0.
  - slug: p2-delivery
    tools: ["jsonschema 4.25.1"]
    enforces: >-
      The P2 DELIVERY predicate (command-center/ready_units.py), which decides whether each of the
      2,007 work units is actually delivered, run in CI rather than only when a human types the
      command. Measured gap it closes: `grep -rn "ready_units" .github/workflows/ tools/` returned
      0 hits, so a regression to the predicate -- or a fabricated artifact committed under
      command-center/receipts/ -- was green on every pull request. Same green-not-live shape
      wudeps.py already closed for work-unit DEPENDENCIES; DELIVERY was the half left open.
      Every artifact is graded from the COMMITTED BLOB via `git cat-file` (never `git archive`,
      which returns the Windows CRLF worktree bytes) and must agree with its worktree copy,
      because working-tree-green != clone-green. Ratchets on a two-directional baseline
      (vacuous_declarations 3, units_declaring_a_vacuous_contract 23): it fails if the count RISES,
      and equally if it FALLS without the baseline being lowered, so the gate cannot silently
      loosen. Read-floors fail closed under 1,500 units or 40 artifacts rather than reporting a
      green computed over a collapsed read.
  - slug: deps
    tools: ["osv-scanner 2.x"]
    enforces: >-
      Known-CVE scan of every committed npm lockfile (root, tools/mcp/hacktricks-mcp-server,
      browser-bridge/chrome-bridge-mcp, and -- since 2026-09-01 -- the vendored
      tools/editor/ralph-orchestrator/vendor tree, whose lockfile is patched in place by
      non-breaking upgrades rather than left unscanned). Reasoned, dated per-CVE ignores only in
      osv-scanner.toml; no baseline. Dependabot handles freshness separately (not part of the
      6-gate set) and cannot see vendor/ paths, so this gate is the only reader of that lockfile.
