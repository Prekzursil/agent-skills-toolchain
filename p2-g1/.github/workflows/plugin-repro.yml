name: plugin-repro
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/plugin/**"
      - "ci/plugin-repro.yml"
      - ".github/workflows/plugin-repro.yml"
jobs:
  plugin-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: three-way pack
        run: python3 -B tools/plugin/repro_gate.py
      - name: digest equality
        run: python3 -B tools/plugin/repro_gate.py
