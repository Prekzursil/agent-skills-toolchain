title = "ast-integrate plugin secret gate"

[[rules]]
id = "github-pat"
description = "GitHub personal access token"
regex = '''ghp_[0-9A-Za-z]{20,}'''
secretGroup = 0
tags = ["key", "GitHub"]

[[rules]]
id = "github-pat-assignment"
description = "GITHUB_TOKEN assignment"
regex = '''(?i)GITHUB_TOKEN\s*[=:]\s*["']?ghp_[0-9A-Za-z]+'''
tags = ["key", "GitHub"]
