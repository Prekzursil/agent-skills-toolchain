[pytest]
# Tool-local pytest config for the re-harness additive tools (mcp_doc_drift).
# Registers the `live` marker so LIVE-network tests are (a) not unknown-marker
# warnings and (b) excludable from the fast/hermetic suite -- run the fast pass
# with `pytest -m "not live"`; run the live smoke separately (scheduled job).
# See rules/common/ci-hygiene.md #2.
markers =
    live: test performs a real network / subprocess call (excluded via -m "not live")
