# Codex profile: consult-review  (scoping manifest: consult-review.scope.json)
# Advisory / review passes. Read-only, no approvals, max reasoning, live web. Mode M1
# (difference-disable) — research MCP set materialized by codex-invoke at spend time; if
# skills_allowlist is honored the run moves to an ephemeral CODEX_HOME whose materialized
# config.toml carries exactly the allowlisted MCP defs (spec §2b). Scalars only (spec G6).
model = "gpt-5.6-sol"
model_reasoning_effort = "max"
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "live"

[shell_environment_policy]
inherit = "core"
