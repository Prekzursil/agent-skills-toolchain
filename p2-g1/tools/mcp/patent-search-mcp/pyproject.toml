[project]
name = "patent-search-mcp"
version = "0.1.0"
description = "Keyless SureChEMBL patent structure search and metadata MCP for FTO triage."
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "mcp==1.28.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "ruff==0.15.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
