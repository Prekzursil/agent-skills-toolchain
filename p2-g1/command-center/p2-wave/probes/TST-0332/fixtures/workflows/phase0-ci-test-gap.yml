        run: python -m pytest -q
      - name: "gate-tests-coverage codex-databricks-fanout"
        run: python -m pytest -q
      - name: "gate-tests-coverage codex-databricks-fanout (backends+engine 100%)"
        run: python -m pytest -q
  test-matrix:
    name: gate-tests-coverage (matrix windows)
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - suite: "workflow-authoring"
            step_name: "gate-tests-coverage workflow-authoring lint"
          - suite: "omniaudit-mcp"
            step_name: "gate-tests-coverage omniaudit-mcp (vendored; isolated venv)"
          - suite: "vendored-isolation"
            step_name: "vendored-tree import isolation (shared interpreter stays clean)"
          - suite: "tool-result-sentinel"
            step_name: "gate-tests-coverage tool-result-sentinel"
          - suite: "git-hygiene"
            step_name: "gate-tests-coverage git-hygiene message budget"
          - suite: "deny-credential-reads"
            step_name: "gate-tests-coverage deny-credential-reads denylist coverage"
          - suite: "hooks-regression"
            step_name: "gate-tests-coverage hooks regression harness"
          - suite: "memory-guard"
            step_name: "gate-tests-coverage hooks standalone (memory-guard)"
        exclude:
          - suite: "workflow-authoring"
          - suite: "omniaudit-mcp"
          - suite: "vendored-isolation"
          - suite: "tool-result-sentinel"
          - suite: "git-hygiene"
          - suite: "deny-credential-reads"
          - suite: "hooks-regression"
          - suite: "memory-guard"
    steps:
      - name: "${{ matrix.step_name }}"
        run: python -m pytest -q
  test-nightly:
