name: planted-or-true-control
on: push
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect failing-run log (bounded)
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > failing.log 2>&1 || true
      - name: real pytest (no suppression)
        run: python -m pytest -q
