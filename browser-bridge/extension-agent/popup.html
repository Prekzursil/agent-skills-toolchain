<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; color: #111; }
      h1 { font-size: 13px; margin: 0 0 10px; }
      .status { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; font-weight: 600; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #bbb; }
      .dot.on { background: #10a37f; }
      label { display: block; margin: 8px 0 3px; color: #555; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
      input { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid #d0d0d0; border-radius: 5px; font: inherit; }
      .locked { font-family: ui-monospace, Consolas, monospace; }
      button { width: 100%; margin-top: 12px; padding: 7px; border: 0; border-radius: 5px; background: #10a37f; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: #0d8a6c; }
      .hint { margin-top: 10px; color: #777; font-size: 11px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <h1>Chrome Bridge (agent)</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="state">Checking…</span></div>

    <label>Bridge port (locked)</label>
    <div class="locked" id="port">8770</div>

    <label for="token">Hub token (required)</label>
    <input id="token" type="password" placeholder="from local.json chromeBridge.agentToken" autocomplete="off" />

    <button id="save">Save &amp; reconnect</button>
    <p class="hint">This extension talks only to ws://127.0.0.1:8770. Do not load it into the human/1Password Chrome profile — that is extension-live on 8790.</p>
    <p class="hint" id="attached"></p>
    <script src="popup.js"></script>
  </body>
</html>
