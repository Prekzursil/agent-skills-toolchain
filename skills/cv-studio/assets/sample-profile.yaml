x_master:
  Meridian Security Labs|Senior Security Researcher:
    - Reverse-engineered the SAVE_DATA container of a popular mobile title; documented
      the header, checksum, and field layout; released an editor. Adoption reached
      12,000+ players; support tickets for save corruption dropped to near zero.
    - Designed an AOB (array-of-bytes) wildcard signature system that wildcards only
      reloc-sensitive bytes, re-locating functions by pattern after each relink.
      Re-porting the offset table fell from ~3 days of manual work to ~40 minutes,
      validated across 6 shipped game versions.
    - Managed 4 researchers; built a reusable Frida instrumentation harness (spawn,
      SSL-pinning bypass, method tracing) that cut analysis bring-up from ~2 hours to
      ~5 minutes for the team.
  Northwind Digital Forensics|Reverse Engineering Consultant:
    - Emulated a stripped ARM64 .so in Qiling to isolate and reproduce the PRNG seed
      routine, enabling deterministic replay for a fraud case.
    - Wrote and open-sourced 18 Ghidra scripts automating struct/vtable recovery;
      they were indexed by the community and picked up by 300+ analysts.

