# Lean quality gate — gate 5 (secrets) config for gitleaks.
# Extends gitleaks' default ruleset; adds REASONED, greppable allowlists only.
# New real secrets introduced OUTSIDE these explicitly-listed paths still fail
# the gate (and push protection). Do NOT broaden these globs casually.

[extend]
useDefault = true

# --- Allowlist 1: owner-intentional private secrets store -----------------------
# This file carries real plaintext tokens INTENTIONALLY committed to this PRIVATE
# repo "by owner request" (see its own `_warning` field). It is the input to
# env/apply-private-env.ps1. It is allowlisted so the gate reflects that intent
# rather than faking green. SECURITY NOTE (tracked as an escalation, owner's
# call): these tokens are exposed in git history and SHOULD be rotated/revoked
# and migrated to a real secret manager; several belong to retired SaaS
# (Codacy/SonarQube/Codecov/Chromatic/DeepSource) and can simply be revoked.
[[allowlists]]
description = "Owner-intentional private env token store (rotate+migrate — see escalation)"
paths = ['''tools/mcp/workstation-codex-bundle/env/private-env\.windows\.json''']

# --- Allowlist 2: documentation / example / fixture placeholders ----------------
# Example/illustrative tokens inside skill docs, security rubrics, reference docs
# and a vendored Rust test fixture. None are live credentials.
[[allowlists]]
description = "Documentation, security-rubric, reference and test-fixture example tokens"
paths = [
  '''docs/plans/2026-06-10-unified-cross-ai-mcp-architecture-design\.md''',
  '''skills-claude-only/metaswarm-start/rubrics/security-review-rubric\.md''',
  '''skills/ci-silent-pass-lint/gate_findings_at_head\.md''',
  '''skills/cloudflare-deploy/references/.*\.md''',
  '''skills/code-security/.*\.md''',
  '''skills/figma-implement-design/SKILL\.md''',
  # .agents/ mirror of the deployed skill tree (harness rescue faae06d0). The match is
  # `"private_key": "es256_private.key"` — a FILENAME in a c2patool manifest docs
  # snippet, not a key (a real ES256 key is a multi-line PEM).
  '''\.agents/skills/c2patool-provenance/SKILL\.md''',
  '''skills/llm-security/.*\.md''',
  '''tools/editor/metaswarm/.*security-review-rubric\.md''',
  '''tools/editor/metaswarm/skills/start/rubrics/security-review-rubric\.md''',
  '''tools/editor/ralph-orchestrator/vendor/.*tests/.*\.rs''',
  # Vendored upstream codex-rs login source. The flagged literal is
  # TEST_AGENT_IDENTITY_RSA_PRIVATE_KEY_PEM, an upstream unit-test fixture. Three
  # independent signals establish it is not a live key: it sits inside a #[cfg(test)]
  # module (compiled only for tests), its paired JWK carries "kid": "test-key", and the
  # constant is named TEST_*. Not covered by Allowlist 4 because the vendored file is a
  # flat `codex-rs_login_src_*.rs` name with no tests/ directory component. Scoped to
  # this one vendored tree — real secrets anywhere else still fail the gate.
  '''tools/crcp/vendor_src/codex-auth/.*\.rs''',
]

# --- Allowlist 3: export redaction fixture + monitorcore golden -----------------
# The export redactor is proven against synthetic FAKE example secrets (one of
# each locked pattern: sk-, ghp_, github_pat_, AKIA, xoxb-, gho_, a dummy JWT, a
# placeholder PEM) frozen into this fixture transcript. None are live credentials;
# they exist so the redactor can prove it masks every form. The redactor's own
# unit test assembles its PEM marker at run time (no committed literal). Two paths
# need a waiver: the fixture itself, and the monitorcore golden `*.noredact.*`
# regression files -- whose whole point is to freeze the UN-redacted render
# (redaction OFF), so they echo the fixture's fake PEM verbatim.
#
# HISTORY: this waiver was previously written as the singular top-level [allowlist]
# table because the then-pinned gitleaks 8.24.3 did not apply plural [[allowlists]]
# path waivers to the multi-line `private-key` rule. But gitleaks REFUSES to load a
# config that mixes the singular [allowlist] table with [[allowlists]] blocks (the
# two forms are mutually exclusive) — the whole config then failed to parse and the
# gate silently fell back to gitleaks defaults (no waivers), false-flagging every
# synthetic fixture. It is merged here into the [[allowlists]] array form; modern
# gitleaks (>=8.30, what gitleaks-action@ff98106 now resolves) DOES apply plural
# path waivers to the private-key rule (verified: 0 findings over these paths).
[[allowlists]]
description = "export redaction fixture + monitorcore golden (synthetic FAKE example secrets, not live)"
paths = [
  '''skills/workflow-monitor/fixtures/export/.*''',
  # Same fixture, .agents/ mirror path introduced by the harness rescue (faae06d0).
  '''\.agents/skills/workflow-monitor/fixtures/export/.*''',
  '''tools/monitorcore/tests/golden/.*''',
]

# --- Allowlist 4: synthetic secret fixtures in TEST files ------------------------
# Test suites intentionally embed FAKE, synthetic secrets (an AKIA-shaped AWS key,
# fake ghp_/github_pat_ tokens, a dummy JWT, a placeholder PEM, xoxb-/sk- tokens)
# as INPUTS so redaction / egress-guard code can prove it detects and masks every
# form. These literals live ONLY inside test modules. This waiver is scoped to
# test-file paths (a tests?/ directory, or a `test_*.py` / `*_test.py` module) so a
# real secret committed to NON-test source is still caught. Do NOT broaden these to
# non-test source paths.
[[allowlists]]
description = "Synthetic FAKE secret fixtures in test files (test-path-scoped, not live)"
paths = [
  '''.*/tests?/.*''',
  '''(^|.*/)test_[^/]*\.py$''',
  '''(^|.*/)[^/]*_test\.py$''',
]

# --- Allowlist 5: agent-self/harness enshrined test fixtures ---------------------
# The enshrined shared lifecycle harness (agent-self/harness/ — a byte-exact projection of
# the live ~/.agents/harness) ships tests that embed synthetic FAKE secrets as INPUTS so its
# secret-guard / redaction modules can prove they detect and mask every form (AKIA-shaped AWS
# key, ghp_/github_pat_ tokens, xoxb-/sk- tokens, a dummy JWT, a placeholder PEM). They live
# ONLY under the tests/ tree. Already covered transitively by Allowlist 4's test-path globs
# (verified: gitleaks 8.30.1 reports no leaks over the tree); pinned explicitly here so the
# waiver survives any future narrowing of those globs. Non-test harness SOURCE is NOT waived —
# a real secret committed outside tests/ still fails the gate.
[[allowlists]]
description = "agent-self/harness enshrined synthetic FAKE test fixtures (not live)"
paths = [
  '''agent-self/harness/tests/.*''',
]

# harness-sota-2026-07-18 Codex analysis corpus — a FROZEN, historical DATA corpus (608 markdown
# analysis artifacts), not source code. gitleaks' noisy generic-api-key rule false-positives on its
# content: cited Codex rollout session UUIDs (e.g. 019f7470-0ddf-7c63-b09a-d4c35b6f7111), ALL-CAPS
# token-budget metrics (MIN_LINE_COST_TOKENS, SOURCE_DESC_CHARS, TRUNCATED_COUNT ...), and
# percent-encoded citation URLs that the CI action's bundled gitleaks decodes and re-scans (local
# gitleaks 8.30.1 does not, hence the local-vs-CI split). Confirmed FP: the single flag is
# P1C06.md:108, a token-budget claim string. The corpus was independently secret-scanned CLEAN before
# commit — gitleaks 8.30.1 default rules AND a targeted credential-shape sweep
# (OpenAI/GitHub/AWS/Databricks/JWT/private-key/access_token fields) = 0 real credentials over all
# 608 files. Path-scoped so real-secret detection stays ON for every other tree; this folder is
# append-frozen (the synthesis reads it, does not add to it).
[[allowlists]]
description = "harness-sota-2026-07-18 corpus: verified-clean frozen DATA, generic-api-key FP on cited UUIDs/URLs/metrics"
paths = [
  '''harness-sota-2026-07-18-corpus/.*\.md$''',
]

# c2patool-provenance SKILL.md documents c2patool's signing MANIFEST schema, whose
# field is literally named `private_key` and whose value in the worked example is a
# FILENAME ("es256_private.key"), not key material. gitleaks' private-key/generic
# rule matches the field name. Verified FP: the only flag is the manifest example at
# SKILL.md:36, the value is a relative path, and the surrounding prose (line 44)
# explains it resolves against CWD or the C2PA_PRIVATE_KEY env var — i.e. the skill
# deliberately teaches keeping the key OUT of the repo. Path-scoped so real
# private-key detection stays ON everywhere else.
[[allowlists]]
description = "c2patool-provenance SKILL.md: private_key is a c2patool manifest FIELD NAME whose example value is a filename, not a secret"
paths = [
  '''skills/c2patool-provenance/SKILL\.md$''',
]

# chatgpt_desktop v1 raw_stream fixtures — captured ChatGPT stream traces, frozen test DATA
# enumerated by the already-committed MANIFEST.json (fixture_path + sha256 + bytes per entry).
# gitleaks' noisy generic-api-key rule fires 1053 times across the 13 snapshots on the literal
# token `"key": "<slug>"`. Confirmed FP by ENUMERATING THE FULL VALUE SET, not by sampling:
# all 2583 occurrences collapse to just 21 distinct values, and every one is a React-style UI
# list identifier for a rendered transcript element —
#   chatgpt-reasoning-group-0 · assistant-message-0 · user-message-<slug>-0 ·
#   reasoning-<slug>-0 · web-search-<slug>-0
# They appear inside `turns[].itemKeys`, i.e. structural render keys, not credentials. The
# files were independently swept for real credential shapes (JWT/eyJ, sk-, sk-ant-, AKIA,
# ASIA, ghp_, github_pat_, dapi, xox*, __Secure-, Bearer, PEM) = 0 hits. Baseline control:
# the same gitleaks 8.30.1 + this config over origin/main reports no leaks, so the 1053 are
# introduced by these fixtures alone. Only 12 of the 21 values actually trip the rule (the
# `reasoning-<slug>-<n>` ones — the rest lack the entropy), which is what the regex below pins.
#
# DELIBERATELY *NOT* PATH-SCOPED. A `paths` waiver here was written first and MEASURED to be
# wrong: gitleaks applies `paths` as a FILE-LEVEL pre-filter, so the snapshot scanned ~0 bytes
# instead of 58 KB and a real secret dropped into the same file would have been invisible
# (`condition = "AND"` does not prevent the file-level skip). This waiver is therefore
# finding-level — `regexTarget = "secret"` with an anchored pattern — so the files are still
# read in full and every other rule still applies to them.
#
# Verified by a 4-arm mutation test, not by assumption:
#   ARM 0  real ghp_ token in a scratch dir      -> FIRES     (detector alive)
#   ARM 1  fixture dir with this config          -> 1,782,739 bytes READ (not skipped)
#   ARM A  fixture dir unmodified                -> 0 leaks   (the FP is waived)
#   ARM B  real ghp_ token injected INTO snap_004 -> FIRES     (still caught)
[[allowlists]]
description = "chatgpt_desktop raw_stream fixtures: generic-api-key FP on React UI list keys (itemKeys), verified over the full 21-value set"
regexTarget = "secret"
regexes = [
  '''^reasoning-[a-z0-9]{5,8}-\d+$''',
]

# --- Allowlist 4: e2e-wave synthetic DETECTOR-CONTROL fixtures -------------------
# Five findings introduced by the 2026-08-12 six-lane wave. All are deliberately
# credential-SHAPED strings that exist so a detector has something to detect; none is live.
# Classified by structure, never by reading the value into a transcript:
#
#   ghp_...  (x2, ADV-0041)  40 chars. The artifact's own probe command reads
#       "logs_redaction_probe.py (imports plugin.logs.redact and passes a record holding
#        identity tokens + A CREDENTIAL POSITIVE CONTROL)"
#       and the match sits in the `api_key` field of the probe INPUT dict passed TO the
#       redactor, inside an audit OF redaction. Waiving the redaction test's own positive
#       control is the only way that test can exist in a scanned repo.
#   ADV0... (x1, ADV-0037)  33 chars, PREFIXED WITH ITS OWN UNIT ID -- a fixture by
#       construction; no issuer emits a key namespaced to this repo's work-unit numbering.
#   recommendation (x2, AUD-0020 probe1-manifests.json)  a 14-letter all-lowercase English
#       word in a `package_dir` field (it is literally "reconciliation"). A LinkedIn client id is alphanumeric with digits;
#       this is a directory name and a pure false positive.
#
# FINDING-LEVEL, NOT PATH-SCOPED -- deliberately, and for the reason allowlist 3 documents:
# gitleaks applies `paths` as a FILE-LEVEL pre-filter, so a path waiver would stop these
# files being read at all and a REAL secret dropped into them later would be invisible.
# These regexes are anchored to the exact fixture shapes, so every other rule still reads
# every byte of those files. The ghp_ pattern pins prefix, length AND suffix rather than
# embedding the token, so the waiver cannot be reused as a blanket ghp_ escape.
[[allowlists]]
description = "e2e-wave synthetic detector-control fixtures (redaction positive control, unit-id-prefixed fixture, dictionary-word package_dir FP)"
regexTarget = "secret"
regexes = [
  '''^ghp_[A-Za-z0-9]{32}Q7r8$''',
  '''^ADV0[0-9]{3}[A-Za-z0-9_-]{20,30}$''',
  '''^reconciliation$''',
]

# --- Allowlist: P2/adversarial-wave evidence digests + unit-id canaries ----------
# The 2026-08-20 command-center wave (commit e760762c) landed receipts whose evidence
# probes each carry a `fingerprint` field — a SHA-256 (64-hex) or SHA-1/git-commit
# (40-hex) digest of the probe output. gitleaks' generic-api-key rule fires 1,688
# times on command-center/receipts/BLD-0031.json alone, and the sourcegraph rule
# matches a cited git commit SHA (f7fac7b4...) in CC-0011.json. Enumerated over the
# full introduced range (f7fac7b4..3bbdd085): 1,750 of 1,759 findings are pure
# 40/64-lowercase-hex digests; the remaining 9 collapse to 4 distinct values, all
# unit-id-prefixed detector canaries (ADV0097-MINORITY-*/MAJORITY-*,
# ADV-0043-probe2-live) or a config literal (MaxAgeHours=6). No real credential
# shape (sk-, ghp_, AKIA, eyJ, PEM, xox*) appears in the introduced findings.
#
# FINDING-LEVEL, NOT PATH-SCOPED — same reason as the fixtures waiver above:
# gitleaks applies `paths` as a FILE-LEVEL pre-filter, so a path waiver would stop
# reading these receipts entirely and a real secret added to one later would be
# invisible. Anchored full-string hex is a digest by construction: no issuer emits
# a credential that is exactly a bare lowercase hex hash, and any prefixed token
# (sk-..., ghp_...) fails the anchor and still fires.
[[allowlists]]
description = "P2-wave evidence digests (40/64-hex fingerprints) + unit-id-prefixed canaries, enumerated over f7fac7b4..3bbdd085"
regexTarget = "secret"
regexes = [
  '''^[0-9a-f]{64}$''',
  '''^[0-9a-f]{40}$''',
  '''^ADV-?0[0-9]{3}-[A-Za-z0-9][A-Za-z0-9-]{3,40}$''',
  '''^MaxAgeHours=\d+$''',
]
