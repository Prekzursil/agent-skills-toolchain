  - "The Zenodo deposit files under 'Data and software', never under Publications."
  - "pbinfo is always named as Romania's national HIGH-SCHOOL competitive-programming judge, always carries the full numbers, and always carries 'as of September 2026'."
  - "The GRACE metric sentence renders in full or not at all."
  - "'open-source' is used only for a repository that has a LICENSE file."
  name_rule: >-
