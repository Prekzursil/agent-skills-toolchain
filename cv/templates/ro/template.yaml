# -------------------------------------------------------------------------------------
# DOCUMENT-LEVEL PATCHES to the emitted RenderCV intermediate.
# -------------------------------------------------------------------------------------
intermediate:
  locale:
    phrases:
      # build.py's Romanian pack leaves RenderCV's English phrase in place, which
      # prints "Licenta in Informatica" in a Romanian CV.
      degree_with_area: "DEGREE, specializarea AREA"
  entries:
    - section: Educație
      match:
        institution: Universitatea Titu Maiorescu
      set:
        date: "2022 - 2025"
      unset: [start_date, end_date]
      reason: >-
        profile.yaml records only the YEARS 2022 and 2025 for the bachelor's.
        RenderCV expands a bare year into a month and prints "ian 2022 - ian
        2025", asserting months nobody verified.

# -------------------------------------------------------------------------------------
checks:
  required_sections:
    - Profil
    - Experiență
    - Proiecte
    - Competențe
    - Educație
    - Limbi străine
    - Distincții

  page1_must_contain:
    - Andrei-Mihai Visalon
    - andrei-mihai.visalon@s.unibuc.ro
    - București
    - Profil
    - Experiență
    - momentstudio.ro
    - DINUPLAST SRL
    - Proiecte
    - Reframe

  trace_threshold: 0.70
  master_threshold: 0.55

  bullets_exempt:
    - "Perioada:"                  # the Romanian date note, generated by the template
    - "Dates:"                     # the English fallback, if a date note is ever missed

  # D10 — the Romanian text must not blow the layout: ~10% expansion is expected,
  # and the cap is 20% of the English document's text length, at the same 2 pages.
  reference_pdf: out/templates/ats-en/Andrei-Mihai_Visalon_ATS_EN.pdf
  max_expansion: 1.20

  numbers_allow:
    - text: "40"
      reason: country code of the owner's phone number, printed in the header
    - text: "0740"
      reason: national prefix + first group of the owner's phone number (header)
    - text: "740"
      reason: first group of the owner's phone number (header)
    - text: "935"
      reason: second group of the owner's phone number (header)
    - text: "228"
      reason: third group of the owner's phone number (header)
    - text: "03141"
      reason: digits inside the LinkedIn vanity URL printed in the header
    - text: "170"
      reason: digits inside the LinkedIn vanity URL printed in the header
