# =====================================================================================
# academic.design.yaml — the RenderCV `design` + `locale` block for the academic CV.
# Merged verbatim into the emitted document by emit.py.
#
# Verified against RenderCV 2.8 on this machine (schema:
#   .venv/Lib/site-packages/rendercv/schema/models/design/classic_theme.py).
#
# RUNNING HEADER, honestly described: RenderCV's repeating per-page element is the
# FOOTER (`design.page.show_footer` + `design.templates.footer`), and its `top_note`
# renders on the FIRST PAGE ONLY. So the brief's "running header with page numbers"
# is implemented as a running FOOTER carrying the name, the document kind and
# PAGE_NUMBER/TOTAL_PAGES on every page, plus a first-page dateline. That is the
# repeating identification an academic reader needs when pages are separated; calling
# it a header would be a claim the renderer does not support.
# =====================================================================================

design:
  theme: engineeringresumes

  page:
    size: a4                      # A4 everywhere (owner decision)
    top_margin: 1.6cm
    bottom_margin: 1.6cm
    left_margin: 1.6cm
    right_margin: 1.6cm
    show_footer: true             # the running element, on EVERY page
    show_top_note: true           # first page only — a dateline, so a stale copy is obvious

  templates:
    # Running footer: identifies the document if a page is separated from the set,
    # which is the entire reason an academic CV is paginated this way.
    footer: "*NAME — Curriculum Vitae — page PAGE_NUMBER of TOTAL_PAGES*"
    top_note: "*LAST_UPDATED CURRENT_DATE*"
    single_date: "MONTH_ABBREVIATION YEAR"

  typography:
    alignment: justified-with-no-hyphenation
    font_size:
      name: "20pt"                # smaller than the resume default: the record leads
      section_titles: "1.1em"

  section_titles:
    type: with_full_line
    space_above: "0.45cm"
    space_below: "0.25cm"

  sections:
    space_between_regular_entries: "0.34cm"
    space_between_text_based_entries: "0.14cm"

  entries:
    allow_page_break: false       # an entry does not straddle a page break
    side_space: "0cm"
    highlights:
      space_above: 0.08cm
      space_between_items: 0.08cm

  header:
    connections:
      separator: "|"
      show_icons: false
      display_urls_instead_of_usernames: true

locale:
  language: english
