# Codex profile: audit-readonly-max  (scoping manifest: audit-readonly-max.scope.json)
# Deep read-only audits. Read-only sandbox, no approvals, max reasoning, live web.
# ONLY real, --strict-config-clean codex keys live here (spec G6). The MCP scoping
# lives in the side-car .scope.json (codex never parses it). Mode M1 = the codex-invoke
# skill computes the difference-disable set (live_base − mcp_allowlist) at spend time
# and materializes it as `-c mcp_servers.<x>.enabled=false` flags — so NO static
# disable lines belong in this file.
model = "gpt-5.6-sol"
model_reasoning_effort = "max"
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "live"

[shell_environment_policy]
inherit = "core"
