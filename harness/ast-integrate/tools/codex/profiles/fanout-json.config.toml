# Codex profile: fanout-json  (scoping manifest: fanout-json.scope.json)
# Parallel detached fan-out with structured output. Read-only, no approvals, max
# reasoning, no web. Mode M2a = FULL SEAL / zero-MCP: the codex-invoke skill applies
# `--ignore-user-config` (an exec-LEVEL flag, spec G3) to drop the entire base, and
# supplies NO MCP enable block, so the runtime loads zero MCP servers. The seal itself
# is NOT a config.toml key — only these scalars live here. Structured output rides
# `--output-schema` (spec G5) on the exec rail; this is the SAFE structured-output path
# because with zero MCP servers active the typed-output-vs-MCP landmine cannot fire.
model = "gpt-5.6-sol"
model_reasoning_effort = "max"
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "disabled"

[shell_environment_policy]
inherit = "core"
