[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tst0333-crit"
version = "0.0.1"
description = "TST-0333 critical-suite fixture: console-script versus python -m"
requires-python = ">=3.10"

[project.scripts]
tst0333-crit = "tst0333_crit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
