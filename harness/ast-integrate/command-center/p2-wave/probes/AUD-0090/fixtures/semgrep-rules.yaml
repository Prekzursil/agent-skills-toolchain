rules:
  - id: aud0090-crlf
    message: Carriage-return byte present (Windows CRLF worktree vs LF blob)
    languages: [regex]
    severity: INFO
    pattern-regex: "\\r"
  - id: aud0090-eval
    message: eval(...) call
    languages: [python]
    severity: WARNING
    pattern: eval(...)
  - id: aud0090-exec
    message: exec(...) call
    languages: [python]
    severity: WARNING
    pattern: exec(...)
