<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>CNF-0062 200-but-quote-absent</title></head>
<body>
  <h1>Reachable page that does not contain the recorded quote</h1>
  <p>
    HTTP 200 is not evidence that a citation still says what we claimed.
    This page is deliberately missing the live quote so a matcher that
    treats reachability as success is exposed.
  </p>
</body>
</html>
