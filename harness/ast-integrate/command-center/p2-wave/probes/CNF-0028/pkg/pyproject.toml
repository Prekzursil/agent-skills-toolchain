[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnf0028-fix"
version = "0.1.0"
description = "CNF-0028 clean-venv packaging confirmation fixture"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cnf0028-fix = "cnf0028_fix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cnf0028_fix = ["data/payload.txt"]
