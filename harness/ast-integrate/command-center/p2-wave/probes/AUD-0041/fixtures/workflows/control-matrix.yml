# Known-matrix fixture: 3 os x 2 py - 1 exclude + 1 include = 6 legs.
# Bare `on:` is the YAML 1.1 boolean-True trap the parser must survive.
name: control-matrix
on: [push]
jobs:
  legs:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        py: ['3.11', '3.12']
        exclude:
          - os: macos-latest
            py: '3.11'
        include:
          - os: ubuntu-latest
            py: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - name: matrix-echo
        run: echo hi
