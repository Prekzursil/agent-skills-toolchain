[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aud0043-subject"
version = "0.1.0"
description = "AUD-0043 CI-versus-local invocation fixture (pytest source vs installed console script)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aud0043-suite = "aud0043_pkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aud0043_pkg*", "aud0043_extra*"]
