name: quality
on:
  push:
jobs:
  tests:
    name: gate-known-gated-suite
    runs-on: ubuntu-latest
    steps:
      - name: run known gated suite
        run: python -m pytest known_gated/tests -q
      - name: run cwd gated suite
        working-directory: cwd_gated
        run: python -m pytest tests -q
