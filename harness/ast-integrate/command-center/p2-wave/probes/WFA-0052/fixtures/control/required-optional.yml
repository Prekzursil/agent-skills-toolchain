name: control-required-optional
on: [push]
jobs:
  required-gate:
    name: required lint
    runs-on: ubuntu-latest
    steps:
      - name: required-step
        run: echo required
  optional-shadow:
    name: optional shadow probe
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: optional-step
        continue-on-error: true
        run: echo shadow
  dependabot-only:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: gated-merge
        run: echo merge
