name: control-matrix
on: [push]
jobs:
  legs:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        py: ["3.11", "3.12"]
        exclude:
          - os: macos-latest
            py: "3.11"
        include:
          - os: ubuntu-latest
            py: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - name: echo-leg
        run: echo hi
  plain:
    runs-on: ubuntu-latest
    steps:
      - name: no-matrix
        run: echo no-matrix
