name: quality
'on':
  pull_request: {}
  push: {}
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    name: gate-lint-format (ruff)
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: gate-lint-format ruff (install)
      run: python -m pip install --upgrade pip pip install ruff==0.15.17
    - name: gate-lint-format ruff check
      run: ruff check --output-format=github .
    - name: gate-lint-format ruff format --check
      run: ruff format --check .
    - name: charter consistency check
      run: bash .quality/charter_check.sh
    - name: monitorcore vendor-drift (tools == vendored)
      run: diff -r --exclude=__pycache__ \ tools/monitorcore/monitorcore \ skills/workflow-monitor/monitorcore
    - name: acceptance-review helper drift (canonical == CI projection)
      run: diff \ .agents/skills/acceptance-review/scripts/acceptance_review.py \ ci/skills-allowlist/acceptance-review/scripts/acceptance_review.py
  types:
    runs-on: ubuntu-latest
    name: gate-types (basedpyright)
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - run: pip install basedpyright==1.39.8
    - name: gate-types mcp-manager (source)
      run: pip install -e ".[dev]" basedpyright core ui app.py
    - name: gate-types scholarly-access-mcp (source)
      run: pip install -e . basedpyright scholarly_access
    - name: gate-types taskwatch_monitor (source)
      run: pip install -e ".[dev]" basedpyright core probes cli mcp_server hooks ui
    - name: gate-types monitorcore (source)
      run: pip install -e ".[dev]" basedpyright monitorcore
    - name: gate-types agentspec (source)
      run: pip install -e ".[dev]" basedpyright agentspec
    - name: gate-types mcpctl (source)
      run: basedpyright mcpctl
    - name: gate-types agentrail (source)
      run: basedpyright agentrail
    - name: gate-types mcpapply (source)
      run: basedpyright mcpapply
    - name: gate-types harness (source)
      run: printf '%s\n' '{"typeCheckingMode":"standard","pythonVersion":"3.11","include":["harness"],"exclude":["harness/tests","**/__pycache__","**/backups"]}'
        > pyrightconfig.json basedpyright
  test-node:
    runs-on: ubuntu-latest
    name: gate-tests-coverage (node workspaces)
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - run: npm ci
    - run: npm test
    - name: gate-tests-coverage hacktricks-mcp-server
      run: npm ci npm test
    - name: gate-tests-coverage agentspec-js (100% line+branch, census-guarded)
      run: npm test
    - name: gate-tests-coverage agentspec parity oracle (python <-> js, byte-identical)
      run: npm run parity
  test-python:
    runs-on: ubuntu-latest
    name: gate-tests-coverage (python packages)
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: gate-tests-coverage mcp-manager
      run: pip install -e ".[dev]" pytest --cov=. --cov-branch --cov-report=term-missing --cov-fail-under=100
    - name: gate-tests-coverage scholarly-access-mcp
      run: pip install -e . pytest pytest-cov pytest --cov=scholarly_access --cov-branch --cov-report=term-missing --cov-fail-under=100
    - name: gate-tests-coverage taskwatch_monitor
      run: pip install -e ".[dev]" pytest --cov=. --cov-branch --cov-report=term-missing --cov-fail-under=100
    - name: gate-tests-coverage monitorcore
      run: pip install -e ".[dev]" pytest --cov=monitorcore --cov-branch --cov-report=term-missing --cov-fail-under=100
    - name: gate-tests-coverage wfmon adapter contract (skills/workflow-monitor)
      run: pip install pytest pytest tests/test_source.py -q
    - name: gate-tests-coverage mcpctl
      run: pip install -e ".[dev]" pytest --cov=mcpctl --cov-branch --cov-report=term-missing --cov-fail-under=100
    - name: gate-tests-coverage mcpapply
      run: pip install -e ../mcpctl pip install -e ".[dev]" pytest -m "not live" --cov=mcpapply --cov-branch --cov-report=term-missing
        --cov-fail-under=100
    - name: gate-tests-coverage stdin-server
      run: pip install pytest pytest-cov pytest --cov=stdin_server --cov-branch --cov-report=term-missing --cov-fail-under=100
    - name: gate-tests-coverage harness-drift
      run: pip install pytest pytest-cov pytest --cov=harness_drift --cov-branch --cov-report=term-missing --cov-fail-under=100
    - name: gate-tests-coverage command-center
      run: pip install pytest python -m pytest tools/command-center/tests -q python tools/command-center/validate.py python
        tools/command-center/render.py --check
    - name: gate-tests-coverage measure-guard
      run: pip install pytest python -m pytest tools/measure-guard/tests -q python tools/measure-guard/suitefloor.py --suite
        command-center python tools/measure-guard/refcheck.py python tools/measure-guard/wudeps.py python tools/measure-guard/jsonparse.py
    - name: gate-tests-coverage agentspec
      run: pip install -e ".[dev]" pytest -m "not live" --cov=agentspec --cov-branch --cov-report=term-missing --cov-fail-under=100
    - name: gate-tests-coverage agentrail
      run: pip install -e ../agentspec pip install -e ".[dev]" pytest -m "not live" --cov=agentrail --cov-branch --cov-report=term-missing
        --cov-fail-under=100
    - name: gate-tests-coverage crcp (credential egress; measured, not 100%-gated)
      run: pip install pytest PYTHONPATH="$PWD:$PWD/crcp" pytest tests -q
    - name: gate-tests-coverage harness (enshrined runtime; measured, not 100%-gated)
      run: pip install pytest pytest-cov pyyaml python -m pytest agent-self/harness/tests -q --cov=agent-self/harness --cov-branch
        --cov-report=term-missing
    - name: triage-router standalone regression
      run: python test_triage_router.py
    - name: gate-tests-coverage cmd-rewrite hooks (msys-pathconv + no-pager)
      run: 'python test_msys_pathconv.py python test_hooks.py # pytest-style, so it needs the runner: the broad `pytest hooks/`
        step # --ignores this whole directory, which would leave this suite dead weight. pytest test_updated_input_preservation.py
        -q --import-mode=importlib'
    - name: gate-tests-coverage search-expansion (rrf + searxng config + query plan)
      run: pip install pytest pytest-cov pyyaml pytest --cov=rank_fusion --cov=searxng_config --cov=query_plan --cov-branch
        \ --cov-report=term-missing --cov-fail-under=100
    - name: gate-tests-coverage deployable-doc/code path consistency
      run: python -m pytest ci/tests/test_deploy_doc_consistency.py -q
    - name: gate-tests-coverage program-b register (suite + mutation probe)
      run: python -m pytest ci/tests/test_program_b_register.py -q python docs/program-b/mutation_probe.py
    - name: gate-tests-coverage plugin-cache-reaper (suite + mutation probe)
      run: pip install pytest pytest-cov pytest --cov=reap --cov-branch --cov-report=term-missing --cov-fail-under=100 python
        test_reap_mutations.py
    - name: gate-tests-coverage strict-target hook manifests
      run: python -m pytest ci/tests/test_emit_hook_manifest.py -q python ci/emit_hook_manifest.py --source hooks/hooks.json
        --target codex-plugin --check python ci/emit_hook_manifest.py --source agent-self/config/hooks/hooks.json --target
        codex-plugin --check
    - name: gate-tests-coverage rules tree integrity
      run: python -m pytest ci/tests/test_rules_integrity.py -q
    - name: gate-tests-coverage coverage-authority consistency
      run: python -m pytest ci/tests/test_coverage_authority_consistency.py -q
    - name: gate-tests-coverage rules scope (globally-worded rules stay reachable)
      run: python -m pytest ci/tests/test_rules_scope.py -q
    - name: gate-tests-coverage rules selector inheritance
      run: python -m pytest ci/tests/test_rules_selector_inheritance.py -q
    - name: gate-tests-coverage plan-lint stage-0 + resume manifest
      run: pip install pytest pytest-cov pytest ci/tests/test_plan_lint_stage0.py -q --cov=plan_lint_stage0 \ --cov-branch
        --cov-report=term-missing --cov-fail-under=100
    - name: gate-tests-coverage rules/common rule-vs-code contracts
      run: pytest ci/tests/test_rules_common_contracts.py -q
    - name: gate-tests-coverage rules/commands doc contracts
      run: python -m pytest ci/tests/test_rules_doc_contracts.py -q
    - name: gate-tests-coverage rules doc coherence (review boundary + perl examples)
      run: python -m pytest ci/tests/test_rules_doc_coherence.py -q
    - name: gate-tests-coverage adversarial harness corpus
      run: python -m pytest \ ci/tests/test_harness_corpus_wiring.py \ tools/harness-corpus/test_hook_telemetry.py \ hooks/git-hygiene/test_docs_hygiene.py
        -q
    - name: gate-tests-coverage rules hook-example shape
      run: python -m pytest ci/tests/test_rules_hook_examples.py -q
    - name: gate-tests-coverage event-ledger prune-report + oats
      run: python agent-self/config/hooks/event-ledger/test_prune_oats.py
    - name: gate-tests-coverage review-severity coherence
      run: python -m pytest ci/tests/test_review_severity_coherence.py -q
    - name: gate-tests-coverage hook-manifest provenance
      run: python hooks/_shared/test_manifest_provenance.py
    - name: gate-tests-coverage bounded hook launcher
      run: python hooks/_shared/test_hookrun.py
    - name: gate-tests-coverage event-ledger recovery keystone
      run: python hooks/event-ledger/test_ledger.py
    - name: gate-tests-coverage closed-batch config editor
      run: python -m pytest tools/mcp/closed-batch/tests -q
    - name: gate-tests-coverage crcp control plane
      run: pip install pytest pytest tests -q \ --ignore=tests/test_envelope_v11.py \ --ignore=tests/test_event_key_idempotent.py
        \ --ignore=tests/test_redact.py \ --ignore=tests/test_sse_classify.py
    - name: gate-tests-coverage repomap grounding pack
      run: python tools/repomap/test_repo_map.py
    - name: gate-tests-coverage claim-verify-gate (suite + mutation probe)
      run: python .agents/skills/claim-verify-gate/scripts/claim_gate.py --self-test python .agents/skills/claim-verify-gate/scripts/test_claim_gate.py
        python .agents/skills/claim-verify-gate/scripts/test_claim_gate_mutations.py
    - name: gate-tests-coverage fanout-schema (module + production lint)
      run: npm test npm run lint -- ../../workflows
    - name: gate-tests-coverage hook manifest conformance
      run: python -m pytest hooks/_dispatch/test_wiring.py -q -k hook_manifest_conformance
    - name: browser-rail helper tests (pure logic, no browser)
      run: python -m pytest skills/browser-rail/scripts/test_browser_rail.py -q
    - name: gate-tests-coverage codex-databricks-fanout
      run: python -m pytest skills/codex-databricks-fanout/scripts/tests -q
    - name: gate-tests-coverage codex-databricks-fanout (backends+engine 100%)
      run: python -m pytest tests -q --cov=backends --cov=engine --cov-branch --cov-report=term-missing --cov-fail-under=100
    - name: gate-tests-coverage workflow-authoring lint
      run: pip install pytest pytest-cov pytest --cov=workflow_lint --cov-branch --cov-report=term-missing --cov-fail-under=100
    - name: gate-tests-coverage omniaudit-mcp (vendored; isolated venv)
      run: python -m venv "$RUNNER_TEMP/venv-omniaudit" "$RUNNER_TEMP/venv-omniaudit/bin/python" -m pip install -e ".[test]"
        "$RUNNER_TEMP/venv-omniaudit/bin/python" -m pytest \ --cov=packages/omniaudit --cov=apps --cov=services --cov-branch
        \ --cov-report=term-missing --cov-fail-under=100
    - name: vendored-tree import isolation (shared interpreter stays clean)
      run: 'import importlib.util import sys GENERIC = ("index", "engines", "evaluation") leaked = [] for name in GENERIC:
        spec = importlib.util.find_spec(name) if spec is not None: leaked.append(f"{name} -> {spec.origin}") if leaked: print("Vendored
        generic top-level modules leaked into the SHARED interpreter:") for entry in leaked: print(f" {entry}") print("Install
        that tree into its own venv (see the steps above), not this env.") sys.exit(1) print(f"OK: shared interpreter is clean
        of {GENERIC}.")'
      shell: python
    - name: gate-tests-coverage tool-result-sentinel
      run: python -m pytest -q \ hooks/tool-result-sentinel/test_sentinel_use_vs_mention.py \ hooks/_shared/test_use_vs_mention.py
        python hooks/tool-result-sentinel/test_sentinel.py
    - name: gate-tests-coverage git-hygiene message budget
      run: python -m pytest -q hooks/git-hygiene/test_git_hygiene.py
    - name: gate-tests-coverage deny-credential-reads denylist coverage
      run: python -m pytest -q --import-mode=importlib \ hooks/deny-credential-reads/test_denylist_coverage.py \ hooks/deny-credential-reads/test_deny.py
        \ hooks/deny-credential-reads/test_guard_scope.py
    - name: gate-tests-coverage hooks regression harness
      run: python -m pytest hooks/ -q --import-mode=importlib \ --ignore=hooks/memory-guard/test_scan.py \ --ignore=hooks/cmd-rewrite
    - name: gate-tests-coverage hooks standalone (memory-guard)
      run: python hooks/memory-guard/test_scan.py
    - name: gate-tests-coverage agent-self deployed-config hooks
      run: pytest -q --import-mode=importlib -o addopts="" \ agent-self/config/hooks/claim-guard/test_claim_guard_turn_scope.py
        \ agent-self/config/hooks/cmd-rewrite/test_updated_input_preservation.py \ agent-self/config/hooks/edit-validate/test_edit_validate_roundtrip.py
        \ agent-self/config/hooks/event-ledger/test_replay_goal_isolation.py \ agent-self/config/hooks/memory-guard/test_scan_route_normalization.py
        \ agent-self/config/hooks/test-tamper-guard/test_guard_comment_collision.py \ agent-self/config/hooks/wearables/security/test_egress.py
    - name: gate-tests-coverage harness-corpus (hook-telemetry miner + detector control)
      run: pip install pytest python -m pytest -q
    - name: gate-tests-coverage mcp servers (stdlib-only; per-package rootdir)
      run: pip install pytest set -e for p in search-hub social-hub mcp-host-supervisor \ mcp-http-host proxy-mcp reverse-engineering-mcp-bundle;
        do echo "::group::tools/mcp/$p" ( cd "tools/mcp/$p" && python -m pytest -q ) echo "::endgroup::" done
    - name: gate-tests-coverage cloud-hub (full suite)
      run: pip install pytest python -m pytest -q
    - name: setup python 3.12 for the py312-only trees
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: gate-tests-coverage wearables (py3.12; isolated venv)
      run: '"${{ steps.py312.outputs.python-path }}" -m venv "$RUNNER_TEMP/venv-wearables" "$RUNNER_TEMP/venv-wearables/bin/python"
        -m pip install pytest pytest-cov rdkit "$RUNNER_TEMP/venv-wearables/bin/python" -m pytest \ --cov=wearables --cov-branch
        --cov-report=term-missing --cov-fail-under=100'
    - name: gate-tests-coverage abbyy-finereader-ocr-mcp (vendored; isolated venv)
      run: '"${{ steps.py312.outputs.python-path }}" -m venv "$RUNNER_TEMP/venv-abbyy" "$RUNNER_TEMP/venv-abbyy/bin/python"
        -m pip install -e ".[test]" "$RUNNER_TEMP/venv-abbyy/bin/python" -m pytest \ --cov=index --cov=engines --cov=evaluation
        --cov-branch \ --cov-report=term-missing --cov-fail-under=100'
  test-platform:
    runs-on: ubuntu-latest
    name: gate-tests-coverage (platform)
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: gate-tests-coverage platform (pinned deps)
      run: pip install pytest==8.3.3 jsonschema==4.25.1
    - name: gate-tests-coverage platform (collection floor)
      run: python tools/measure-guard/suitefloor.py --suite platform
    - name: gate-tests-coverage platform (suite)
      run: python -m pytest platform -q -p no:cacheprovider
  sast:
    runs-on: ubuntu-latest
    name: gate-sast (opengrep)
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: gate-sast opengrep (curated in-repo ruleset)
      run: curl -fsSL -o /usr/local/bin/opengrep \ https://github.com/opengrep/opengrep/releases/download/v1.23.0/opengrep_manylinux_x86
        chmod +x /usr/local/bin/opengrep opengrep scan --config .quality/opengrep --error \ --exclude node_modules --exclude
        .venv --exclude vendor \ --exclude dist --exclude out --exclude build .
  secrets:
    runs-on: ubuntu-latest
    name: gate-secrets (gitleaks)
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: '0'
    - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
    - name: gate-secrets full-history scan (range-independent)
      run: curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \ "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256} $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c - tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C
        "$RUNNER_TEMP" gitleaks "$RUNNER_TEMP/gitleaks" version "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact
        --exit-code 1 .
  deps:
    runs-on: ubuntu-latest
    name: gate-deps (osv-scanner)
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2
      with:
        scan-args: '--config=osv-scanner.toml

          --lockfile=pac'
