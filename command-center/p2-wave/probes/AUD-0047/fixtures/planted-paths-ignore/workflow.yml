# Planted negative-control workflow for AUD-0047.
# Gate claims to protect command-center/receipt_validate.py via an explicit step,
# but paths-ignore excludes command-center/** so the gate never sees that file.
name: planted-paths-ignore-control

on:
  push:
    paths-ignore:
      - "command-center/**"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "command-center/**"

jobs:
  gate-planted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gate-planted validate receipts
        run: python command-center/receipt_validate.py
