[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aud0026-planted"
version = "0.0.0"
description = "AUD-0026 planted control: shipped module imports a declared-dev-only package"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools]
packages = ["aud0026_planted"]

[tool.pytest.ini_options]
testpaths = ["tests"]
