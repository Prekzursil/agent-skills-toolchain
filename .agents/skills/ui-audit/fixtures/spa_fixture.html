<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPA Render Fixture</title>
</head>
<body>
  <!-- Empty mount point — like a Vite/React/Angular shell before hydration.
       A naive snapshot taken at domcontentloaded sees ONLY this empty root. -->
  <div id="root"></div>

  <script>
    // (1) A console error emitted DURING load. The old capture attached its
    //     console listener AFTER navigation, so this was silently dropped.
    console.error('SPA boot warning: synthetic console error during load');

    // (2) An uncaught exception shortly after load — the Reframe-style "render
    //     crash". The old capture had no pageerror listener at all, so a crash
    //     produced an empty bundle with no recorded cause.
    setTimeout(function () { throw new Error('Reframe-style render crash'); }, 30);

    // (3) The actual app content renders asynchronously, AFTER domcontentloaded.
    //     Capture must wait (networkidle / --wait-selector / settle) to see it.
    setTimeout(function () {
      var root = document.getElementById('root');
      root.innerHTML =
        '<h1 id="app-title" style="margin: 13px;">Rendered Heading</h1>' +
        '<button id="spa-action" type="button" style="padding: 22.5px;">Action</button>' +
        '<p id="app-body">The SPA has rendered its content.</p>';
    }, 120);
  </script>
</body>
</html>
