schema_version: 1
id: shared-development-lifecycle
stages:
  - discover
  - recall
  - grill
  - plan
  - plan-review
  - execute
  - spec-review
  - quality-review
  - acceptance
  - capture
limits:
  max_threads: 4
  max_depth: 1
handoff:
  format: structured-summary
  required_fields:
    - original_goal
    - completed
    - evidence
    - remaining
    - risks
providers:
  claude:
    skill_invocation: slash-command-or-skill-tool
    task_tracking: provider-native
    subagents: agent-tool
    git_write: allowed-by-user-policy
  codex:
    skill_invocation: dollar-name-or-skills-menu
    task_tracking: provider-native
    subagents: spawn-agent
    git_write: delegate-to-claude
  antigravity:
    skill_invocation: provider-native
    task_tracking: provider-native
    subagents: provider-native
    git_write: allowed-by-user-policy
rules:
  - Keep one writer per file or code path.
  - Never prefix a handoff with raw subagent output.
  - Review implementation against the specification before quality review.
  - Require fresh verification evidence before acceptance.
  - Under AgentBridge, Codex reports changes and delegates every git write to Claude.

