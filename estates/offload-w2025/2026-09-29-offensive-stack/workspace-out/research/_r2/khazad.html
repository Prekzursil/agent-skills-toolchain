<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KHAZAD - You are in the queue please wait before continuing.</title>
    <style>
        :root { --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --page:#f7f9fc; --panel:#fff; --border:#e3e9f1; --heading:#152238; --message:#35445b; --muted:#718096; --badge-bg:#eef4ff; --badge-text:#315caa; --badge-border:transparent; --bar-bg:#e8edf5; --bar-border:transparent; --accent:#5278bd; --accent-hover:#4169ad; --button-bg:#5278bd; --button-border:#5278bd; --button-text:#fff; --footer:#a0a8b5; --footer-hover:#687386; --shadow:0 14px 38px rgba(15,23,42,.07); --fingerprint-radius:4px; }
        html[data-theme="dark"] { --font:"Helvetica","Arial",sans-serif; --page:#141414; --panel:#1e1e1e; --border:#353535; --heading:#fff; --message:#fff; --muted:#b8b8b8; --badge-bg:#2d2d2d; --badge-text:#fff; --badge-border:#4b4b4b; --bar-bg:#2d2d2d; --bar-border:#4b4b4b; --accent:#3eb489; --accent-hover:#4ac79a; --button-bg:#2d2d2d; --button-border:#4b4b4b; --button-text:#fff; --footer:#a0a0a0; --footer-hover:#fff; --shadow:none; --fingerprint-radius:12px; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--page); color:var(--heading); font-family:var(--font); }
        .shell { width:min(100%,440px); text-align:center; }
        .box { padding:30px; background:var(--panel); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); }
        .badge { display:inline-block; padding:5px 10px; border:1px solid var(--badge-border); border-radius:999px; background:var(--badge-bg); color:var(--badge-text); font-size:12px; font-weight:650; letter-spacing:.01em; }
        h1 { margin:15px 0 4px; color:var(--heading); font-size:25px; line-height:1.2; }
        .label { margin:0 0 20px; color:var(--muted); font-size:14px; }
        .fingerprint { margin:0 0 18px; }
        .fingerprint img { display:block; max-width:100%; height:auto; margin:0 auto 7px; border-radius:var(--fingerprint-radius); }
        .small { color:var(--muted); font-size:12px; line-height:1.55; }
        .message { margin:0; color:var(--message); font-size:15px; line-height:1.6; }
        .bar { width:100%; height:8px; margin:21px 0 13px; overflow:hidden; border:1px solid var(--bar-border); border-radius:999px; background:var(--bar-bg); }
        .bar-fill { height:100%; width:0; border-radius:inherit; background:var(--accent); animation:fill linear forwards; animation-duration:5s; }
        @keyframes fill { from { width:0; } to { width:100%; } }
        .btn { display:inline-block; margin-top:17px; padding:10px 18px; border:1px solid var(--button-border); border-radius:12px; background:var(--button-bg); color:var(--button-text); font-size:14px; font-weight:650; text-decoration:none; opacity:0; pointer-events:none; animation:showButton .35s forwards; animation-delay:5s; }
        .btn:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
        @keyframes showButton { to { opacity:1; pointer-events:auto; } }
        .footer { margin-top:16px; font-size:11px; color:var(--footer); }
        .footer a { color:inherit; text-decoration:none; }
        .footer a:hover { color:var(--footer-hover); text-decoration:underline; }
    </style>
</head>
<body>
<div class="shell">
    <main class="box">
        <span class="badge">Secure access</span>
        <h1>KHAZAD</h1>
        <p class="label">You are in the queue please wait before continuing.</p>
        <div class="fingerprint small">
            <img src="/_queue/fingerprint.webp?theme=dark" alt="Official KHAZAD onion address">
            <div>Compare this fragment with the address visible in Tor Browser.</div>
        </div>
                    <p class="message">Please wait a moment. We are preparing access to the service.</p>
                <div class="bar"><div class="bar-fill"></div></div>
        <p class="small">Do not refresh this page or open multiple tabs.</p>
        <a class="btn" href="/">Continue</a>
    </main>
    <footer class="footer"><a href="https://codeberg.org/mnull/OnionAccessGateway/" target="_blank" rel="noopener noreferrer">Source code</a></footer>
</div>
</body>
</html>
