# cs.conf -- SINGLE SOURCE OF TRUTH for the Claude Science control scripts.
#
# Deliberately POSIX `KEY=VALUE`, no spaces around `=`, no quoting, no expansion:
# that is the ONLY syntax both sides can read without a parser library --
#   bash        : `source cs-lib.sh`  (which sources this file directly)
#   PowerShell  : `. cs-lib.ps1`      (which parses this file in ~8 lines)
# Anything fancier (arrays, $(...), quoting) breaks one of the two halves.
#
# PRECEDENCE, highest first:  environment variable  >  this file  >  in-script default.
# So `$env:CS_PORT = 8123; cs status` works without editing anything, and a missing or
# unreadable cs.conf degrades to the same values the scripts shipped with.
#
# BACKUP ROOTS ARE STORED IN WSL FORM ON PURPOSE. `/mnt/d/X` is what the bash scripts need;
# cs-lib.ps1 derives the Windows form (`D:\X`) from it, so the path exists in ONE place.

CS_HOST=127.0.0.1
CS_PORT=8000
CS_DISTRO=Ubuntu

# Wedge detection. A healthy 401 answers in <200ms; the failure mode is an ACCEPTED-but-frozen
# socket, so latency -- not HTTP status -- is the signal.
CS_SLOW_MS=4000
CS_HARD_CAP_MS=8000

# Backup destination (WSL form; the Windows form is derived, never written twice).
CS_BACKUP_ROOT=/mnt/d/Backups/claude-science
CS_BACKUP_KEY_ROOT=/mnt/d/Backups/claude-science-keys

# Health floors.
CS_MIN_WSL_DISK_GB=10
CS_MIN_HOST_RAM_GB=3

# Backup-freshness thresholds, in hours, TIED TO THE REAL CADENCE rather than a round number.
# ClaudeScienceMaintain runs weekly (168h), so 176h = one missed run + 8h slack, and 192h = a
# full day past that. The previous single 200h threshold was arbitrary and had no FAIL state.
CS_BACKUP_WARN_H=176
CS_BACKUP_FAIL_H=192

# Watchdog heartbeat staleness, seconds. MUST exceed (loop sleep 30s + worst-case probe).
# Measured 2026-08-12: a probe took 66,396ms despite a nominal 8,000ms socket cap, because under
# host-RAM pressure the watchdog PROCESS itself is descheduled and no in-process timeout can bound
# that. The old 90s threshold therefore reported a healthy watchdog that was correctly measuring a
# wedge as "STALE - watchdog hung?". 180s clears the measured worst case with margin.
CS_BEAT_STALE_S=180

# Where the Claude Code slash-command files live. Relative = under $HOME. cs-doctor reads
# claude-science.md / cs.md from here and asserts they route to the SAME dispatcher code that is
# actually running -- the check that would have caught the round-1 defect where both files still
# named a stale source checkout (see the "Slash-command route" row in cs-doctor.ps1).
CS_COMMANDS_DIR=.claude/commands
