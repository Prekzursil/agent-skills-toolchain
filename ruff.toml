# Lean quality gate — ruff configuration (gate 1: lint + format + sec-lint).
#
# The CI workflow runs `ruff check` and `ruff format --check` from the repo root
# and relies on this committed config for excludes (the previous inline
# `--exclude **/...` globs were interpreted inconsistently by ruff's CLI
# globstar handling). node_modules, .venv, __pycache__, etc. are already in
# ruff's default excludes.
#
# extend-exclude applies to both `check` and `format` file discovery:
#   - the vendored third-party ralph-orchestrator tree (not our code)
#   - notebook templates under skills/*/assets (user-facing scaffolding, not
#     linted/formatted source)
#   - three ADOPTED third-party skill packs rescued in the 1,756-file harness sweep
#     (microsoft-foundry is `author: Microsoft`; continuous-learning-v2 and
#     protein-interaction-network-analysis ship their own upstream docs). Same
#     rationale as the ralph-orchestrator vendor tree: not our code, so not our lint.
#   - the vendored Databricks notebook SOURCE (the codex-databricks-fanout skill's batch_runner.py,
#     in both dual-write mirrors). It is a notebook export, not a module: `dbutils` is injected by the
#     Databricks runtime and the cell structure puts `from __future__` after widget setup, both of
#     which are valid there and invalid as standalone Python. It is committed so the fan-out chain is
#     reproducible from the repo rather than existing only inside the workspace.
extend-exclude = [
    # Salvaged snapshot of 21 files that existed ONLY in a no-remote, zero-commit directory
    # (`~/source/_advver_M14/scratch`) while nine lanes were writing into it. All 21 had content
    # present nowhere in the canonical object store; five are lane verification deliverables. They
    # were copied with `cp -p` precisely so the bytes and mtimes are the originals, which is the
    # whole value of the snapshot -- `ruff format` would rewrite 12 of the 17 .py files and destroy
    # it. Same trade-off already settled below for `casualty/probes` and `command-center/_*.py`:
    # evidence, not source, so the bytes win. Measured: with this line the gate is green; without
    # it, 12 reformat + 5 lint (F401, E741, three E702). If these ever become maintained source
    # rather than a frozen snapshot, delete this line and format them properly.
    "command-center/ssot/salvaged-from-scratch/**",
    # Salvage of the 5 files the SSOT lane measured as UNREACHABLE from any git ref: 2 living
    # only in the staged index of the `D:/wt-salvage-probe` linked worktree (an index dies with
    # `git worktree remove`, and the blobs are loose objects in the SHARED canonical store that
    # `git gc --prune` may collect), and 3 in an unpushed commit in an independent clone. Their
    # value is byte-identity with the source blob -- `salvage-atrisk.json` records each file's
    # git SHA and a roundtrip hash proving the copy matches, so `ruff format` rewriting them
    # would break the one property that makes them evidence. Same trade-off as the snapshot
    # above. Measured both states: with this line `ruff format --check` is green; without it,
    # 2 of the 5 would be reformatted (`ci/tests/test_codex_profiles.py`,
    # `tools/monitorcore/r0_monitor_live_gate.py`); `ruff check` passes either way. If this
    # content is ever restored as maintained source, it belongs at its real path, formatted --
    # not here.
    "command-center/ssot/salvaged-at-risk/**",
    # Cited-but-ignored root probe scripts, committed byte-unchanged by the SLOP lane.
    # 45 of the 123 `command-center/_*.py` are named inside committed artifacts, so a clone
    # needs them or those citations dangle (see the .gitignore EXCEPTION 2 block). They are
    # evidence, not source: they were written once to answer one question. Same trade-off
    # already settled above for `command-center/casualty/probes` -- there is no per-file escape
    # from `ruff format` that does not itself change the bytes, and a digest-lock check on
    # these files failed its positive control, so the bytes are preserved rather than
    # reformatted on an unproven assumption. Measured: with this line the gate is green
    # (0 reformat, 0 lint); without it, 29 reformat + 9 lint errors.
    "command-center/_*.py",
    # Provenance-locked recovery evidence. Five scripts here are BYTE-IDENTICAL to the scratch
    # originals written by two agents that died mid-run (API error, connection closed mid-response).
    # That byte-match IS the evidence the work was RECOVERED rather than re-authored, and the
    # casualty lane re-measured the sha256 against the scratchpad rather than trusting its own audit
    # (5/5 locked; adv0021_verifier.py is correctly unlocked, round-2-authored with no scratch twin,
    # and happens to be ruff-clean already so this exclusion costs nothing there).
    # There is no per-file escape from `ruff format` that does not itself change the bytes, so the
    # choice is a directory exclusion or destroying the provenance to satisfy a style gate.
    # Verified before adding: command-center/casualty/r2_verify_all.py runs 12/12 PASS, including a
    # fresh-clone step proving both receipts reproduce their declared digest from a clone that never
    # saw this working tree. Requested by the lane that found it, which correctly declared the root
    # ruff.toml outside its own file scope and reported it NOT DONE rather than reaching for it.
    "command-center/casualty/probes",
    # Deliberately-broken CONTROL fixtures. These are inputs a detector must FAIL on, not code:
    # AUD-0006/control/src/core/session_state.py is a single line of ~2,000 'z' characters -- the
    # same shape as the 2,000-'x' blob that a verifier in this program once accepted as a valid
    # artifact. Linting them is a category error; "fixing" the F821 would delete the control and
    # leave a gate that can no longer be shown to fire. Same reasoning as the provenance-locked
    # probes above: the bytes ARE the measurement.
    "command-center/p2-wave/probes/*/control",
    # Frozen third-party skill import, landed by the 2026-08-28 live-harness fold
    # into a lint gate that had no rule for it. The repo's own audit classifies the
    # whole tree as one unit: "frozen import (uniform mtime 2026-04-05)", "dormant
    # SWE-pattern pack; 159/186 not deployed", "promote-select / archive / drop --
    # owner scope call" (docs/audit-design-2026-07-13/A4-skills-dup-matrix.md rows
    # 60/97, C-skills-reconcile.md row 57). Nothing in the repo loads it: the
    # canonical skill root is `.agents/skills`, and a search for a `.agents/library`
    # consumer outside docs/ and command-center/ returns nothing.
    # Measured 2026-09-01: 99 .py files, 457 findings (287 F541 + 93 F401 + 27 F841
    # + 50 others) and 99/99 would be reformatted -- i.e. the entire Python surface
    # is untouched upstream content. Reformatting it would make every future
    # upstream refresh a merge conflict for a pack that may yet be dropped. Same
    # rationale as the ralph-orchestrator vendor tree and the three adopted packs
    # below: not our code, so not our lint. If a pack is ever PROMOTED into
    # `.agents/skills`, it leaves this tree and is linted there like everything else.
    ".agents/library",
    "tools/editor/ralph-orchestrator/vendor",
    # Mirror of the already-excluded `.agents/skills/microsoft-foundry` (author:
    # Microsoft). The dual-write doctrine keeps `skills/` and `.agents/skills/`
    # byte-identical, so excluding only one side was an oversight -- the same pair
    # is already excluded on BOTH sides for codex-databricks-fanout just below.
    # Measured 2026-09-01: 15 .py files, 6 E701 findings, 15/15 would be reformatted.
    # The other two adopted packs (continuous-learning-v2,
    # protein-interaction-network-analysis) are deliberately NOT mirrored here: their
    # `skills/` copies measure clean (0 findings, 5/5 formatted), and excluding a
    # clean path would silently license future drift -- the same trade already
    # settled for `platform/lib/_p12_refute_predicate.py` in [lint.per-file-ignores].
    "skills/microsoft-foundry",
    "skills/codex-databricks-fanout/scripts/batch_runner.py",
    ".agents/skills/codex-databricks-fanout/scripts/batch_runner.py",
    "**/*.ipynb",
    "ci/harness",
    "tools/abbyy-finereader-ocr-mcp",
    "tools/omniaudit-mcp",
    ".agents/skills/continuous-learning-v2",
    ".agents/skills/microsoft-foundry",
    ".agents/skills/protein-interaction-network-analysis",
]

[format]
# Six `platform/` probe scripts cited by committed reports as `python <path>`.
# They existed on ONE disk until SLOP build round 3; a clone could not run them.
# All six pass `ruff check` clean, but `ruff format --check` would rewrite them.
#
# A FORMAT-ONLY exclusion is used rather than an `extend-exclude` entry (which the
# repo uses for `command-center/_*.py` and the salvaged snapshots) because it is
# strictly narrower: `ruff check` stays live on these files, so a real defect
# introduced later is still caught. The trade the repo has already settled three
# times applies -- these are one-shot evidence scripts, and their bytes are what a
# reader is told to reproduce, so a style rewrite costs more than it buys.
#
# If any of them ever becomes maintained source, delete its line and format it.
exclude = [
    "platform/architecture/_probe_crossvendor_alias_hole.py",
    "platform/architecture/_probe_dr_acyclic.py",
    "platform/architecture/_probe_dr_bucketedge.py",
    "platform/architecture/_probe_dr_catalog.py",
    "platform/architecture/_probe_dr_scheduling.py",
    "platform/lib/workflows/_gen_bp5.py",
    # Same trade, same shape: two one-shot OpenRouter `/models` probes that the
    # committed report beside them cites BY FILENAME as its evidence
    # ("live OpenRouter API via two Python probes in this folder
    # (`_tmp_hermes_probe.py`, `_tmp_hermes_endpoints.py` -- 417 models confirmed)",
    # skills/openrouter-routing/openrouter-apps-hermes-uncensored_2026-08-27.md L159).
    # Listed in both dual-write mirrors. Measured 2026-09-01: all four are
    # `ruff check` clean and all four would be rewritten by `ruff format`, so the
    # format-only exclusion keeps a real defect catchable while the cited bytes stay
    # reproducible. Delete these lines if they ever become maintained source.
    "skills/openrouter-routing/_tmp_hermes_probe.py",
    "skills/openrouter-routing/_tmp_hermes_endpoints.py",
    ".agents/skills/openrouter-routing/_tmp_hermes_probe.py",
    ".agents/skills/openrouter-routing/_tmp_hermes_endpoints.py",
]

[lint.per-file-ignores]
# `platform/lib/_p12_refute_predicate.py` is cited by three COMMITTED reports as
# `python platform/lib/_p12_refute_predicate.py`, and existed only on one disk.
# `command-center/slop-report/published-commands-baseline.json` records why it
# stayed uncommitted: one F841 at line 107 (`mp = _write_manifest(...)`, kept as
# a readable receipt of the call) would turn `gate-lint-format` red repo-wide.
#
# A per-file ignore is used rather than an `extend-exclude` entry on purpose. The
# file is frozen evidence for that one rule only; excluding it would also drop it
# out of `ruff format --check`, and it is currently formatted -- so an exclusion
# would silently license future drift in a file the repo now depends on. Measured
# at aff7ebad: the 14 cited `platform/` probes are 14/14 `format --check` clean
# and 13/14 `check` clean, this being the one exception.
"platform/lib/_p12_refute_predicate.py" = ["F841"]
