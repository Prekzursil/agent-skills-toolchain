# Lean quality gate — ruff configuration (gate 1: lint + format + sec-lint).
#
# The CI workflow runs `ruff check` and `ruff format --check` from the repo root
# and relies on this committed config for excludes (the previous inline
# `--exclude **/...` globs were interpreted inconsistently by ruff's CLI
# globstar handling). node_modules, .venv, __pycache__, etc. are already in
# ruff's default excludes.
#
# extend-exclude applies to both `check` and `format` file discovery:
#   - the vendored third-party ralph-orchestrator tree (not our code)
#   - notebook templates under skills/*/assets (user-facing scaffolding, not
#     linted/formatted source)
extend-exclude = ["tools/editor/ralph-orchestrator/vendor", "**/*.ipynb"]
